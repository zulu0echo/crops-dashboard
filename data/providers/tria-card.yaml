context: >-
  Per its Terms of Service, Tria is Threely Dimensions, Inc., governed by Delaware law, and says it is not a bank, money services business, card issuer or other financial institution and does not hold users' funds, collateral or keys. The Terms name Third National, LLC and partners as Card Program Providers that issue the Tria Card and extend credit secured by digital-asset collateral; the card is issued under licence from Visa.

