notes: >-
  Eligibility: no public repository needed to run the product and no published or verified contract, so type is incumbent. Searched 2026-10-07: GitHub org TriaHQ (four repos: an ideathon dataset and forks of relay-server, sdk-testing-grounds, tria-rainbowkit); tria-labs/TriaLabs (unrelated Tria Labs, triafed.com) and triaso (0 repos); gh search repos "tria sdk" (unrelated projects); npm @tria-sdk/core, connect, authenticate(-react/-web), react-native, chains, utils, constants (all 404) and legacy tria-sdk-core/tria-sdk-web 2023 (repository github.com/TriaHQ/tria-core-sdk, 404); docs.tria.so (54 pages incl. CoreSDK, BestPath, Security and TSS, TX Flow, supported networks, all legal pages; only example wallet addresses in SDK samples, no card or collateral contracts); www.tria.so (client-rendered shell). The card terms are a collateral-backed Third National program with a generic Supported Blockchains list; the collateral chain and contracts are not published, so no onchain cell could be scored.

availability:
  model: blocklist
  countries: [ CU, IR, KP, SY, AF, BY, CF, CD, ER, ET, GN, GW, IQ, LB, LY, ML, MM, NI, RU, SO, SS, SD, VE, YE, ZW ]
  note: >-
    From section 4 of Tria's Prohibited Use Policy (the same text is published as the Prohibitions List, which the platform agreement incorporates). It names sanctioned countries "including, without limitation" Cuba, Iran, North Korea and Syria, plus the Crimea, Donetsk and Luhansk regions of Ukraine (sub-national, not listed as codes), and high-risk jurisdictions "including but not limited to" 21 more countries (Myanmar is named twice). Both lists are open-ended, and the platform agreement also excludes any country subject to EU, UK, UN or US sanctions; only named countries are listed here. Card programme variants: the international card terms require attesting that you are not a US citizen; US users have separate US card terms, which name no state limits.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.tria.so/prohibited-use-policy
      detail: Section 4 (Sanctions and Restricted Jurisdictions) names the sanctioned and high-risk jurisdictions where the Tria Card may not be applied for or used.
      quote: "jurisdictions that Tria prohibits due to high money-laundering, fraud, or compliance risk, including but not limited to: Afghanistan, Belarus, Central African Republic"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://docs.tria.so/prohibited-use-policy
      detail: The same section names the sanctioned countries and Ukrainian regions.
      quote: "Cuba, Iran, North Korea, Syria, and the Crimea, Donetsk, or Luhansk regions of Ukraine"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://docs.tria.so/card-terms-international
      detail: The international card terms are for non-US citizens; US users are covered by the separate US card terms.
      quote: "You attest that you are not a United States citizen"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
  checked_at: "2026-10-09"
settlement:
  tokens:
    - symbol: USDC
      class: stablecoin
      backing: fiat
      issuer: Circle
      default: true
  conversion: at_spend
  note: >-
    Inferred from the Card Terms fee schedule, which charges a "USDC Settlement/Deposit" fee; no Tria page names the card-balance token outright. Top-ups from 1,000+ tokens on Bitcoin, Ethereum, Polygon, Base, Arbitrum, Optimism, BSC, Aptos and Solana are swapped by BestPath into "the required currency" and credited to the card balance, which the Card Terms treat as digital-asset collateral liquidated to repay charges; the help centre says crypto is converted at payment time. The collateral chain and contract are not published.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.tria.so/card-terms-international
      detail: The International Card Terms fee schedule lists a USDC settlement and deposit fee of up to 1%.
      quote: "USDC Settlement/Deposit: Up to 1%"
      checked_at: "2026-10-12"
    - tier: documented
      kind: document
      url: https://help.tria.so/en/articles/14854432-what-are-provider-fees
      detail: The help centre says a top-up may swap the deposited asset into the currency the card balance requires, and recommends USDC or USDT on L2s as needing the fewest conversion steps.
      quote: "Converting your specific asset into the required currency"
      checked_at: "2026-10-12"
    - tier: documented
      kind: document
      url: https://help.tria.so/en/articles/13513481-what-are-tria-cards
      detail: The help centre says crypto is converted at payment time.
      quote: "Your crypto is converted at payment time"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
  checked_at: "2026-10-12"

audits:
  searched: >-
    docs.tria.so (all pages, including Security and TSS, TX Flow and the card terms; no audit is mentioned), the TriaHQ GitHub org (no card, wallet or SDK code), Rain's security page (audits under NDA, Sherlock named) and the Sherlock report repo (one Rain report). The international card terms carry Rain's name ("Your Rain Payment Card Terms"). No audit of Tria's app, TSS key infrastructure or BestPath routing is published.
  checked_at: "2026-10-13"
  reports:
    - auditor: Sherlock
      date: "2025-02-11"
      type: contest
      scope: "Shared component: Rain EVM collateral contracts v2 (Beacon, Collateral, Coordinator, Factory), private best-efforts contest"
      url: https://github.com/sherlock-protocol/sherlock-reports/blob/main/audits/2025.02.11%20-%20Final%20-%20Rain%20Private%20Best%20Efforts%20Audit%20Contest%20Report.pdf
      commit: 6f578d5b9c9fa35bbe857959a50fa5aab4fa611a
      repo: https://github.com/SignifyHQ/collateral-contract-evm-v2
      covers_deployed: unknown
      findings: "0 high, 2 medium (statement payoff rounding; missing Chainlink min/max answer check)"
      note: >-
        Logged because the card is a Rain programme (Third National issuer, collateral on Ethereum, Polygon, Optimism or Arbitrum per the card terms). Tria publishes no collateral contract, so the audited code was not tied to this card. The Rain repo is private; contest ran 2-8 December 2024 on b432939a, 6f578d5 is the fix commit.
