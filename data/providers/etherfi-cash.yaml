components:
  - name: cash-v3 contracts (Safe, CashModule, modules, dispatchers)
    role: contracts
    public: true
    license: none
    operator: ether.fi (upgradeable via 2-day timelock)
    required: true
    repo: https://github.com/etherfi-protocol/cash-v3
  - name: ether.fi app and web app (Cash tab)
    role: frontend
    public: false
    license: proprietary
    operator: ether.fi
    required: true
  - name: ether.fi card authorisation backend (ETHER_FI_WALLET_ROLE EOAs)
    role: backend
    public: false
    license: proprietary
    operator: ether.fi
    required: true
  - name: Turnkey owner-key enclave (user signer)
    role: signer
    public: false
    license: proprietary
    operator: Turnkey
    required: true
  - name: Settlement bridger (SETTLEMENT_DISPATCHER_BRIDGER_ROLE)
    role: relayer
    public: false
    license: proprietary
    operator: ether.fi
    required: true
  - name: Rain / Reap card programme (BIN sponsors named in code)
    role: other
    public: false
    license: proprietary
    operator: Rain, Reap
    required: true
  - name: Third National (card issuer per cardholder agreements)
    role: card-issuer
    public: false
    license: proprietary
    operator: Third National
    required: true
  - name: Visa card network
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC vendor (not named in any policy found)
    role: kyc
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Price oracles (Chainlink and others in config)
    role: oracle
    public: true
    license: proprietary
    operator: Chainlink and others
    required: false
  - name: Aave v4 lend market (credit mode)
    role: contracts
    public: true
    license: source-available
    operator: ether.fi deployment of Aave v4
    required: false
  - name: Settlement tokens (USDC by Circle, USDT, EURC)
    role: contracts
    public: true
    license: proprietary
    operator: Circle, Tether
    required: true

