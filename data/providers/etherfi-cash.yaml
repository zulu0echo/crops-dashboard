  model: allowlist
  countries: [ AD, AE, AG, AO, AR, AT, AU, BB, BD, BE, BG, BH, BO, BR, BS, BZ, CH, CL, CO, CR, CZ, DE, DK, DM, DO, EC, ES, FR, GB, GG, GI, GR, GT, GY, HK, HN, HU, ID, IE, IM, IS, IT, JE, JP, KN, KR, KY, LC, LI, LT, LU, LV, MC, MT, MV, MX, MY, NG, NO, NZ, OM, PA, PE, PH, PL, PR, PT, PW, PY, RO, SA, SC, SE, SG, SI, SK, SR, SV, TC, TH, TT, TW, US, UY, VC, VG, VU, ZA ]
  note: >-
    The help-centre article lists 88 countries where a physical card is available, plus Belgium and Ireland (eligible, virtual card only) and the United States. The article says that if a jurisdiction is not listed, you cannot apply. In the US, physical cards are limited to 30 states and DC; US residents contract under the separate U.S. Cardholder Agreements. The documents disagree on three countries, and we take the more restrictive reading. Canada is on the help list, but the Terms of Use say the Services are not available to residents or citizens of Canada, so it is excluded. Croatia and Cyprus are on the help list but also on the Prohibited Activities List's "may include" list of prohibited jurisdictions, so they are excluded. The Prohibited Activities List also bars Cuba, Iran, North Korea, Syria and the Crimea, Donetsk and Luhansk regions of Ukraine; none of these is on the allowlist. The International Cardholder Agreements name no countries.
  evidence:
    - tier: claimed
      by: provider
      kind: document
