slug: ethena-pay
name: Ethena Pay
type: card
website: https://pay.ethena.fi
primary_chain:
  name: Avalanche C-Chain
  chain_id: 43114
  basis: >-
    Ethena Pay names no chain or contract in any document, so the unit rests on onchain evidence plus its own terms. The FAQ pays cashback in AVAX and the boost daily in USDe; the Card Terms name Rain as program manager. On Avalanche, Rain collateral 0x6070848b... (receiving per-wallet USDe card spends) and wallet factory 0xAc66ca9A... (12335 passkey wallets with USDe/USDC daily limits) share owner Safe 0xdD2332Ca... (block 96949020). Judgment call: attribution is inferred, not stated by Ethena Pay. Excluded: the Card Terms' generic Supported Blockchains list.

