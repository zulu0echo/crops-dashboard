    required: true
  - name: RainCollateral contracts (collateral proxy and implementation)
    role: contracts
    public: true
    license: Unlicense
    operator: Rain (controller) / Ethena Pay (owner Safe)
    required: true
  - name: Third National (card issuer)
    role: card-issuer
    public: false
    license: proprietary
    operator: Third National
    required: true
  - name: Visa (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: Sumsub (identity verification and screening)
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub Tech Ltd.
    required: true
  - name: Privy (authentication, login, embedded wallet)
    role: wallet
    public: false
    license: proprietary
    operator: Horkos, Inc. d.b.a. Privy
    required: true
  - name: Iron (fiat IBAN and on/off ramp; not in the card path)
    role: other
    public: false
    license: proprietary
    operator: Iron
    required: false

context: >-
  Per its legal hub, Ethena Pay Ltd. is a Maltese private limited company (C 114576) that says it is not a bank or money services business and does not hold customer funds. The Card Terms say the card is issued by Third National under license from Visa and the program is managed by Signify Holdings, Inc. d/b/a Rain; the card is offered only to non-U.S. persons. The site states digital assets are not covered by the FDIC, the UK FSCS, the Maltese Depositor Compensation Scheme or any investor compensation scheme. A complaints procedure with external escalation routes is published.

