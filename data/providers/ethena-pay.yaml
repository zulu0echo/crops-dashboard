components:
  - name: User wallet contracts (WalletDiamond beacon proxies and facets)
    role: contracts
    public: true
    license: MIT
    operator: Ethena Pay (owner Safe 0xdD2332Ca...)
    required: true
  - name: Wallet factory implementation (facet registry, executor, global pause)
    role: contracts
    public: false
    license: proprietary
    operator: Ethena Pay (owner Safe 0xdD2332Ca...)
    required: true
  - name: BatchExecutor (relays executor-signed card spends)
    role: contracts
    public: true
    license: MIT
    operator: Ethena Pay (owner Safe 0xdD2332Ca...)
    required: true
  - name: Ethena Pay executor co-signer (EOA 0xe0EcdCc8...)
    role: signer
    public: false
