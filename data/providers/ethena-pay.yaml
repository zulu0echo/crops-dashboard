      chain_id: 43114
      block_number: 96938483
      detail: Sample card spend moved 2.25 USDe from wallet 0x6455888e... to Rain collateral 0x6070848b... via spendDailyAllowance, relayed by Ethena Pay's BatchExecutor.
      checked_at: "2026-10-12"
    - tier: documented
      kind: document
      url: https://pay.ethena.fi/terms
      detail: Terms of Use s2 say balances are denominated in or backed by supported digital assets, including USDe or third-party stablecoins.
