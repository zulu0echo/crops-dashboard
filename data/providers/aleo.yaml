slug: aleo
name: Aleo (credits.aleo private transfers)
type: transfer
website: https://aleo.org
primary_chain:
  name: Aleo mainnet
  caip2: "aleo:0"
  basis: >-
    Aleo is its own proof-of-stake chain (BFT validator committee), so the unit is Aleo mainnet as defined by snarkVM v4.11.0 (MAINNET_V0_CONSENSUS_VERSION_HEIGHTS, consensus_heights.rs L165-L190) and the built-in credits.aleo program, whose transfer functions are the settlement path. CAIP-2 id aleo:0 from the registered aleo namespace (ChainAgnostic/namespaces aleo/caip2.md). Mainnet height read via the Provable API: 22,659,198 on 2026-10-09. Excluded: testnet and canary, other deployed programs (token_registry, stablecoins), bridges.

repos:
  - url: https://github.com/ProvableHQ/snarkOS
    role: backend
    license: Apache-2.0
  - url: https://github.com/ProvableHQ/snarkVM
    role: contracts
    license: Apache-2.0
  - url: https://github.com/ProvableHQ/sdk
    role: sdk
    license: GPL-3.0
  - url: https://github.com/ProvableHQ/leo
    role: sdk
    license: GPL-3.0

contracts: []

components:
  - name: Aleo mainnet consensus (BFT committee of bonded validators)
    role: ledger
    public: true
    license: Apache-2.0
    operator: 23 validators at 2026-10-09; bonding open at 10M credits
    required: true
    repo: https://github.com/ProvableHQ/snarkOS
  - name: credits.aleo (built-in program; transfer and fee functions)
    role: contracts
    public: true
    license: Apache-2.0
    operator: none (changed only by consensus upgrades)
    required: true
    repo: https://github.com/ProvableHQ/snarkVM
  - name: snarkVM (VM, consensus versions, restrictions list)
    role: other
    public: true
    license: Apache-2.0
    operator: Provable (maintainer); run inside every node and client
    required: true
    repo: https://github.com/ProvableHQ/snarkVM
  - name: snarkOS node and developer CLI (transfer_private)
    role: backend
    public: true
    license: Apache-2.0
    operator: user, validators, or any node operator
    required: true
    repo: https://github.com/ProvableHQ/snarkOS
  - name: Proving parameters (parameters.provable.com, S3 fallback; checksums in snarkVM)
    role: other
    public: true
    license: Apache-2.0
    operator: Provable (both download URLs)
    required: true
    repo: https://github.com/ProvableHQ/snarkVM
  - name: Provable SDK (@provablehq/sdk)
    role: sdk
    public: true
    license: GPL-3.0
    operator: user
    required: false
    repo: https://github.com/ProvableHQ/sdk
  - name: Provable API (api.explorer.provable.com, edge.provable.com), default endpoint
    role: api
    public: false
    license: proprietary
    operator: Provable
    required: false
  - name: Provable delegated proving and record scanning services
    role: other
    public: false
    license: proprietary
    operator: Provable
    required: false
  - name: Consumer wallets (Shield, Leo Wallet, Puzzle); no public source found
    role: wallet
    public: false
    license: proprietary
    operator: wallet vendors
    required: false

scores:
  C1:
    score: 1
    evidence:
      - tier: verified
        kind: repo
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/synthesizer/src/restrictions/mod.rs#L32-L60
        commit: "29343ebbb7970e4240b4444346aeb26e31009bd7"
        path: synthesizer/src/restrictions/mod.rs
        detail: snarkVM carries a consensus-level restrictions registry that can block whole programs, single functions, or specific public or constant argument values (for example an address passed to transfer_public) over block ranges; is_argument_restricted (L237-L290) matches only public and constant inputs and outputs.
        checked_at: "2026-10-09"
        recheck: gh api "repos/ProvableHQ/snarkVM/contents/synthesizer/src/restrictions/mod.rs?ref=29343ebbb7970e4240b4444346aeb26e31009bd7" --jq .content | base64 -d | sed -n 32,60p
        confirmed_at: 2026-10-19
      - tier: verified
        kind: repo
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/parameters/src/mainnet/resources/restrictions.json#L1-L6
        commit: "29343ebbb7970e4240b4444346aeb26e31009bd7"
        path: parameters/src/mainnet/resources/restrictions.json
        detail: The mainnet list is empty (no programs, functions or arguments) at v4.11.0; it has been empty since it was introduced in June 2024 (commits e8e59b7f and e579d0a9).
        checked_at: "2026-10-09"
        recheck: gh api "repos/ProvableHQ/snarkVM/contents/parameters/src/mainnet/resources/restrictions.json?ref=29343ebbb7970e4240b4444346aeb26e31009bd7" --jq .content | base64 -d
        confirmed_at: 2026-10-19
    finding: >-
      credits.aleo itself has no admin, pause or blacklist. But the node software has a built-in restrictions list that, once a release containing entries is adopted by the validator committee, makes the chain reject named programs, functions or public argument values such as a specific address, from a chosen block height. The list is empty today. Private transfers cannot be targeted by address because their arguments are encrypted, but the whole transfer_private function could be restricted. Provable maintains the only node implementation we found, and 23 validators decide whether to run a release. Judgment call: there is no key, but an address-level filter is designed into consensus and can be activated by one release with no enforced delay, so we score 1, not 2.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-09
    review:
      status: pending

