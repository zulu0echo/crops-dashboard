notes: >-
  Primary chain Base (8453): the docs' examples use Base USDC, and the repo has Base broadcasts for every deposit-address contract. The repo also has broadcasts for 15 other chains, which we did not assess. Scope is the deposit-address system (DepositAddressManager and related contracts), which @daimo/sdk 1.8.x uses. The older DaimoPay/PayIntent order contracts are still in the repo; we did not score them. Contract addresses were resolved with CREATE3Factory.getDeployed(deployer 0x723a63fb50da50a26997fb99a2eb151e4f8c5227, salt) at 0x37922885311bc9d18e136e4fe6654409d3f45ffd. The pricer and bridger addresses come from the DAParams of a live session (tx 0x8d3d409f…bd00). We did not enumerate the full relayer set, because public Base RPCs limit eth_getLogs ranges. The two relayers listed were confirmed with direct relayerAuthorized() reads. All onchain reads are pinned to block 52280426. All repo reads are pinned to daimo-eth/sdk@ac0a71453ac249aa991d71059c621e2424322d61. No browser or network traces were run. Migrated to the post-red-team evidence rules on 2026-10-07 (components, quotes, rechecks, package evidence); score changes are listed in docs/research/daimo-pay.md.
