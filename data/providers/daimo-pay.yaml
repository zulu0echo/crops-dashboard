        detail: The manager owner 0xd4cFb1c394DaCc70F0cB6D7b36806328e0ECb131 has empty code (no EIP-7702 delegation) and nonce 173 at block 52280426, so it is an EOA; there is no Safe whose modules or guard could be read.
        checked_at: "2026-10-07"
        recheck: >-
          cast code 0xd4cFb1c394DaCc70F0cB6D7b36806328e0ECb131 --rpc-url https://mainnet.base.org --block 52280426 (returns 0x) && cast nonce 0xd4cFb1c394DaCc70F0cB6D7b36806328e0ECb131 --rpc-url https://mainnet.base.org --block 52280426 (returns 173)
    finding: >-
      There is no pause, freeze, or blacklist function in the settlement contracts. The contracts do hold a control the C1 anchors name explicitly: a relayer allowlist that a single EOA owner sets through setRelayer, with no timelock. Only allowlisted relayers can forward a deposit to the payee. The owner can stop all settlement by removing every relayer. Any relayer can decline a single deposit address, or refund it early to its refundAddress, without notice. Funds in an unforwarded deposit address can still be refunded by anyone once expiresAt passes. Under the updated anchor the cell is 0 on two counts: the role is EOA-held (the owner has no code, so there is no Safe, module, guard, or signer set to read), and relayers can act on individual deposit addresses with no notice.
