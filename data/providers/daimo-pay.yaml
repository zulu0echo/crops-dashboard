slug: daimo-pay
name: Daimo Pay
type: checkout
website: https://daimo.com
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    The SDK has no default chain (the merchant sets the destination chain per session), so the unit rests on other evidence. The docs' session example (docs.daimo.com/guides/payment-methods) uses chainId 8453 with Base USDC; packages/contract/broadcast/DeployDepositAddressManager.s.sol/8453/run-latest.json exists at the pinned commit; the sampled live session (tx 0x8d3d409f…bd00) settled on Base. Excluded: the 15 other chains with broadcasts, and the older DaimoPay/PayIntent contracts that @daimo/sdk 1.8.x does not use. Judgment call: settlement volume by chain was not compared.

repos:
  - url: https://github.com/daimo-eth/sdk/tree/ac0a71453ac249aa991d71059c621e2424322d61/packages/sdk
    role: sdk
    license: BSD-2-Clause
  - url: https://github.com/daimo-eth/sdk/tree/ac0a71453ac249aa991d71059c621e2424322d61/packages/contract
