      checked_at: "2026-10-09"
      quote: Users in a country with no enabled fiat rail see crypto, exchange, and wallet
    - tier: verified
      kind: repo
      url: https://github.com/daimo-eth/sdk/tree/ac0a71453ac249aa991d71059c621e2424322d61/packages/contract/src
      commit: ac0a71453ac249aa991d71059c621e2424322d61
