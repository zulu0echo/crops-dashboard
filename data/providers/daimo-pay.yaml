availability:
  model: global
  note: >-
    The docs say crypto deposits (self-custody wallets and deposit addresses) are offered everywhere; the deposit-address contracts and the SDK contain no country or sanctions check. Fiat rails are a regional variant, enabled per organization: Apple Pay, ACH and Google Pay (US), Interac (CA), SEPA (Europe), JPYC (JP, SG, KR, PH), ARS (AR) and Bre-B (CO). The terms of use name no countries, only that the Services are not intended for use where it would be contrary to law. Judgment call: the hosted API that builds the payment-method list is closed, so a server-side country gate cannot be ruled out from code; global rests on the docs statement plus the contracts.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.daimo.com/guides/payment-methods
      detail: Payment Methods guide lists localized methods by country and states that self-custody wallets and deposit addresses are offered in every country.
      checked_at: "2026-10-09"
      quote: plus self-custody wallets and deposit addresses everywhere
