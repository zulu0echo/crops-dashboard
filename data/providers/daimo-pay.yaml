  - address: "0xc88fd3c032406F64C70a6c1aAc9831602362eE04"
    chain_id: 8453
    role: DaimoPayRelayer (operator wrapper, authorized relayer)
    verified: none

components:
  - name: DepositAddress contracts (manager, factory, vault, executor, pricer, bridger)
    role: contracts
    public: true
    license: GPL-3.0-or-later
    operator: Daimo (owner EOA 0xd4cFb1c3…b131)
    required: true
    repo: https://github.com/daimo-eth/sdk/tree/ac0a71453ac249aa991d71059c621e2424322d61/packages/contract
  - name: "@daimo/sdk (React modal, client, React Native frame)"
    role: sdk
    public: true
    license: BSD-2-Clause
    operator: Daimo
    required: true
    repo: https://github.com/daimo-eth/sdk/tree/ac0a71453ac249aa991d71059c621e2424322d61/packages/sdk
  - name: Daimo API (api.daimo.com; sessions, DA params, payment options, webhooks)
    role: api
    public: false
    license: proprietary
    operator: Daimo
    required: true
  - name: Daimo relayer service (calls start, sameChainFinish, claim on the manager)
    role: relayer
    public: false
    license: proprietary
    operator: Daimo (allowlisted EOA 0xA9C38348…4E2f and wrapper 0xc88fd3c0…eE04)
    required: true
  - name: Daimo price signer (trustedSigner key for DaimoPayPricer)
    role: signer
    public: false
    license: proprietary
    operator: Daimo (EOA 0xE1432f86…AA25)
    required: true
  - name: Daimo indexer (deposit detection and balance lookup behind the API)
    role: indexer
    public: false
    license: proprietary
    operator: Daimo
    required: true
  - name: DaimoPayRelayer wrapper contract (source in repo, deployed bytecode unverified)
    role: contracts
    public: true
    license: GPL-3.0-or-later
    operator: Daimo
    required: false
    repo: https://github.com/daimo-eth/sdk/tree/ac0a71453ac249aa991d71059c621e2424322d61/packages/contract/src/relayer
  - name: Hosted deposit flow (daimo.com, loaded by DaimoFrame / DaimoFrameRN)
    role: frontend
    public: false
    license: proprietary
    operator: Daimo
    required: false
  - name: Privy embedded wallet and auth (account/fiat flows only)
    role: wallet
    public: false
    license: proprietary
    operator: Privy
    required: false
  - name: Fiat onramps (Coinbase onramp, Stripe onramp; fiat flows only)
    role: other
    public: false
    license: proprietary
    operator: Coinbase, Stripe
    required: false
  - name: KYC partner (Sumsub per docs; fiat ramps only)
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub
    required: false
  - name: Bridge/swap routes (CCTP, Across, Relay, Stargate, USDT0, Axelar, 0x)
    role: other
    public: false
    license: various
    operator: Third parties
    required: false

