slug: nullmask
name: Nullmask
type: incumbent
website: https://nullmask.io
repos: []
contracts: []

components:
  - name: Nullmask Pool (UUPS proxy 0x8888…B026 and implementation; source not published)
    role: contracts
    public: false
    license: proprietary
    operator: Nullmask operator (unnamed company)
    required: true
  - name: AdminUpgradeController 0x6073…cFa1 (admin is an EOA)
    role: contracts
    public: false
    license: proprietary
    operator: Nullmask operator
    required: true
  - name: RPC proxy (wallet network endpoint; generates proofs, holds viewing keys)
    role: backend
    public: false
    license: proprietary
    operator: Nullmask operator
    required: true
  - name: Relayer (submits transfers, swaps and withdrawals)
    role: relayer
    public: false
    license: proprietary
    operator: Nullmask operator
    required: true
  - name: Guard deposit-screening service (EOA 0x3AAf…9239 approves deposits)
    role: signer
    public: false
    license: proprietary
    operator: Nullmask operator
    required: true
  - name: Third-party blockchain analytics provider (screening; unnamed)
    role: kyc
    public: false
    license: proprietary
    operator: unnamed
    required: true
  - name: Nullmask web app (app.nullmask.io)
    role: frontend
    public: false
    license: proprietary
    operator: Nullmask operator
    required: false
  - name: Uniswap V2 (swaps inside the pool)
    role: other
    public: true
    license: GPL-3.0
    operator: none (immutable)
    required: false
    repo: https://github.com/Uniswap/v2-core
  - name: Ethereum mainnet
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators
    required: true
    repo: https://github.com/ethereum/go-ethereum

