      - tier: verified
        kind: repo
        url: https://github.com/0xCurvy/contracts/blob/e996fe719580f4d82ff34f06ee8a0916df65a613/evm/src/v2/aggregator-alpha/CurvyAggregatorAlphaV2.sol#L253-L267
        commit: e996fe719580f4d82ff34f06ee8a0916df65a613
        path: evm/src/v2/aggregator-alpha/CurvyAggregatorAlphaV2.sol
        detail: The contracts hold no address list, but the only open entry, portalShield, requires an operator-deployed portal. directShield reverts while directShieldEnabled is false.
        checked_at: "2026-10-09"
    finding: >-
      Edge screening (Global Ledger, run by the Curvy-operated broadcaster) is disclosed in a versioned docs repo, and the contracts contain no address or country list. The screening cannot be bypassed: entry to the pool is operator-gated onchain, and the direct entry is disabled. A screened-out payee can only recover funds publicly through the portal recovery path. The list source is named, but the scoring rules live in a closed backend. Judgment call: the settlement layer is not neutral, because entry depends on a screened operator, so we score 1 rather than 2.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-09
    review:
      status: pending

