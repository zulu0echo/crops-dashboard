        path: evm/src/v2/aggregator-alpha/CurvyAggregatorAlphaV2.sol
        detail: submitWithdrawalRequest is permissionless. It checks a known notes root and a Groth16 proof, then pays the destination encoded in the proof. commitPendingNotes (L274) is permissionless too.
        checked_at: "2026-10-09"
        recheck: gh api "repos/0xCurvy/contracts/contents/evm/src/v2/aggregator-alpha/CurvyAggregatorAlphaV2.sol?ref=e996fe719580f4d82ff34f06ee8a0916df65a613" --jq .content | base64 -d | sed -n 518,557p
      - tier: verified
        kind: repo
        url: https://github.com/0xCurvy/contracts/blob/e996fe719580f4d82ff34f06ee8a0916df65a613/evm/src/v2/portal/PortalFactory.sol#L267-L286
        commit: e996fe719580f4d82ff34f06ee8a0916df65a613
        path: evm/src/v2/portal/PortalFactory.sol
        detail: Anyone can call deployRecoveryEntryPortal. Portal.recover then sends a portal's whole balance to any address, provided tx.origin is the portal's recovery address (Portal.sol L21-L24, L139).
        checked_at: "2026-10-09"
      - tier: verified
        kind: onchain
        url: https://sourcify.dev/server/v2/contract/42161/0x855de6C7A698ea870fc53DE755D612Ed977d3F0A
        address: "0xE51924cEF003a654EC9735c4d97f5D4862cBcbB1"
        block_number: 513140605
        detail: The aggregator proxy's EIP-1967 implementation slot points to 0x855d…3F0A. Its Sourcify source matches contracts@e996fe71 (develop) apart from a trailing newline; it does not match main.
        checked_at: "2026-10-09"
        check:
          slot: "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc"
          expect: "0x000000000000000000000000855de6c7a698ea870fc53de755d612ed977d3f0a"
        confirmed_at: 2026-10-19
    finding: >-
      A payer completes a payment with a plain transfer to the payee's portal address. Moving those funds into the shielded pool needs Curvy's operator (C1), because direct shielding is disabled. The payee can withdraw from the pool, or recover funds stuck at a portal, by calling the contracts directly. Withdrawing also needs notes-tree data and circuit keys that Curvy hosts (C3). Scored 1: settlement into the private pool depends on the provider, while recovery and withdrawal are direct.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-09
    review:
      status: pending

