  note: >-
    The Terms of Service (last updated 2026-07-14) exclude persons in the United States, including its territories and possessions, and politically exposed persons. They also exclude any "Restricted Jurisdiction": any country subject to sanctions or embargoes by the US, UK, Canada, the EU or any other jurisdiction. None of these is named, so only US is listed. The docs add that the website geo-blocks countries under US or EU sanctions (not named) and blocks Tor. The ToS prohibits VPNs and other location masking. Each exchange partner applies its own terms and can require KYC. Integrators using the iframe or API must enforce the same restrictions. Under the more restrictive reading, any comprehensively sanctioned country is also excluded, but we have not listed them.
