slug: houdini-swap
name: Houdini Swap
type: incumbent
website: https://docs.houdiniswap.com

repos:
  - url: https://github.com/HoudiniSwap/houdiniswap-agent
    role: sdk
    license: MIT
  - url: https://github.com/HoudiniSwap/houdini-api-examples
    role: sdk
    license: none

contracts: []

components:
  - name: Houdini Partner API (api-partner.houdiniswap.com, order creation and status)
    role: api
    public: false
    license: proprietary
    operator: Houdini Swap LLC
    required: true
  - name: Houdini routing engine and order backend
    role: backend
    public: false
    license: proprietary
    operator: Houdini Swap LLC
    required: true
  - name: CEX exchange partners holding deposits in flight (12 named in docs)
    role: other
    public: false
    license: proprietary
    operator: Third-party instant exchanges selected per order
    required: true
  - name: Partner AML screening (e.g. Chainalysis) and partner KYC when triggered
    role: kyc
    public: false
    license: proprietary
    operator: Exchange partners and their screening vendors
    required: false
  - name: Public chains (source, destination, unnamed intermediary privacy L1)
    role: ledger
    public: true
    license: various
    operator: Each chain's validators or miners
    required: true
  - name: Houdini web app (houdiniswap.com)
    role: frontend
    public: false
    license: proprietary
    operator: Houdini Swap LLC
    required: false
  - name: Embeddable swap widget (iframe)
    role: frontend
    public: false
    license: proprietary
    operator: Houdini Swap LLC
    required: false
  - name: houdiniswap-agent (MCP server, AI SDK tools, shared HTTP client)
    role: sdk
    public: true
    license: MIT
    operator: user
    required: false
    repo: https://github.com/HoudiniSwap/houdiniswap-agent
  - name: houdini-api-examples (Next.js and Node reference integrations)
    role: sdk
    public: true
    license: none
    operator: integrator
    required: false
    repo: https://github.com/HoudiniSwap/houdini-api-examples
  - name: x402 facilitator for pay-per-call API access (agent path only)
    role: other
    public: false
    license: proprietary
    operator: unnamed x402 facilitator (USDC on Base)
    required: false

