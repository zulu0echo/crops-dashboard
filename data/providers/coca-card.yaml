context: >-
  Not scored. The COCA Wallet Terms (https://www.coca.xyz/terms, dated 4 November 2023) name CCA Labs FZCO, Dubai Silicon Oasis, UAE, as the wallet provider and describe the card as a third-party extension; no COCA document names the card issuer, programme manager or any licence. COCA's docs describe the account as a self-custodial smart wallet and say COCA cannot move or freeze user funds; no artifact backs that claim.

notes: >-
  Classified as incumbent: I found no verified contract or public repository needed to run the card. Searched: coca.xyz (home, terms, privacy), docs.coca.xyz (full llms.txt index, all 19 pages; the only addresses are the COCA ERC-20 token on Polygon and Base, which is not in the card path), GitHub (users/orgs coca-xyz, cocaxyz, cocawallet, coca-wallet, coca-card, coca-finance, ccalabs, cca-labs, CCALabs: 404; coca-labs has two unrelated 2024 repos, cocalabs and cocacard are empty; code search for coca.xyz finds only third-party lists), and subdomains app., web., api., wallet., card.coca.xyz (no response). The docs say the card spends from an EIP-7702 smart wallet that approves each authorization, but give no chain, address, ABI or audit; these claims were not used to score custody. The Android app id is com.wirex.wallet, and a third-party guide says Wirex supplied the card infrastructure at launch; I found no COCA artifact linking the card to Wirex's onchain stack, so it is not evidence here. Re-assess as type card if COCA publishes the spending contract.

availability:
  model: allowlist
  countries: [ EU, IS, NO, AD, GI, MC, ME, CH, GB, AU, HK, ID, MY, NZ, PH, SG, TW, TH, VN, AR, BR, CL, CO, EC, MX, PE ]
  note: >-
    The COCA card is limited to residents of the countries listed in COCA's docs. The docs say "54 supported countries, which include" and then name 52: the 29 listed under "EEA countries" (the EU 27 plus Iceland and Norway; Liechtenstein is not named), six other European countries, ten in Asia-Pacific and seven in Latin America. The two unnamed countries are not listed here. Separately, the COCA Wallet Terms (4 November 2023) prohibit residents of named countries (Afghanistan, North Korea, DR Congo, Eritrea, Libya, Somalia, South Sudan, Sudan, Yemen, Iraq, Iran, Cuba, Syria, Mali, Central African Republic, Guinea-Bissau, Lebanon) and any UN-sanctioned country; none of those are on the card list.
  evidence:
    - tier: claimed
      by: provider
      kind: document
      url: https://docs.coca.xyz/coca/banking-account/overview
      detail: COCA's docs list the card's supported residence countries by region (EEA, Other Europe, Asia-Pacific, Latin America).
      quote: "Andorra, Gibraltar, Monaco, Montenegro, Switzerland, United Kingdom."
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://www.coca.xyz/terms
      detail: The COCA Wallet Terms define Prohibited Countries by name and require users not to be resident in them.
      quote: "Afghanistan, the Democratic People's Republic of Korea, Democratic Republic of Congo, Eritrea, Libya"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
  checked_at: "2026-10-09"

settlement:
  tokens:
    - symbol: USDC
      class: stablecoin
      backing: fiat
      issuer: Circle
      default: true
  conversion: at_spend
  note: >-
    The COCA Banking Account is a smart-contract wallet the user controls (Privy keys); at each card authorisation the wallet approves the exact amount, which is moved for settlement through COCA and its unnamed card partner. The account holds USD and EUR balances. The September 2026 update shows exchange rates as local currency per USDC, which indicates the USD balance is held in USDC; the token behind the EUR balance (funded by SEPA to the COCA IBAN) is not named in any COCA source found, so it is not listed. USDC and USDT can be deposited on many chains (NEAR, Ethereum, Arbitrum, Base, Solana, Gnosis, Polygon, Optimism, Avalanche and others); whether deposited USDT is kept as USDT or swapped into the USD balance is not stated. The chain and contract of the spending balance are not disclosed.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.coca.xyz/coca/the-bank-we-all-deserve/where-is-my-money-stored-and-who-controls-it
      detail: The docs say the Banking Account is a user-controlled smart wallet and that only the authorised amount of a card payment is moved for settlement.
      quote: "Only the authorized amount is moved for settlement"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://www.coca.xyz/post/coca-monthly-update-september-2026
      archive: data/archive/coca-card-ops-update-sep-2026.txt
      detail: COCA's September 2026 update says the app now shows how much local currency one USDC is worth and which account currency a payment came from.
      quote: "you see how much of your local currency one USDC is worth"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://www.coca.xyz/post/coca-monthly-update-august-2026
      archive: data/archive/coca-card-ops-update-aug-2026.txt
      detail: COCA's August 2026 update lists the chains on which USDC and USDT can be deposited to fund the banking account.
      quote: "making it simpler to fund your COCA banking account"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
  checked_at: "2026-10-12"

audits:
  searched: >-
    coca.xyz (terms, privacy) and docs.coca.xyz (all 19 pages; the Is COCA Safe page cites audits of Privy and Morpho but none of COCA's own code), the GitHub orgs and users listed in the notes (no card or wallet code), and Privy's security docs, which point to its open-source Shamir secret-sharing library and its two published reports. No audit of COCA's smart wallet, spending module or backend is published. Morpho vaults are a yield feature, not the card path. Privy's SOC 2 and its other audits (Doyensec, infrastructure) are not published as reports.
  checked_at: "2026-10-13"
  reports:
    - auditor: Zellic
      date: "2023-08-15"
      type: audit
      scope: "Shared component: Privy shamir-secret-sharing TypeScript library (key splitting used by Privy embedded wallets)"
      url: https://github.com/Zellic/publications/blob/master/Privy_Shamir_Secret_Sharing_-_Zellic_Audit_Report.pdf
      commit: cd8422d
      repo: https://github.com/privy-io/shamir-secret-sharing
      covers_deployed: unknown
      findings: "1 low; acknowledged"
      note: >-
        Assessment 27-29 June 2023. COCA says wallet keys are managed via Privy but not which Privy key scheme or library version its wallets use.
    - auditor: Cure53
      date: "2023-04-24"
      type: audit
      scope: "Shared component: Privy shamir-secret-sharing TypeScript library, cryptography review and code audit"
      url: https://cure53.de/audit-report_privy-sss-library.pdf
      commit: 3383ad927211615f3d70b5ceb5489f8a149be191
      repo: https://github.com/privy-io/shamir-secret-sharing
      covers_deployed: unknown
      findings: "1 high (polynomial degree could be below t-1), 2 info; fixes verified by Cure53"
      note: Testing in February 2023 (two days). Covers only the library, not Privy's key-management service.
