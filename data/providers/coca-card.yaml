        detail: The COCA Wallet Terms (dated 4 November 2023) let COCA terminate, suspend or limit any user's access or functionality without liability.
        quote: "we may at any time and without liability, terminate, suspend or limit your use or any functionality of the Coca Wallet"
        checked_at: "2026-10-07"
        confirmed_at: 2026-10-19
