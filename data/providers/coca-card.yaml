slug: coca-card
name: COCA Card
type: incumbent
website: https://www.coca.xyz

repos: []

contracts: []

components:
  - name: COCA app and backend (card management, top-up, compliance)
    role: backend
    public: false
    license: proprietary
    operator: CCA Labs FZCO
    required: true
  - name: Card spending contract or smart-wallet module (chain and address not disclosed)
    role: contracts
    public: false
    license: proprietary
    operator: COCA / card program provider
    required: true
  - name: COCA smart wallet (EIP-7702 per COCA docs; keys via Privy)
    role: wallet
    public: false
    license: proprietary
    operator: User (infrastructure by Privy and COCA)
    required: true
  - name: Third-party card program provider and issuer (not named by COCA)
    role: card-issuer
    public: false
    license: proprietary
    operator: Not disclosed
    required: true
  - name: Visa (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC (passport-based; vendor not named)
    role: kyc
    public: false
    license: proprietary
    operator: Not disclosed
    required: true

