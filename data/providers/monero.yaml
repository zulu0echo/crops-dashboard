slug: monero
name: Monero
type: transfer
website: https://www.getmonero.org
primary_chain:
  name: Monero mainnet
  caip2: "monero:418015bb9ae982a1975da7d79277c270"
  basis: >-
    Monero is its own proof-of-work chain, so the unit is Monero mainnet as defined by the reference node monerod at tag v0.18.5.3 (mainnet_hard_forks in src/hardforks/hardforks.cpp L34-L76; current fork v16 since height 2,689,608). CAIP-2 id from the registered monero namespace (ChainAgnostic/namespaces monero/caip2.md, mainnet genesis hash prefix). Excluded: stagenet, testnet, Wownero and other forks, exchanges and atomic-swap tools.

repos:
  - url: https://github.com/monero-project/monero
    role: backend
    license: BSD-3-Clause
  - url: https://github.com/monero-project/monero-gui
    role: frontend
    license: BSD-3-Clause
  - url: https://github.com/monero-project/monero-site
    role: docs
    license: BSD-3-Clause

contracts: []

components:
  - name: Monero mainnet consensus (proof-of-work miners and full nodes)
    role: ledger
    public: true
    license: BSD-3-Clause
    operator: miners and node operators; rule changes ship as scheduled hard forks
    required: true
    repo: https://github.com/monero-project/monero
  - name: monerod reference node (own node or a remote node run by someone else)
    role: backend
    public: true
    license: BSD-3-Clause
    operator: user, or any public remote-node operator
    required: true
    repo: https://github.com/monero-project/monero
  - name: wallet2 library and monero-wallet-cli (in the monero repo)
    role: wallet
    public: true
    license: BSD-3-Clause
    operator: user
    required: true
    repo: https://github.com/monero-project/monero
  - name: Monero GUI wallet
    role: wallet
    public: true
    license: BSD-3-Clause
    operator: user
    required: false
    repo: https://github.com/monero-project/monero-gui
  - name: Public remote and bootstrap nodes (GUI simple mode picks one via P2P)
    role: api
    public: true
    license: BSD-3-Clause
    operator: independent node operators
    required: false
    repo: https://github.com/monero-project/monero
  - name: MoneroPulse DNS records (advisory checkpoints, update notices)
    role: other
    public: false
    license: proprietary
    operator: Monero core team domains (moneropulse.se/.org/.net/.co)
    required: false

