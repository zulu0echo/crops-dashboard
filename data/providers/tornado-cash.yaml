  Unit: 12 Ethereum mainnet pools (ETH 0.1/1/10/100, DAI 100/1k/10k/100k, USDC 100/1k, USDT 100/1k), the shared verifier 0xce17…557A and the hasher 0x8358…28fe. Pool and slot reads are pinned at blocks 26141280 and 26141552, governance and token reads at 26141584, and registry state at 26140925 (publicnode serves only recent blocks, so the reads span several blocks). The github.com/tornadocash org is archived (all 47 repos, last push 2022-08-22). We cite it for the immutable pools and the clients; later community source was not reviewed. Governance: TORN-weighted LoopbackProxy with 72 proposals at our read. Proposal 20 (May 2023) is recorded in S2 from onchain state only. The reported 2024 frontend backdoor was not evidenced from a primary source here and is not scored. The hasher is generated bytecode with no Sourcify record; Etherscan could not be loaded. No transactions, UI runs, traces, or self-host attempts were made.
