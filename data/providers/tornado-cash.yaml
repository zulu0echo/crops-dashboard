        kind: onchain
        url: https://sourcify.dev/server/v2/contract/1/0x58E8dCC13BE9780fC42E8723D8EaD4CF46943dF2
        address: "0x58E8dCC13BE9780fC42E8723D8EaD4CF46943dF2"
        block_number: 26141552
        detail: Relayers are optional; the RelayerRegistry lets anyone owning an ENS subdomain register with minStakeAmount 5000 TORN; relayer code is public (tornado-relayer, archived).
        checked_at: "2026-10-07"
    finding: >-
      Settlement needs only the pools, a proof client and an Ethereum RPC. A relayer is optional: it exists so a withdrawer can pay gas from the withdrawn amount instead of from a funded account, which matters for privacy but not for settlement. The indexer is optional too, as the UI falls back to RPC event reads. Judgment call: we score 3 although withdrawing to a fresh address without a relayer needs gas from elsewhere, which can reduce privacy (see P3); the cell measures whether settlement depends on a hosted intermediary, and it does not.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-07
    review:
      status: pending

