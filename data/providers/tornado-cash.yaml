slug: tornado-cash
name: Tornado Cash (Classic pools)
type: transfer
website: https://github.com/tornadocash
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    The classic UI's networkConfig.js (tornado-classic-ui@a83fae07 L11-L60) lists Ethereum mainnet first (netId1, deployedBlock 9116966), and the onchain InstanceRegistry 0xB20c…A911 lists 19 enabled mainnet instances. Unit: the 4 ETH pools (0.1/1/10/100) and the 8 stablecoin pools (DAI 100-100k, USDC 100/1k, USDT 100/1k). Excluded: cDAI and WBTC pools, other chains (BSC, Polygon, Gnosis, Arbitrum, Optimism, Avalanche), Nova, and governance-only contracts (staking, vesting).

