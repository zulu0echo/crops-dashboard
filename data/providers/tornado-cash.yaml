context: >-
  Not scored. On 2022-08-08 the US Treasury's OFAC designated Tornado Cash (https://home.treasury.gov/news/press-releases/jy0916). In Van Loon v. Department of the Treasury, No. 23-50669, the Fifth Circuit held that Tornado Cash's immutable smart contracts are not the property of a foreign national or entity and cannot be blocked under IEEPA, and remanded (https://www.ca5.uscourts.gov/opinions/pub/23/23-50669-CV0.pdf). On 2025-03-21 Treasury announced it had removed the sanctions (https://home.treasury.gov/news/press-releases/sb0057; https://ofac.treasury.gov/recent-actions/20250321). On 2023-08-23 the US Attorney for SDNY announced charges against two founders (https://www.justice.gov/usao-sdny/pr/tornado-cash-founders-charged-money-laundering-and-sanctions-violations); later outcomes were not reviewed here. On 2024-05-14 the Oost-Brabant district court in the Netherlands convicted a developer of money laundering and imposed 64 months (ECLI:NL:RBOBR:2024:2069, https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBOBR:2024:2069); we did not check for any appeal.

