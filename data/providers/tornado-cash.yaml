        detail: The UI reads deposit events from The Graph and then from the RPC, so the indexer is optional; the proving key is a static GitHub release asset (tornado-core v2.1).
        checked_at: "2026-10-07"
        recheck: gh api "repos/tornadocash/tornado-classic-ui/contents/services/events.js?ref=a83fae0772c8da084c0e76b3a756b456f5b9f5bb" --jq .content | base64 -d | sed -n 326,341p
