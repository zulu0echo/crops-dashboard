context: >-
  Not scored. The docs say the card is issued through regulated partners, Rain outside APAC and DCS for Australia, Japan, Malaysia, the Philippines, Singapore, South Korea, Taiwan, Thailand and Vietnam, and that off-ramp and remittance run through Noah. I found no Jupiter Spend terms, cardholder agreement or privacy policy that names an issuing bank, licence or regulator.

notes: >-
  Eligibility: no verified contract and no public repository needed to run the card, so type is incumbent. Searched 2026-10-07: docs.jup.ag (llms.txt index; Spend overview, Jupiter Card, Risks & Security, Fees & Limits, FAQ); github.com/jup-ag (202 repos; none for Spend, card, Global ID or Rain); jupiter.global and jup.ag for terms or privacy pages (404); Rain's GitHub org SignifyHQ, whose collateral-contract-integration-examples repo has Solana IDLs (v2.00-2.05) but no mainnet program id, and whose Android SDK test fixtures name only a devnet program (A7oUtbpm..., absent on mainnet). The docs say Rain-card deposits stay onchain as collateral; if Rain or Jupiter publishes the collateral program or a user's collateral account, re-assess as type card. Deposits are also accepted on Ethereum, Sui, Arbitrum and Base. Card Map was not used.

availability:
  model: allowlist
  countries: [ AG, AR, AU, BS, BB, BZ, BO, BR, KY, CO, CR, CI, DM, DO, EC, EG, SV, GH, GD, GT, GY, HN, JP, KE, MY, MX, MA, NZ, PK, PA, PY, PE, PH, KN, LC, VC, SN, SG, ZA, KR, SR, TW, TH, TT, TC, UG, AE, UY, VN, ZM, US ]
  note: >-
    Jupiter's docs list where the Jupiter Card is "actively offered", by country of residence (not citizenship). Bangladesh and Nigeria are on the list but marked "on pause until further notice", so they are left out. United States: only residents of the 31 listed states (Alabama, Alaska, Arkansas, California, Colorado, Connecticut, Florida, Hawaii, Illinois, Indiana, Iowa, Kansas, Kentucky, Maine, Massachusetts, Michigan, Minnesota, Montana, Nebraska, New Hampshire, New Jersey, New York, North Carolina, Oklahoma, Pennsylvania, South Carolina, Texas, Utah, Virginia, West Virginia, Wyoming). Two issuers: DCS for residents of Australia, Japan, Malaysia, the Philippines, Singapore, South Korea, Taiwan, Thailand and Vietnam; Rain elsewhere. The docs add that residents of unlisted countries are reviewed case by case during KYC. No Jupiter Spend terms of service or cardholder agreement was found, so there is no prohibited-country list.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/jupiter-card
      detail: The Jupiter Card docs list supported countries of residence and supported US states, and name the issuer for each region.
      quote: "The list below shows where the Jupiter Card is actively offered"
      archive: data/archive/jupiter-card-supported-countries.txt
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/jupiter-card
      detail: The list marks Bangladesh as paused; Nigeria is marked the same way further on.
      quote: "Bangladesh (on pause until further notice)"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
  checked_at: "2026-10-09"
settlement:
  tokens:
    - symbol: USDC
      class: stablecoin
      backing: fiat
      issuer: Circle
      default: true
      caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    - symbol: USDT
      class: stablecoin
      backing: fiat
      issuer: Tether
      caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
  conversion: at_spend
  note: >-
    USDC is the base asset. The Solana deposit address takes USDC or USDT directly; tokens from Ethereum, Base, Arbitrum, Sui, BSC and Robinhood Chain arrive through Universal Deposit and are converted to USDC, and Send to Spend in Jupiter Mobile swaps any other token into USDC. Deposits are not converted to USD on arrival (the app only displays a USD balance); with a Rain-issued card they stay onchain as collateral and purchases settle over Visa in fiat. The DCS (Asia-Pacific) card's settlement mechanics are not documented separately.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/jupiter-card
      detail: The Jupiter Card page says USDC and USDT deposits are not converted to USD on arrival and stay onchain as collateral with a Rain card.
      quote: "The USDC and USDT you deposit are not converted to USD when they arrive"
      checked_at: "2026-10-12"
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend
      detail: The Spend page names USDC as the base deposit asset and says other tokens are converted to USDC.
      quote: "USDC is the base deposit asset."
      checked_at: "2026-10-12"
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/jupiter-card
      detail: Purchases settle over Visa in fiat.
      quote: "Purchases go through the Visa network and are settled in fiat."
      checked_at: "2026-10-12"
  checked_at: "2026-10-12"
