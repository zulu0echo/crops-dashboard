    role: card-issuer
    public: false
    license: proprietary
    operator: Rain (Signify Holdings, Inc.)
    required: true
  - name: DCS card programme (issuer for nine APAC countries)
    role: card-issuer
    public: false
    license: proprietary
    operator: DCS
    required: false
