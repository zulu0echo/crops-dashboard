    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: SumSub identity verification (Global ID)
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub
    required: true
  - name: Noah off-ramp (card balance to bank)
    role: other
    public: false
    license: proprietary
    operator: Noah
    required: false

