slug: coinbase-commerce
name: Coinbase Commerce (Onchain Payment Protocol)
type: checkout
website: https://beta.commerce.coinbase.com
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    Base Transfers deployments of the Commerce Onchain Payment Protocol. OnchainKit Checkout, the only public Commerce checkout SDK, forces base.id and USDC on Base (CheckoutProvider.tsx L297-L300, constants.ts L49 at 3ecbd8fd). Sampled Transferred logs put Base payments on 0x0305…b7a8 until 2026-04-01; 0xeADE…4971 is the README address. Excluded: Ethereum 0x1DAe…b25C, Polygon 0xc225…28FB, older Base deployments, testnets.

repos:
  - url: https://github.com/coinbase/commerce-onchain-payment-protocol
    role: contracts
    license: Apache-2.0
  - url: https://github.com/coinbase/onchainkit
    role: sdk
    license: MIT
  - url: https://github.com/coinbase/coinbase-commerce-php
    role: sdk
    license: MIT

contracts:
  - address: "0x03059433BCdB6144624cC2443159D9445C32b7a8"
    chain_id: 8453
    role: Transfers (Oct 2024 build; carried Base payments to 2026-04)
    verified: sourcify
  - address: "0xeADE6bE02d043b3550bE19E960504dbA14A14971"
    chain_id: 8453
    role: Transfers (README-documented Base address, repo HEAD)
    verified: sourcify

components:
  - name: Transfers settlement contract (Base)
    role: contracts
    public: true
    license: Apache-2.0
    operator: Coinbase (owner EOA 0x8899…428C)
    required: true
    repo: https://github.com/coinbase/commerce-onchain-payment-protocol
  - name: Coinbase Commerce operator signer (TransferIntent signing key)
    role: signer
    public: false
    license: proprietary
    operator: Coinbase Bermuda Technologies Limited
    required: true
  - name: Coinbase Commerce Charge API (api.commerce.coinbase.com)
    role: api
    public: false
    license: proprietary
    operator: Coinbase Bermuda Technologies Limited
    required: true
  - name: Commerce merchant account, onboarding and dashboard
    role: backend
    public: false
    license: proprietary
    operator: Coinbase Bermuda Technologies Limited
    required: true
  - name: Hosted checkout page (commerce.coinbase.com/pay)
    role: frontend
    public: false
    license: proprietary
    operator: Coinbase
    required: false
  - name: OnchainKit Checkout component (deprecated 2026-09-22)
    role: sdk
    public: true
    license: MIT
    operator: Coinbase
    required: false
    repo: https://github.com/coinbase/onchainkit
  - name: CDP JSON-RPC endpoint serving cdp_hydrateCharge and cdp_createProductCharge
    role: api
    public: false
    license: proprietary
    operator: Coinbase Developer Platform
    required: false
  - name: Commerce API client libraries (PHP, Ruby)
    role: sdk
    public: true
    license: MIT
    operator: Coinbase
    required: false
    repo: https://github.com/coinbase/coinbase-commerce-php
  - name: Permit2 (SignatureTransfer)
    role: contracts
    public: true
    license: MIT
    operator: Uniswap Labs (immutable deployment)
    required: false
    repo: https://github.com/Uniswap/permit2
  - name: Uniswap Universal Router (swap-and-pay paths)
    role: contracts
    public: true
    license: GPL-2.0-or-later
    operator: Uniswap Labs
    required: false
    repo: https://github.com/Uniswap/universal-router
  - name: Hosted checkout analytics (Amplitude, Sprig, Bugsnag, as.coinbase.com)
    role: other
    public: false
    license: proprietary
    operator: Coinbase and named vendors
    required: false
  - name: Base mainnet (chain 8453)
    role: ledger
    public: true
    license: MIT
    operator: Base network (sequencer operator not verified here)
    required: true
    repo: https://github.com/ethereum-optimism/optimism

