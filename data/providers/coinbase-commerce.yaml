  note: >-
    The Commerce Terms (last updated 2025-10-29, read from a Wayback snapshot because coinbase.com returns 403 to curl) bar merchants who are in, controlled by, or nationals or residents of Cuba, Iran, North Korea, Sudan or Syria, and bar supplying the Services to those countries or their nationals or residents. They also bar "any other country subject to United States embargo or HM Treasury's financial sanctions regime" without naming more; only the five named countries are listed. The Terms are addressed to merchants; payers reach the product through a merchant, and the supply clause covers them. Protocol level: the Transfers contract has no geographic filter, and a payee acting as its own operator can sign intents without Coinbase (see C2, C4). No first-party allowlist of merchant countries was found (help.coinbase.com returns 403; no Wayback copy of a supported-countries page). The product is being retired in favour of Coinbase Business Checkouts.
