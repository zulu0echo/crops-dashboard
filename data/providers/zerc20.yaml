availability:
  model: blocklist
  countries: [ KP, IR, SY ]
  note: >-
    The terms define Restricted Countries as jurisdictions under OFAC, EU or UN sanctions "including but not limited to" North Korea, Iran and Syria; only those three are named, so only they are listed. The terms are governed by Swiss law. At protocol level, the token contracts have no country check but enforce an owner-maintained address Blocklist (C1, C4). The production app bundle has no IP or country gate (archived grep), and it pre-checks recipients against the onchain Blocklist.
