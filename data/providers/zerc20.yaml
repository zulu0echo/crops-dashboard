slug: zerc20
name: zERC20 (zBNB on BNB Chain)
type: transfer
website: https://zerc20.io
primary_chain:
  name: BNB Chain
  chain_id: 56
  basis: >-
    zERC20 is deployed on Ethereum, Arbitrum, Base, BNB Chain, Polygon and Kaia (docs Contract Addresses page). We read the token's own transfer counter index() on each chain on 2026-10-09: zBNB on BNB Chain 0x4388…5c54 had 17356 indexed transfers, against 451/250/111 for zETH and 193/419/394 for zUSDC on Ethereum/Base/Arbitrum. Unit: the zBNB token proxy, its Verifier, the shared Blocklist, the zBNB Hub and LiquidityManager on BNB Chain. Excluded: zETH, zUSDC and zJPYC deployments (same code, Base-hosted hubs) and the testnets.

repos:
  - url: https://github.com/kbizikav/zERC20
    role: contracts
    license: BUSL-1.1
  - url: https://github.com/zerc20io/.github
    role: docs
    license: none

contracts:
  - address: "0x4388D5618B9e13Bd580209CDf37a202778C75c54"
    chain_id: 56
    role: zBNB token (ERC1967 proxy, UUPS)
    verified: sourcify
  - address: "0x857afA597B87513df9B2317A60677A617a6Ac748"
    chain_id: 56
    role: zERC20 implementation
    verified: sourcify
  - address: "0xb05977Af4aA54117910ed72141F674531894774A"
    chain_id: 56
    role: zBNB Verifier (ERC1967 proxy, UUPS)
    verified: sourcify
  - address: "0x6b4AafEb7746e13aAebd750418f6E9CfED6EE1c8"
    chain_id: 56
    role: Verifier implementation (not on Sourcify for chain 56)
    verified: none
  - address: "0x847b6E2dBB28A3a163C6e0fcA9B0222b9C1E4Df9"
    chain_id: 56
    role: Blocklist (shared, Ownable, not upgradeable)
    verified: sourcify
  - address: "0x35eE54CEDb9aba3b785C493C0B50643E65471c7A"
    chain_id: 56
    role: zBNB Hub (ERC1967 proxy)
    verified: sourcify
  - address: "0x39Cc069dF606c7bc8c79b0ADd0696BCaf548eFD9"
    chain_id: 56
    role: zBNB LiquidityManager (ERC1967 proxy)
    verified: sourcify
  - address: "0x43010855B94e65e77679FE81af2047719F67B1fa"
    chain_id: 56
    role: Owner Safe of token, Blocklist, LiquidityManager (3-of-4)
    verified: sourcify
  - address: "0xb6d8B261948B097069eF926475cbB6dd698DafCa"
    chain_id: 56
    role: Owner Safe of Verifier and Hub (3-of-4)
    verified: none

components:
  - name: zBNB token (zERC20 proxy and implementation)
    role: contracts
    public: true
    license: BUSL-1.1
    operator: zERC20 owner Safe 0x4301…B1fa (3-of-4)
    required: true
    repo: https://github.com/kbizikav/zERC20
  - name: zBNB Verifier (root proofs, teleport, pause)
    role: contracts
    public: true
    license: BUSL-1.1
    operator: zERC20 owner Safe 0xb6d8…DafCa (3-of-4)
    required: true
    repo: https://github.com/kbizikav/zERC20
  - name: Blocklist (OFAC address list checked on every transfer)
    role: contracts
    public: true
    license: MIT
    operator: zERC20 owner Safe 0x4301…B1fa (3-of-4)
    required: true
    repo: https://github.com/kbizikav/zERC20
  - name: Allowlisted root prover (Decider prover and cross-chain job)
    role: other
    public: false
    license: proprietary
    operator: zERC20 (addresses allowlisted by the Verifier owner)
    required: true
  - name: zERC20 indexer (v1.mainnet.api.zerc20.io/indexer)
    role: indexer
    public: false
    license: proprietary
    operator: zERC20
    required: true
  - name: "@zerc20/client-sdk (proof generation, burn-address derivation)"
    role: sdk
    public: true
    license: MIT
    operator: user
    required: true
  - name: BNB Chain and a JSON-RPC endpoint
    role: ledger
    public: true
    license: LGPL-3.0
    operator: BNB Chain validators; RPC chosen by the integrator
    required: true
    repo: https://github.com/bnb-chain/bsc
  - name: zBNB Hub and LayerZero messaging (global roots, cross-chain)
    role: contracts
    public: true
    license: MIT
    operator: zERC20 owner Safe 0xb6d8…DafCa; LayerZero DVNs and executors
    required: false
  - name: LiquidityManager (wrap BNB into zBNB and unwrap)
    role: contracts
    public: true
    license: MIT
    operator: zERC20 owner Safe 0x4301…B1fa (admin role)
    required: false
  - name: ICP stealth storage canisters (encrypted announcements and invoices)
    role: other
    public: false
    license: proprietary
    operator: zERC20 on the Internet Computer
    required: false
  - name: Relay node (gasless redeem, swap to gas)
    role: relayer
    public: false
    license: proprietary
    operator: zERC20
    required: false
  - name: zERC20 app (app.zerc20.io)
    role: frontend
    public: false
    license: proprietary
    operator: zERC20
    required: false
  - name: Alchemy and Reown/WalletConnect services used by the app
    role: other
    public: false
    license: proprietary
    operator: Alchemy; Reown
    required: false

