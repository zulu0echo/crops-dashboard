context: >-
  Not scored. The Terms name Pontech Group L.L.C-FZ (UAE) as operator and Signify Holdings, Inc. (Rain) as Card Partner, "a licensed card program manager and issuing sponsor". The Card Terms describe the card as issued by an unnamed Issuer under licence from Visa. I found no primary source naming XPlace's own licences or regulator.

notes: >-
  Type card: Kamino's klend program is a verified build of a public repo, and XPlace's Terms make it the protocol through which Collateral and Credit Mode run. Judgment call: klend is third-party and no XPlace user position was found onchain, so the link rests on XPlace's Terms; Cash Mode (plain USDC balance) may not touch Kamino at all. XPlace's own "smart contracts audited by FYEO" (homepage) and Rain's Solana collateral program have no published address; Rain's integration repo SignifyHQ/collateral-contract-integration-examples has IDLs but no mainnet program id. The Kamino market XPlace uses was not identified (none of the 44 markets in api.kamino.finance is named for XPlace). Solana items carry no `check` because the nightly re-check reads EVM words only.

