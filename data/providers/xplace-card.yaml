slug: xplace-card
name: XPlace Card
type: card
website: https://x.place
primary_chain:
  name: Solana
  caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
  basis: >-
    XPlace Terms s1 and s5.4 say Collateral and Credit Mode run through Kamino Finance smart contracts on Solana, and the homepage FAQ says XPlace runs on Solana. Kamino's lending program KLend2g3... is an OtterSec-verified build of Kamino-Finance/klend at a08760976f. The unit is that program as used for XPlace collateral. Excluded: Rain's card collateral and any XPlace-owned program (FYEO-audited per marketing), because no address could be found; no other chain is named.

repos:
  - url: https://github.com/Kamino-Finance/klend
    role: contracts
    license: BUSL-1.1

contracts:
  - address: "KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD"
    caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    role: Kamino Lending program (upgradeable; collateral and credit)
    verified: verified-build
  - address: "6hhBGCtmg7tPWUSgp3LG6X2rsmYWAc4tNsA6G4CnfQbM"
    caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    role: Kamino upgrade multisig (Squads v4, 5-of-10, 24 h lock)
    verified: none

components:
  - name: Kamino Lending program (klend)
    role: contracts
    public: true
    license: BUSL-1.1
    operator: Kamino (upgrade key held by a Squads 5-of-10 multisig)
    required: true
    repo: https://github.com/Kamino-Finance/klend
  - name: XPlace mobile app and embedded wallet sign-in (email, Google, Apple)
    role: wallet
    public: false
    license: proprietary
    operator: Pontech Group L.L.C-FZ (XPlace)
    required: true
  - name: XPlace backend (credit mode, card funding, XP, membership)
    role: backend
    public: false
    license: proprietary
    operator: Pontech Group L.L.C-FZ (XPlace)
    required: true
  - name: XPlace smart contracts (claimed, address not published)
    role: contracts
    public: false
    license: proprietary
    operator: Pontech Group L.L.C-FZ (XPlace)
    required: false
  - name: Rain card programme (Card Partner; authorization, clearing, fiat settlement)
    role: card-issuer
    public: false
    license: proprietary
    operator: Signify Holdings, Inc. (Rain)
    required: true
  - name: Visa card network
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: Sumsub identity verification
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub
    required: true

