        commit: d494b63e79f33bb2b0c8ece6cdacdca465c3b884
        path: packages/contracts/src/contracts/PrivacyPool.sol
        detail: withdraw() requires the proof's ASP root to equal ENTRYPOINT.latestRoot() (L59); Entrypoint.updateRoot (Entrypoint.sol L93-L104) is onlyRole(ASP_POSTMAN), so the postman decides which deposit labels can be withdrawn privately. windDownPool (L256-L261, OWNER_ROLE) permanently stops deposits; ragequit (PrivacyPool.sol L132-L150) stays open to the original depositor.
        checked_at: "2026-10-09"
        confirmed_at: 2026-10-12
      - tier: verified
        kind: onchain
        url: https://etherscan.io/address/0x1f4Fe25Cf802a0605229e0Dc497aAf653E86E187
        address: "0x1f4Fe25Cf802a0605229e0Dc497aAf653E86E187"
        eoa: true
        block_number: 26153374
        detail: Entrypoint.hasRole(ASP_POSTMAN, 0x1f4F…E187) returns true at block 26153374; the address has no code (an EOA) and sent the latest updateRoot tx 0x6298b96d…ec83. RoleGranted logs show the postman role granted to this EOA and to the owner Safe only; the EOA's OWNER_ROLE was revoked at block 22169228.
        checked_at: "2026-10-09"
        recheck: cast call 0x6818809EefCe719E480a7526D76bD3e561526b46 "hasRole(bytes32,address)(bool)" 0xfc84ade01695dae2ade01aa4226dc40bdceaf9d5dbd3bf8630b1dd5af195bbc5 0x1f4Fe25Cf802a0605229e0Dc497aAf653E86E187 --rpc-url https://ethereum-rpc.publicnode.com
