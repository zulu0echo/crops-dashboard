slug: privacy-pools
name: Privacy Pools (0xbow)
type: transfer
website: https://privacypools.com
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    The core repo's deployments page (privacy-pools-core@d494b63e docs/docs/deployments.md L9-L17) lists only Ethereum mainnet, and the website's chainData.ts (privacy-pools-website@7df41112 L129-L142) lists mainnet first with 14 pools behind Entrypoint 0x6818…6b46. Onchain, the ETH pool's nonce is 6071 deposits at block 26153374. Unit: the Entrypoint proxy and the ETH, USDC and USDT pools (most deposits). Excluded: the 11 other mainnet pools (same code), the OP/BSC/Arbitrum Entrypoint 0x4419…d15E, Starknet and testnets.

repos:
  - url: https://github.com/0xbow-io/privacy-pools-core
    role: contracts
    license: Apache-2.0
  - url: https://github.com/0xbow-io/privacy-pools-website
    role: frontend
    license: CC-BY-NC-4.0

contracts:
  - address: "0x6818809EefCe719E480a7526D76bD3e561526b46"
    chain_id: 1
    role: Entrypoint (UUPS proxy)
    verified: sourcify
  - address: "0x15e355024de1CDc74ADdea7EBDf98418Ba5B1a2c"
    chain_id: 1
    role: Entrypoint implementation
    verified: sourcify
  - address: "0xF241d57C6DebAe225c0F2e6eA1529373C9A9C9fB"
    chain_id: 1
    role: ETH pool (PrivacyPoolSimple)
    verified: sourcify
  - address: "0xb419c2867aB3CBc78921660cB95150d95A94ce86"
    chain_id: 1
    role: USDC pool (PrivacyPoolComplex)
    verified: sourcify
  - address: "0xe859C0bD25f260BaEE534Fb52e307D3b64D24572"
    chain_id: 1
    role: USDT pool (PrivacyPoolComplex)
    verified: sourcify
  - address: "0x022891F938Ae7fDC8Ab9Ead0FBf50aBA8C897D6d"
    chain_id: 1
    role: Withdrawal Groth16 verifier
    verified: sourcify
  - address: "0xa45ACa8604a73D80C551fAad6355A5c3A5565eC6"
    chain_id: 1
    role: Ragequit (commitment) Groth16 verifier
    verified: sourcify

components:
  - name: Privacy pool contracts (ETH, USDC, USDT) and verifiers
    role: contracts
    public: true
    license: Apache-2.0
    operator: none (immutable; deposits only via the Entrypoint)
    required: true
    repo: https://github.com/0xbow-io/privacy-pools-core
  - name: Entrypoint (UUPS proxy, roles OWNER_ROLE and ASP_POSTMAN)
    role: contracts
    public: true
    license: Apache-2.0
    operator: 0xbow (owner Safe 2-of-4; postman EOA)
    required: true
    repo: https://github.com/0xbow-io/privacy-pools-core
  - name: 0xbow Association Set Provider (deposit screening and root posting)
    role: other
    public: false
    license: proprietary
    operator: 0xbow
    required: true
  - name: Circuits and proving artifacts (packages/circuits)
    role: other
    public: true
    license: Apache-2.0
    operator: none (static artifacts)
    required: true
    repo: https://github.com/0xbow-io/privacy-pools-core
  - name: Privacy Pools SDK (@0xbow/privacy-pools-core-sdk)
    role: sdk
    public: true
    license: Apache-2.0
    operator: user
    required: true
    repo: https://github.com/0xbow-io/privacy-pools-core
  - name: Ethereum mainnet and a JSON-RPC endpoint of the user's choice
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators; RPC chosen by the user
    required: true
    repo: https://github.com/ethereum/go-ethereum
  - name: ASP tree data on IPFS (CID posted onchain with each root)
    role: indexer
    public: true
    license: none
    operator: 0xbow publishes; any IPFS gateway serves
    required: false
  - name: 0xbow ASP API (leaves, roots, events for the website)
    role: api
    public: false
    license: proprietary
    operator: 0xbow
    required: false
  - name: Relayers (Fast Relay, Cloaked Relay; reference relayer in packages/relayer)
    role: relayer
    public: true
    license: Apache-2.0
    operator: third-party relayer operators
    required: false
    repo: https://github.com/0xbow-io/privacy-pools-core
  - name: privacypools.com website
    role: frontend
    public: true
    license: CC-BY-NC-4.0
    operator: 0xbow
    required: false
    repo: https://github.com/0xbow-io/privacy-pools-website
  - name: Envio HyperSync proxy, Alchemy RPC and price API (website defaults)
    role: indexer
    public: false
    license: proprietary
    operator: Envio; Alchemy
    required: false
  - name: Google Analytics and Sentry (website)
    role: other
    public: false
    license: proprietary
    operator: Google; Sentry
    required: false

