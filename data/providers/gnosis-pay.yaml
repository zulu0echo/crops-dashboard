  Not scored. The card is issued and its payment services are provided by Monavate: for EEA cardholders UAB Monavate, an electronic money institution authorised and regulated by the Bank of Lithuania (authorisation code LB002139); for UK and other non-EEA cardholders Monavate Ltd, authorised and regulated by the Financial Conduct Authority (firm reference number 901097). Rights as a payment services customer are against Monavate as the licensed issuer (closure notice, https://help.gnosispay.com/articles/1452055581). Monavate's EEA cardholder terms state that the EU deposit guarantee scheme does not apply and that EURe issuer Monerium is authorised as an electronic money institution by the Financial Supervisory Authority of the Central Bank of Iceland (https://help.gnosispay.com/articles/4471559864). After the card closes on 20 Dec 2026, support for refunds, disputes and chargebacks runs until 23:59 UTC on 12 June 2028 (closure notice). Personal data is processed under GDPR and UK GDPR with a named data protection officer, and KYC and transaction records are kept 5 years after account closure as a legal retention requirement (https://help.gnosispay.com/articles/7638555831, https://help.gnosispay.com/articles/7752555767-what-happens-to-your-data).

availability:
  model: allowlist
  countries: [ EEA, AR, BO, BR, CH, CO, GB, MX ]
  note: >-
    The Terms (Eligibility) require residence in the EEA or in a "Non-EEA Supported Country" listed in the Eligible Countries FAQ. That FAQ lists all 30 EEA states plus Argentina, Bolivia, Brazil, Colombia, Mexico, Switzerland and the United Kingdom. Residents of French overseas territories are not served. Product variants: EEA residents contract with Gnosis P. Tech (Portugal) and Monavate's EEA entity, everyone else with Gnosis Pay Co Ltd and Monavate Limited (UK); the supported stablecoin is GBPe in the UK, EURe in the EEA and Switzerland, and USDCe elsewhere. The same FAQ also says the card does not work for transactions made from 22 sanctioned or high-risk locations, including Crimea (a region of Ukraine), Russia, Belarus, Iran, North Korea, Venezuela and Zimbabwe. The Terms also exclude sanctioned persons and residents of countries sanctioned by the US, UN, UK or EU. The consumer card and web app close at 23:59 UTC on 20 December 2026 (closure notice of 21 September 2026); partner programmes set their own eligibility rules.
