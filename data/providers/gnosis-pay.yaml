    Gnosis Chain is the only chain the web app supports (gnosispay/ui src/wagmi.ts#L23 at 7fc844b: chains [gnosis]) and the Terms define the Safe as deployed to Gnosis Chain. Unit: the post-June-2026 account architecture pinned in account-kit 5.1.1 (9366073, src/deployments.ts#L56-L67) and a live account found from a Spend event at block 48629267. Excluded: pre-incident Safes and mastercopies, and the partner card programs that replace the consumer card after 20 Dec 2026.

