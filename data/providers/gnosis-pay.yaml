      checked_at: "2026-10-09"
      quote: Current Supported Countries of Residency
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://help.gnosispay.com/articles/2178874711
      archive: data/archive/gnosis-pay-terms.txt
      detail: Terms of Service section 2 (Eligibility) require residence in the EEA or a Non-EEA Supported Country listed in the Eligible Countries FAQ, and exclude residents of countries sanctioned by the US, UN, UK or EU.
      checked_at: "2026-10-09"
      quote: You must be resident in a Non-EEA Supported Country to order a Card
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://help.gnosispay.com/articles/1452055581-formal-notice-closure-of-the-gnosis-pay-web-app-and-card-21-september-2026
      archive: data/archive/gnosis-pay-closure-notice.txt
