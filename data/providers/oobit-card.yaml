    role: wallet
    public: false
    license: proprietary
    operator: Oobit
    required: true
  - name: Oobit backend and settlement layer (DePay engine, gas abstraction)
    role: backend
    public: false
    license: proprietary
    operator: Oobit
    required: true
  - name: Rain card programme
    role: other
    public: false
    license: proprietary
    operator: Rain
    required: true
  - name: Third National (card issuer per Card Terms)
    role: card-issuer
    public: false
    license: proprietary
    operator: Third National
    required: true
  - name: Visa card network
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC and fraud-prevention processors (not named)
    role: kyc
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Plug & Pay partner SDK (npm @oobit/react-native-sdk; repo private)
    role: sdk
    public: false
    license: MIT
    operator: Oobit
    required: false

