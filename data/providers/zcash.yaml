slug: zcash
name: Zcash (shielded transfers)
type: transfer
website: https://z.cash
primary_chain:
  name: Zcash mainnet
  caip2: "zcash:main"
  basis: >-
    Zcash is its own proof-of-work chain, so the unit is Zcash mainnet as defined by the maintained node, Zebra (v6.4.2, MAINNET_ACTIVATION_HEIGHTS in zebra-chain network_upgrade.rs L104-L120, NU6.3 at height 3,428,143). Scope: shielded ZEC transfers (Ironwood pool since NU6.3; Orchard spend-only per ZIP 258) and the transparent pool. Excluded: testnet, ZSAs (NU7 draft), exchanges and bridges. zcash:main is not a registered CAIP-2 namespace (ChainAgnostic/namespaces has none for Zcash); used as the brief directs.

repos:
  - url: https://github.com/ZcashFoundation/zebra
    role: backend
    license: Apache-2.0
  - url: https://github.com/zcash/librustzcash
    role: sdk
    license: MIT
  - url: https://github.com/zcash/orchard
    role: sdk
    license: MIT
  - url: https://github.com/zcash/zips
    role: docs
    license: MIT
  - url: https://github.com/zcash/lightwalletd
    role: indexer
    license: MIT
  - url: https://github.com/zingolabs/zaino
    role: indexer
    license: Apache-2.0
  - url: https://github.com/zcash/zallet
    role: frontend
    license: Apache-2.0
  - url: https://github.com/zodl-inc/zodl-android
    role: frontend
    license: MIT
  - url: https://github.com/zodl-inc/zodl-ios
    role: frontend
    license: MIT
  - url: https://github.com/zodl-inc/zodl-android-wallet-sdk
    role: sdk
    license: AGPL-3.0-only
  - url: https://github.com/zcash/zcash
    role: backend
    license: MIT

contracts: []

components:
  - name: Zcash mainnet consensus (proof-of-work miners and full nodes)
    role: ledger
    public: true
    license: Apache-2.0
    operator: miners and node operators; rule changes ship as node releases (ZIP process)
    required: true
    repo: https://github.com/ZcashFoundation/zebra
  - name: Zebra full node (zebrad), the maintained consensus node
    role: backend
    public: true
    license: Apache-2.0
    operator: Zcash Foundation (code); run by users, server operators and miners
    required: true
    repo: https://github.com/ZcashFoundation/zebra
  - name: Protocol libraries in every listed wallet (librustzcash, orchard, halo2)
    role: sdk
    public: true
    license: MIT
    operator: user (runs inside the wallet)
    required: true
    repo: https://github.com/zcash/librustzcash
  - name: Zodl mobile wallet (Android and iOS; reference light wallet)
    role: wallet
    public: true
    license: MIT
    operator: Znewco, Inc. (d/b/a Zodl)
    required: false
    repo: https://github.com/zodl-inc/zodl-android
  - name: Zodl Android and iOS wallet SDKs (AGPL-3.0-only, CLA, dual-licensed)
    role: sdk
    public: true
    license: AGPL-3.0-only
    operator: Znewco, Inc.
    required: false
    repo: https://github.com/zodl-inc/zodl-android-wallet-sdk
  - name: Zallet full-node wallet (beta)
    role: wallet
    public: true
    license: Apache-2.0
    operator: user
    required: false
    repo: https://github.com/zcash/zallet
  - name: lightwalletd servers (Zodl defaults zec.rocks, zec.stardust.rest, or custom)
    role: api
    public: true
    license: MIT
    operator: independent server operators
    required: false
    repo: https://github.com/zcash/lightwalletd
  - name: Zaino indexer (lightwalletd-compatible)
    role: indexer
    public: true
    license: Apache-2.0
    operator: server operators
    required: false
    repo: https://github.com/zingolabs/zaino
  - name: zcashd (archived predecessor node and wallet)
    role: backend
    public: true
    license: MIT
    operator: none (archived 2026)
    required: false
    repo: https://github.com/zcash/zcash
  - name: Zodl store-build integrations (Crashlytics, CoinMarketCap, Flexa, NEAR swaps)
    role: other
    public: false
    license: proprietary
    operator: Google, CoinMarketCap, Flexa, NEAR intents operators
    required: false

