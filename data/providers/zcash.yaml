        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0257.md#L51-L75
        commit: "3af03aa3ad991874d86b8cf35919bc9b4671e8ba"
        path: zips/zip-0257.md
        detail: ZIP 257 records that from Mainnet height 3363426 until NU6.2 activated at height 3364600, transactions MUST NOT contain Orchard Actions; the rule shipped as an emergency hotfix in zcashd v6.12.5 and zebra v4.5.3 after an Orchard circuit soundness bug was reported on 2026-05-29, and a first attempt 60 blocks earlier failed because some mining pools had not upgraded.
        checked_at: "2026-10-09"
        recheck: gh api "repos/zcash/zips/contents/zips/zip-0257.md?ref=3af03aa3ad991874d86b8cf35919bc9b4671e8ba" --jq .content | base64 -d | sed -n 51,75p
        confirmed_at: 2026-10-19
      - tier: verified
        kind: repo
        url: https://github.com/ZcashFoundation/zebra/blob/e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291/zebrad/src/components/sync/end_of_support.rs#L15-L41
        commit: "e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291"
        path: zebrad/src/components/sync/end_of_support.rs
        detail: Each Zebra release panics ("Zebra refuses to run") on Mainnet 84 days after its estimated release height (L86-L101), so node operators must install a newer release roughly every 12 weeks; the check is in public code and can be patched out by whoever builds the node.
        checked_at: "2026-10-09"
    finding: >-
      The Zcash consensus rules contain no admin key, pause, freeze, blacklist or allowlist role, and shielded addresses are not visible to anyone who could filter them. The rules can still be changed by coordinated node releases that miners and node operators adopt: in June 2026 the node teams shipped an emergency soft fork that disabled the whole Orchard pool for 1,174 blocks (about a day) without advance notice, to contain a balance-violation bug, documented after the fact in ZIP 257. That power is pool-wide, not per-address, and depends on miner adoption. Zebra releases also stop running 84 days after release, which forces operators to choose new software regularly. Judgment call: the substance is close to anchor 3 (no role that can target users), but the dashboard needs onchain evidence about a deployed contract for a 3, which a chain with no contract addresses cannot supply, and the June 2026 no-notice pool halt is recorded here, so we take 2.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-09
    review:
      status: pending

