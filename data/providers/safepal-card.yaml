context: >-
  Not scored. Per Fiat24's terms (https://docs.fiat24.com/legal/terms-and-conditions-fiat24-users-and-clients), Fiat24 is SR Saphirstein AG, Zurich (CHE-256.014.995), holding a FINMA fintech licence under Article 1b of the Swiss Banking Act; the terms state that the Swiss deposit protection scheme does not apply to Fiat24 client deposits and that no interest is paid. The card is a Mastercard debit card issued by Fiat24 (payment card terms). SafePal's page says Fiat24 "solely handles the compliance and licensing aspect" of the IBAN account and card.

notes: >-
  SafePal Card is the Fiat24 Mastercard and Swiss IBAN account offered inside the SafePal app. The "self-custody" framing is a claim: the card spends Fiat24 cash tokens (EUR24, USD24, CHF24, CNH24) that sit in the user's Arbitrum address but are issued, gated and movable by Fiat24, and card debits are pulled by Fiat24's authorizer key. The SafePal link is onchain: Fiat24Account.walletProviderMap(8026) returns "SafePal", and SafePal-referred accounts appear among card payers. All reads are pinned to Arbitrum block 512546136; Arbiscan returns 403 to scripted requests, so explorer links point to Blockscout and Sourcify. Neither SafePal nor Fiat24 publishes a repo for the card. No browser trace was run.

