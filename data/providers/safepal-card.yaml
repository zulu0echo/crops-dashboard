slug: safepal-card
name: SafePal Card
type: card
website: https://www.safepal.com/en/bank
primary_chain:
  name: Arbitrum One
  chain_id: 42161
  basis: >-
    SafePal's card page says the card and IBAN are offered with Fiat24 and that transactions are made on Arbitrum. Onchain, Fiat24Account.walletProviderMap(8026) = "SafePal", and SafePal-referred accounts (e.g. #75546) are debited by Fiat24CardAuthorization 0xe2e3B88B... on Arbitrum. Reads pinned to block 512546136. Excluded: Fiat24's Mantle deployment (SafePal names only Arbitrum) and the SafePal wallet app (closed).

repos: []

contracts:
  - address: "0xe2e3B88B9893e18D0867c08f9cA93f8aB5935b14"
    chain_id: 42161
    role: Fiat24CardAuthorization proxy (card debits)
    verified: sourcify
  - address: "0x96AA3D05755C54D2745d0Dc98Ea55E163DA5Bb16"
    chain_id: 42161
    role: Fiat24CardAuthorizationMarqeta implementation
    verified: sourcify
  - address: "0x2c5d06f591D0d8cd43Ac232c2B654475a142c7DA"
    chain_id: 42161
    role: EUR24 cash token proxy
    verified: sourcify
  - address: "0xbE00f3db78688d9704BCb4e0a827aea3a9Cc0D62"
    chain_id: 42161
    role: USD24 cash token proxy
    verified: sourcify
  - address: "0xd41F1f0cf89fD239ca4c1F8E8ADA46345c86b0a4"
    chain_id: 42161
    role: CHF24 cash token proxy
    verified: sourcify
  - address: "0x7288Ac74d211735374A23707D1518DCbbc0144fd"
    chain_id: 42161
    role: CNH24 cash token proxy
    verified: none
  - address: "0x133CAEecA096cA54889db71956c7f75862Ead7A0"
    chain_id: 42161
    role: Fiat24Account NFT proxy (account status, limits)
    verified: sourcify
  - address: "0x4582f67698843Dfb6A9F195C0dDee05B0A8C973F"
    chain_id: 42161
    role: Fiat24 crypto top-up and FX proxy
    verified: sourcify
  - address: "0x50873C8501143e55349f9938795f69A2BB64b6ca"
    chain_id: 42161
    role: ProxyAdmin for all Fiat24 proxies (owner is an EOA)
    verified: sourcify
  - address: "0x40C57923924B5c5c5455c48D93317139ADDaC8fb"
    chain_id: 42161
    role: SanctionsList oracle read by the cash tokens
    verified: sourcify

components:
  - name: Fiat24CardAuthorization contract (debits the cardholder's cash tokens)
    role: contracts
    public: true
    license: MIT
    operator: SR Saphirstein AG (Fiat24); admin EOA 0x1272...9D59
    required: true
  - name: Fiat24 cash tokens EUR24, USD24, CHF24, CNH24 and Fiat24Account NFT
    role: ledger
    public: true
    license: MIT
    operator: SR Saphirstein AG (Fiat24)
    required: true
  - name: Fiat24 card authorizer key (sole AUTHORIZER_ROLE holder, an EOA)
    role: signer
    public: false
    license: proprietary
    operator: SR Saphirstein AG (Fiat24)
    required: true
  - name: Fiat24 backend and API (api.fiat24.com; KYC, status, payouts)
    role: backend
    public: false
    license: proprietary
    operator: SR Saphirstein AG (Fiat24)
    required: true
  - name: Marqeta card processing (named in the authorizer contract)
    role: other
    public: false
    license: proprietary
    operator: Marqeta
    required: true
  - name: Fiat24 (SR Saphirstein AG) as card issuer and account provider
    role: card-issuer
    public: false
    license: proprietary
    operator: SR Saphirstein AG
    required: true
  - name: Mastercard (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Mastercard
    required: true
  - name: Fiat24 KYC and onboarding (vendor not named)
    role: kyc
    public: false
    license: proprietary
    operator: SR Saphirstein AG (Fiat24)
    required: true
  - name: SafePal wallet app (Bank tab, card screens, top-up)
    role: frontend
    public: false
    license: proprietary
    operator: SafePal
    required: false
  - name: Cardholder's Arbitrum address holding the account NFT and cash tokens
    role: wallet
    public: true
    license: none
    operator: Cardholder
    required: true

