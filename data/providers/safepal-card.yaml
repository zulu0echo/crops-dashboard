  note: >-
    The 42 listed places are those SafePal's regions page marks "with Mastercard support" (its getMasterCountries list); they match Fiat24's own card-eligible domicile list (info.fiat24.com/api/fiat24/getCountries) exactly. SafePal's wider IBAN-only list adds 19 domiciles with a $1,000/month limit and no card (AD, AM, AR, BD, CL, CO, CR, DM, DO, GE, HR, ID, MK, MX, PE, SM, TH, TR, UY); Fiat24's own list omits HR. Eligibility also needs citizenship of a supported region per SafePal, and Fiat24 excludes US persons and nationals of Iran, North Korea and Russia. SafePal's FAQ mentions a Mainland China limit, but neither current list includes CN, so CN is not listed. Fiat24 also blocks card payments at merchants in 38 countries (its "restricted payments" list), which limits where the card works, not who can hold it.
