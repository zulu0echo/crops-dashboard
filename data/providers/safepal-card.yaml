      address: "0x7288Ac74d211735374A23707D1518DCbbc0144fd"
  conversion: at_top_up
  note: >-
    SafePal Card is Fiat24's Mastercard, which spends Fiat24 cash tokens on Arbitrum: USD24, EUR24, CHF24 and CNH24 (RMB). They are tokenised deposits issued by SR Saphirstein AG (Fiat24), the card issuer, backed one-to-one by cash deposits; transfers are gated by Fiat24's KYC status and sanctions checks, so they are classed as platform tokens rather than freely circulating stablecoins. Crypto becomes fiat at top-up: the wallet swaps the user's asset into Arbitrum USDC and Fiat24's top-up contract converts it into a cash token. At spend, Fiat24's card-authorisation contract debits the balance in the transaction currency if Direct Pay is on for it; otherwise it converts from the user-selected default card currency. No default is fixed by Fiat24.
  evidence:
    - tier: verified
      kind: onchain
      url: https://arbitrum.blockscout.com/address/0xe2e3B88B9893e18D0867c08f9cA93f8aB5935b14
      address: "0xe2e3B88B9893e18D0867c08f9cA93f8aB5935b14"
      chain_id: 42161
      block_number: 512546136
      detail: Fiat24CardAuthorization validXXX24Tokens() returns true for USD24, CHF24, EUR24 and CNH24 (EUR24 check shown).
      checked_at: "2026-10-12"
