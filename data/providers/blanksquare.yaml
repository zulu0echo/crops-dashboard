slug: blanksquare
name: Blanksquare (Shielder)
type: transfer
website: https://docs.blanksquare.io
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    The Deployments doc lists Base as the only mainnet row with a mainnet relayer (proxy 0x064A…dCFf), and the Web App doc names Base as its only network. The implementation is a Sourcify match identical to blanksquare-monorepo@5dad5a07 contracts/Shielder.sol. Unit: the proxy, implementation and four linked libraries. Excluded: HyperEVM (listed with a testnet relayer), Base and Arbitrum Sepolia, and the older v2 deployments (Aleph Zero EVM, Arbitrum) in shielding-dapp.

repos:
  - url: https://github.com/Cardinal-Cryptography/blanksquare-monorepo
    role: contracts
    license: Apache-2.0
  - url: https://github.com/Cardinal-Cryptography/shielding-dapp
    role: frontend
    license: MIT
  - url: https://github.com/Cardinal-Cryptography/shielder-quickstart
    role: frontend
    license: MIT

contracts:
  - address: "0x064A67a5484DF6baf36be42F9554d45E7741dCFf"
    chain_id: 8453
    role: Shielder proxy (ERC1967, UUPS)
    verified: explorer
  - address: "0xfFF44d366DeDF9B2A531109E1A08BF9873C58b53"
    chain_id: 8453
    role: Shielder implementation (v0.1.1)
    verified: sourcify
  - address: "0x37aA4F682012000acA40196F30E6cD737CF1eb94"
    chain_id: 8453
    role: Deposit Halo2 verifier (linked library)
    verified: sourcify
  - address: "0xd03dD8d2af1afCb6fC1F5f52D34273e3dd0B37dC"
    chain_id: 8453
    role: Withdraw Halo2 verifier (linked library)
    verified: sourcify
  - address: "0x04ebcaCDd79f80A0A992636bB0Bc9ADae8D9c0Fb"
    chain_id: 8453
    role: NewAccount Halo2 verifier (linked library)
    verified: sourcify
  - address: "0x152D43037802b57A17584AEf55C5B925366d3B6e"
    chain_id: 8453
    role: Poseidon2T8 library
    verified: sourcify

components:
  - name: Shielder proxy, implementation and verifier libraries on Base
    role: contracts
    public: true
    license: Apache-2.0
    operator: Common Labs; owner Safe 0x9Dc4…2165 (2-of-5) can pause and upgrade
    required: true
    repo: https://github.com/Cardinal-Cryptography/blanksquare-monorepo
  - name: Shielder circuits and client-side WASM prover
    role: sdk
    public: true
    license: GPL-3.0-only-with-Classpath-exception
    operator: user (proofs generated client-side)
    required: true
    repo: https://github.com/Cardinal-Cryptography/blanksquare-monorepo
  - name: shielder-sdk (TypeScript client, incl. withdrawManual direct path)
    role: sdk
    public: true
    license: Apache-2.0
    operator: user or integrating wallet
    required: true
    repo: https://github.com/Cardinal-Cryptography/blanksquare-monorepo
  - name: Base mainnet and a JSON-RPC endpoint of the user's choice
    role: ledger
    public: true
    license: MIT
    operator: Base sequencer (Coinbase); RPC chosen by the integrator
    required: true
    repo: https://github.com/ethereum-optimism/optimism
  - name: Shielder relayer (Base host did not resolve on 2026-10-09)
    role: relayer
    public: true
    license: Apache-2.0
    operator: Blanksquare / Common Labs Inc.
    required: false
    repo: https://github.com/Cardinal-Cryptography/blanksquare-monorepo
  - name: TEE prover and scheduler (Private Send delayed withdrawals)
    role: other
    public: true
    license: Apache-2.0
    operator: Blanksquare / Common Labs Inc.
    required: false
    repo: https://github.com/Cardinal-Cryptography/blanksquare-monorepo
  - name: Blanksquare Web App (app.blanksquare.io; offline on 2026-10-09)
    role: frontend
    public: false
    license: proprietary
    operator: Common Labs Inc.
    required: false
  - name: Blanksquare Mobile App
    role: wallet
    public: false
    license: proprietary
    operator: Common Labs Inc.
    required: false
  - name: Anonymity revoker (holder of the AR private key set by the owner)
    role: other
    public: false
    license: proprietary
    operator: undisclosed
    required: false
  - name: PostHog analytics in the apps
    role: other
    public: false
    license: proprietary
    operator: PostHog Inc.
    required: false

