      - tier: documented
        kind: document
        url: https://public.withcl.com/Monavate-Issuer-Terms-2023-Nov.pdf
        detail: Monavate's cardholder terms (linked from Crypto Life's legal page) let the issuer close the card or suspend access immediately, including where it believes continued use could damage its reputation.
        quote: "We may close your Card and E-wallet or otherwise suspend access to the Services immediately"
        archive: data/archive/metamask-card-monavate-issuer-terms.txt
        checked_at: "2026-10-07"
    finding: >-
      FoxConnect has no pause or blacklist, but every card settlement is a withdraw() that only an allowlisted operator can call, and the operators are EOAs run by Baanx. Any one of them can stop or selectively skip settlement, which meets anchor 0 on its own. The operator list is set by a 2-of-4 Safe with undisclosed signers, no modules, no guard and no timelock. On the excluded US deployment the owner is a single EOA. On the card side, Monavate's terms allow it to close or suspend a card immediately. Both the EOA-held settlement role (verified) and the documented card suspension meet anchor 0.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-07
