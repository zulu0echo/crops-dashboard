slug: metamask-card
name: MetaMask Card
type: card
website: https://metamask.io/card
primary_chain:
  name: Linea
  chain_id: 59144
  basis: >-
    Linea is the chain with the fullest card config in the MetaMask Mobile defaults (metamask-mobile b513a4b, app/selectors/featureFlagController/card/defaults.ts#L37-L102: FoxConnect spender addresses, a balance scanner and eight spendable tokens), and Crypto Life's product page says cardholders spend USDC, USDT and WETH from their wallet on Linea. Unit: the Global FoxConnect spender 0x9dd23A4a... at Linea block 32253699. Excluded: the US FoxConnect 0xA90b298d... (noted in C1 and S2), the Base, Monad and Solana configs, and the Immersve-run UK card on Base.

repos:
  - url: https://github.com/MetaMask/metamask-mobile
    role: frontend
    license: source-available

contracts:
  - address: "0x9dd23A4a0845f10d65D293776B792af1131c7B30"
    chain_id: 59144
    role: FoxConnect (Global) card spender, non-upgradeable
    verified: sourcify
  - address: "0xA90b298d05C2667dDC64e2A4e17111357c215dD2"
    chain_id: 59144
    role: FoxConnect (US) card spender, non-upgradeable
    verified: sourcify
  - address: "0x1b7A8fF58B58Ad2ABFd731A164298A06A82D9c99"
    chain_id: 59144
    role: FoxConnect (Global) owner, Safe 1.4.1 2-of-4
    verified: none
  - address: "0x8dFE562Cbb4E93D5029f39DA26BB6B501a8d1D3e"
    chain_id: 59144
    role: FoxConnect (Global) beneficiary, Safe 1.4.1 2-of-13
    verified: none
  - address: "0x576371678e97DfE55f60577cDe2905A1768b5cb6"
    chain_id: 59144
    role: FoxConnect (Global) treasury, Safe 1.4.1 2-of-10
    verified: none
  - address: "0xED9f04F2da1B42Ae558d5E688fe2Ef7080931C9A"
    chain_id: 59144
    role: Card balance scanner (read-only helper)
    verified: none
  - address: "0xacA92E438df0B2401fF60dA7E4337B687a2435DA"
    chain_id: 59144
    role: MetaMask USD (mUSD) token proxy
    verified: sourcify

components:
  - name: FoxConnect (Global) spender contract
    role: contracts
    public: true
    license: none
    operator: Baanx / Crypto Life (owner Safe 0x1b7A...9c99)
    required: true
  - name: Cardholder's own MetaMask account (EOA) holding the spendable tokens
    role: wallet
    public: true
    license: source-available
    operator: Cardholder
    required: true
    repo: https://github.com/MetaMask/metamask-mobile
  - name: Spendable tokens on Linea (USDC, USDT, WETH, EURe, GBPe, aUSDC, mUSD, amUSD)
    role: contracts
    public: true
    license: source-available
    operator: Each token's issuer (mUSD source is BUSL-1.1; USDC is Circle FiatToken)
    required: true
  - name: FoxConnect withdraw operators (33 EOAs) and multiSend signer EOA
    role: relayer
    public: false
    license: proprietary
    operator: Baanx / Crypto Life
    required: true
  - name: Crypto Life (Baanx) API and card authorisation backend (api.baanx.com)
    role: backend
    public: false
    license: proprietary
    operator: Baanx Group / Crypto Life (program manager)
    required: true
  - name: Baanx beneficiary Safe (receives every card pull)
    role: contracts
    public: true
    license: LGPL-3.0
    operator: Baanx / Crypto Life
    required: true
    repo: https://github.com/safe-global/safe-smart-account
  - name: KYC and eligibility screening (vendor not named)
    role: kyc
    public: false
    license: proprietary
    operator: Crypto Life
    required: true
  - name: Monavate (card issuer, e-money institution)
    role: card-issuer
    public: false
    license: proprietary
    operator: UAB Monavate
    required: true
  - name: Mastercard (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Mastercard
    required: true
  - name: MetaMask Mobile card screens (onboarding, spending limit, card details)
    role: frontend
    public: true
    license: source-available
    operator: Consensys
    required: false
    repo: https://github.com/MetaMask/metamask-mobile
  - name: Infura RPC (card reads on Linea, Base, Monad)
    role: other
    public: false
    license: proprietary
    operator: Consensys (Infura)
    required: false

