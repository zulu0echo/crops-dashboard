slug: umbra
name: Umbra Cash
type: transfer
website: https://app.umbra.cash
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    umbra-js lists the same Umbra address on every chain, with mainnet first and the earliest start block (umbra-protocol@07a64aee umbra-js/src/classes/Umbra.ts L44-L92), and the frontend's supportedChains puts Mainnet first (frontend/src/components/models.ts L50-L61). Unit: the Umbra contract 0xFb2d…5401 and StealthKeyRegistry 0x31fe…38f3 on Ethereum. Excluded: Optimism, Polygon, Base, Arbitrum and Gnosis deployments of the same code, the optional UmbraBatchSend and Uniswap withdraw hook, and testnets.

repos:
  - url: https://github.com/ScopeLift/umbra-protocol
    role: contracts
    license: MIT
  - url: https://github.com/ScopeLift/umbra-subgraph
    role: indexer
    license: none

contracts:
  - address: "0xFb2dc580Eed955B528407b4d36FfaFe3da685401"
    chain_id: 1
    role: Umbra (payments and announcements)
    verified: sourcify
  - address: "0x31fe56609C65Cd0C510E7125f051D440424D38f3"
    chain_id: 1
    role: StealthKeyRegistry
    verified: sourcify

components:
  - name: Umbra contract
    role: contracts
    public: true
    license: MIT
    operator: ScopeLift (owner EOA sets toll only; no proxy)
    required: true
    repo: https://github.com/ScopeLift/umbra-protocol
  - name: StealthKeyRegistry (or ENS records) for receiver public keys
    role: contracts
    public: true
    license: MIT
    operator: none (no admin functions)
    required: true
    repo: https://github.com/ScopeLift/umbra-protocol
  - name: umbra-js SDK (stealth key derivation, scanning, sends)
    role: sdk
    public: true
    license: MIT
    operator: user
    required: true
    repo: https://github.com/ScopeLift/umbra-protocol
  - name: Ethereum mainnet and a JSON-RPC endpoint of the user's choice
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators; RPC chosen by the user
    required: true
    repo: https://github.com/ethereum/go-ethereum
  - name: Umbra API (token list, fee estimates, withdrawal relayer)
    role: relayer
    public: false
    license: proprietary
    operator: ScopeLift
    required: false
  - name: Hosted Ponder indexer behind the /api/ponder Netlify proxy
    role: indexer
    public: false
    license: proprietary
    operator: ScopeLift
    required: false
  - name: Umbra subgraph (The Graph)
    role: indexer
    public: true
    license: none
    operator: ScopeLift
    required: false
    repo: https://github.com/ScopeLift/umbra-subgraph
  - name: app.umbra.cash frontend
    role: frontend
    public: true
    license: MIT
    operator: ScopeLift (Netlify)
    required: false
    repo: https://github.com/ScopeLift/umbra-protocol
  - name: Etherscan-family APIs (recipient key lookup from tx history)
    role: api
    public: false
    license: proprietary
    operator: Etherscan
    required: false
  - name: Chainalysis sanctions oracle lookup in umbra-js (0x40C5…C8fb)
    role: other
    public: false
    license: proprietary
    operator: Chainalysis
    required: false

