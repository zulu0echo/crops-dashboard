        path: contracts-core/contracts/Umbra.sol
        detail: The only owner powers are setToll, setTollCollector and setTollReceiver (L67-L85). Every send must pay exactly the current toll (L112-L115, L138), and the toll has no upper bound; there is no pause, blacklist or allowlist, and withdrawals do not check the toll.
