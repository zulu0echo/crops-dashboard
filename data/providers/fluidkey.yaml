slug: fluidkey
name: Fluidkey
type: transfer
website: https://www.fluidkey.com
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    Fluidkey's docs say deposits from other chains via Near Intents "are deposited as USDC on Base", and the earliest auto-earn profile in Fluidkey's recovery tool configures Base USDC (fluidkey/sara@e6e4fcd9 src/configs/autoEarnProfiles.ts). Unit: stealth accounts as counterfactual Safe 1.3.0 proxies on Base (singleton 0xd9Db…9552, factory 0xa6B7…6AB2) and the FluidkeyEarn module 0x3BDb…f2f9. Excluded: the other six EVM chains, Near Intents routes, bank (Noah) and tokenised-stock features.

repos:
  - url: https://github.com/fluidkey/fluidkey-stealth-account-kit
    role: sdk
    license: MIT
  - url: https://github.com/fluidkey/fluidkey-earn-module
    role: contracts
    license: none
  - url: https://github.com/fluidkey/sara
    role: frontend
    license: MIT
  - url: https://github.com/fluidkey/fluidkey-hydrator
    role: contracts
    license: MIT

contracts:
  - address: "0xd9Db270c1B5E3Bd161E8c8503c55cEABeE709552"
    chain_id: 8453
    role: Safe 1.3.0 singleton (stealth account logic)
    verified: sourcify
  - address: "0xa6B71E26C5e0845f74c812102Ca7114b6a896AB2"
    chain_id: 8453
    role: Safe 1.3.0 proxy factory
    verified: sourcify
  - address: "0x3BDb857AFe9b51d8916D80240d2ADe40D4d3f2f9"
    chain_id: 8453
    role: FluidkeyEarnModule (optional auto-earn)
    verified: sourcify

components:
  - name: Stealth Safe accounts (Safe 1.3.0 proxy, singleton and factory)
    role: contracts
    public: true
    license: LGPL-3.0
    operator: none (each Safe is 1-of-1, owned by a user-derived stealth EOA)
    required: true
    repo: https://github.com/safe-global/safe-smart-account
  - name: Fluidkey backend (stealth address issuance, ENS offchain resolver, indexing)
    role: backend
    public: false
    license: proprietary
    operator: Fluid Privacy SA
    required: true
  - name: Fluidkey app (web and mobile)
    role: frontend
    public: false
    license: proprietary
    operator: Fluid Privacy SA
    required: true
  - name: Fluidkey Stealth Account Kit (@fluidkey/stealth-account-kit)
    role: sdk
    public: true
    license: MIT
    operator: user or Fluidkey app
    required: true
    repo: https://github.com/fluidkey/fluidkey-stealth-account-kit
  - name: Base and a JSON-RPC endpoint
    role: ledger
    public: true
    license: MIT
    operator: Base sequencer (Coinbase)
    required: true
    repo: https://github.com/ethereum-optimism/optimism
  - name: Gas sponsorship relayer
    role: relayer
    public: false
    license: proprietary
    operator: Fluid Privacy SA
    required: false
  - name: FluidkeyEarnModule and authorized relayers (auto-earn)
    role: contracts
    public: true
    license: AGPL-3.0
    operator: Fluid Privacy SA (owner Safe 2-of-3)
    required: false
    repo: https://github.com/fluidkey/fluidkey-earn-module
  - name: Privy embedded wallet (web login key derivation)
    role: wallet
    public: false
    license: proprietary
    operator: Privy
    required: false
  - name: SARA recovery interface (recovery.fluidkey.com)
    role: frontend
    public: true
    license: MIT
    operator: Fluid Privacy SA, or self-hosted
    required: false
    repo: https://github.com/fluidkey/sara
  - name: Noah (bank feature, KYC), Near Intents, Houdini Swap
    role: other
    public: false
    license: proprietary
    operator: third parties
    required: false

