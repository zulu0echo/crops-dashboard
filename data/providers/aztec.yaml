        path: l1-contracts/src/core/EscapeHatch.sol
        detail: The escape hatch lets a bonded, randomly chosen candidate propose blocks during periodic windows, bypassing the sequencer committee.
        checked_at: "2026-10-09"
        confirmed_at: 2026-10-12
      - tier: verified
        kind: repo
        url: https://github.com/AztecProtocol/aztec-packages/blob/49a592109ec4f18d79212b43d621891aaf36f7b6/noir-projects/noir-contracts/contracts/app/token_contract/src/main.nr#L62-L77
