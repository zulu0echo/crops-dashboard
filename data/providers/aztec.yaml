slug: aztec
name: Aztec (Alpha mainnet private token transfers)
type: transfer
website: https://aztec.network
primary_chain:
  name: Aztec mainnet (Alpha)
  caip2: "aztec:mainnet"
  basis: >-
    Aztec is a privacy L2 with its own state, sequencers and provers, settling to Ethereum. Unit: the mainnet the node follows. AztecProtocol/networks network_config.json L21-L32 names Registry 0x35b2…e298 on chain 1, whose canonical rollup is 0x91fF…8E34 (v5, Ethereum block 26,153,545). Scope: private transfers in tokens built on the reference Token contract. Excluded: testnet, older rollup versions, Fee Juice (not transferable). aztec:mainnet is not a registered CAIP-2 namespace.

repos:
  - url: https://github.com/AztecProtocol/aztec-packages
    role: contracts
    license: Apache-2.0
  - url: https://github.com/AztecProtocol/networks
    role: deploy
    license: none

contracts: []

components:
  - name: Aztec L1 rollup contracts on Ethereum (Registry, Rollup v5, Inbox, Outbox)
    role: contracts
    public: true
    license: Apache-2.0
    operator: Aztec Governance (Registry owner; Rollup parameter owner)
    required: true
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: Aztec L2 network (staked sequencer committee, provers, escape hatch)
    role: ledger
    public: true
    license: Apache-2.0
    operator: 3,085 staked attesters at Ethereum block 26,153,545; permissionless provers
    required: true
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: Ethereum mainnet (L1 settlement and data availability)
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators
    required: true
    repo: https://github.com/ethereum/go-ethereum
  - name: Aztec node (own, or someone else's), with an Ethereum execution and beacon RPC
    role: backend
    public: true
    license: Apache-2.0
    operator: user or node operator
    required: true
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: PXE and wallet (aztec.js, wallet-sdk, aztec-wallet CLI)
    role: wallet
    public: true
    license: Apache-2.0
    operator: user
    required: true
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: Fee Juice and FeeJuicePortal (non-transferable fee asset bridged from L1)
    role: other
    public: true
    license: Apache-2.0
    operator: none (portal immutable); fee asset bridged from the AZTEC L1 token
    required: true
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: Token contract and L1 portal of the asset being paid (third-party)
    role: contracts
    public: true
    license: Apache-2.0
    operator: token and bridge owners (e.g. Nyx.money TokenVaultPortal, Ownable)
    required: true
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: Aztec Governance and GovernanceProposer (sequencer signalling, token vote)
    role: other
    public: true
    license: Apache-2.0
    operator: AZTEC token holders and sequencers
    required: false
    repo: https://github.com/AztecProtocol/aztec-packages
  - name: Aztec Labs hosted RPC (mainnet.rpc.aztec-labs.com, Cloud Armor policy)
    role: api
    public: false
    license: proprietary
    operator: Aztec Labs
    required: false
  - name: Network config and snapshot hosts (networks repo, aztec-labs-snapshots.com)
    role: other
    public: true
    license: none
    operator: Aztec Labs
    required: false
    repo: https://github.com/AztecProtocol/networks
  - name: Third-party browser wallets and fee payment contracts (not reviewed)
    role: wallet
    public: false
    license: proprietary
    operator: wallet and FPC developers
    required: false

