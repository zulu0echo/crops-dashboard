  note: >-
    The rollup contracts and reference token have no country rule, and the node, PXE, aztec.js and CLI wallet contain no country or geolocation gate (code search on 2026-10-09; the only country hit is a testnet mock staking handler). Aztec Labs' hosted mainnet RPC (mainnet.rpc.aztec-labs.com) runs behind a Google Cloud Armor policy named in spartan/environments/mainnet.env whose rules are not public, so it may filter by region; users avoid it by running a node. Third-party wallets, bridges and token issuers may impose their own limits, which we did not evidence. Legality of use varies by jurisdiction; that is not an availability restriction by the protocol.
