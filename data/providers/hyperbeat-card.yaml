notes: >-
  Eligibility: no verified contract and no public repository needed to run the card, so type is incumbent. Searched 2026-10-07: GitHub orgs 0xhyperbeat (Audits plus forks; Liquid-Bank named in the Zellic scope returns 404) and hyperbeat (unrelated 2015 user); docs.hyperbeat.org (Liquid Banking architecture, Hyperbeat Pay, addresses, audits, legal pages; no card contract addresses); hyperbeat.org terms, privacy, sitemap; the Pay dapp at hyperbeat.org/dapp/pay and its 61 JS chunks (Operator and service addresses found, factory not); HyperEVMScan and Sourcify for the Operator, Morpho service, repay service, wrapper service, a beatUSD batchSettle contract 0xFc29c432... and a sample ERC1967 account 0xd9c6a70b... with implementation 0x6e209362... (all unverified). The Hyperbeat Pay Cardholder Agreement referenced in the Terms is not published, so the card issuer is unknown. HyperEVM onchain reads pinned to block 47900593.

availability:
  model: blocklist
  countries: [ CU, IR, KP, SD, SY ]
  note: >-
    The hyperbeat.org Terms (which cover the Pay Service, i.e. the card) bar nationals and residents of Cuba, Iran, North Korea, Sudan and Syria "or any other country subject to United States embargo", UN Security Council resolutions or HM Treasury sanctions; only the five named countries are listed here. The Terms also exclude residents of Ontario, Canada, and say geo-blocking may be used. US residents and citizens may use the Pay Service subject to a separate "Hyperbeat Pay Cardholder Agreement (U.S.)", which is not published, so any US state limits are unknown. The longer country list in the Terms applies only to Beatpot, a different service, and is not used here. The Pay web app bundle contains no country gate that I could find.
  evidence:
    - tier: documented
      kind: document
      url: https://hyperbeat.org/terms
      detail: The Terms bar nationals and residents of five named embargoed countries from the Platform and every Service.
      quote: "national or resident of Cuba, Iran, North Korea, Sudan, or Syria"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://hyperbeat.org/terms
      detail: The Terms exclude residents of Ontario, Canada, and allow US residents to use the Pay Service subject to a US cardholder agreement.
      quote: "subject to specific eligibility requirements detailed in the applicable Hyperbeat Pay Cardholder Agreement (U.S.), may also use the Pay Service"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-26
  checked_at: "2026-10-09"

settlement:
  tokens:
    - symbol: beatUSD
      class: platform
      issuer: Hyperbeat
      chain_id: 999
      address: "0x669abe85F96a9e3B34723F7Be9bC6F250aBC0Cc1"
    - symbol: USDC
      class: stablecoin
      backing: fiat
      issuer: Circle
      chain_id: 999
      address: "0xb88339CB7199b77E23DB6E890353E22632Ba630f"
  conversion: at_spend
  note: >-
    Cards spend from the user's ManagementAccount on HyperEVM. In Cash mode the account holds the settlement token and the Hyperbeat Operator calls settle() to deduct each card amount; in Credit mode the Operator borrows the settlement token from Morpho or Aave against the user's deposited collateral, which is not itself spent. The architecture doc names the settlement token only by example ("beatUSD or USDC"), enforced by a TokenWhitelistRegistry whose contents were not read, so no default is marked. Hyperbeat's Pay app bundle displays beatUSD ("Hyperbeat USD", onchain name) to the user as their "USD" balance, which suggests beatUSD is the usual spending balance. beatUSD is Hyperbeat's own dollar token; its reserves or backing are not documented in the sources read (the bundle mentions a BeatUSD Teller for USDC withdrawals via Paxos). The docs' Hyperbeat Pay page also says users can spend USDC/USDT; how USDT is handled is not stated.
  evidence:
    - tier: documented
      kind: document
      url: https://docs.hyperbeat.org/liquid-banking/liquid-banking-architecture
      detail: The TokenWhitelistRegistry enforces the specific stablecoin used for card settlements, given as "e.g., beatUSD or USDC"; in Cash mode the user holds that settlement token in the ManagementAccount.
      quote: "In this mode, you hold the settlement token directly in your ManagementAccount"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://docs.hyperbeat.org/liquid-banking/liquid-banking-architecture
      detail: In Credit mode the Operator borrows the settlement token on the user's behalf for each swipe.
      quote: "the Operator is authorized to borrow the settlement token from the DeFi protocol on your behalf"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://hyperbeat.org/_next/static/chunks/97b00ce1712acb99.js
      archive: data/archive/hyperbeat-card-settlement.txt
      detail: Hyperbeat Pay's own app bundle configures beatUSD (0x669abe85...) and USDC (0xb88339CB...) on HyperEVM and maps beatUSD to the "USD" balance shown to the user.
      quote: 'usdcAddress:"0xb88339CB7199b77E23DB6E890353E22632Ba630f",beatUsdAddress:"0x669abe85F96a9e3B34723F7Be9bC6F250aBC0Cc1"'
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-26
    - tier: verified
      kind: onchain
      url: https://hyperevmscan.io/address/0x669abe85F96a9e3B34723F7Be9bC6F250aBC0Cc1
      address: "0x669abe85F96a9e3B34723F7Be9bC6F250aBC0Cc1"
      chain_id: 999
      block_number: 48338520
      detail: name() returns "Hyperbeat USD", symbol() "beatUSD", decimals() 6 on HyperEVM (eth_call via https://rpc.hyperliquid.xyz/evm).
      recheck: cast call 0x669abe85F96a9e3B34723F7Be9bC6F250aBC0Cc1 'name()(string)' --rpc-url https://rpc.hyperliquid.xyz/evm
      checked_at: "2026-10-12"
  checked_at: "2026-10-12"

audits:
  searched: >-
    github.com/0xhyperbeat/Audits (folders liquid-bank, BeatPot, USD+, Vault-Infra, Vaults-Solver, Withdrawal-Queue, beHYPE), docs.hyperbeat.org audits page, and the audits/ folder of github.com/morpho-org/morpho-blue for the credit-mode Morpho dependency. Only the liquid-bank reports cover the Hyperbeat Pay card path; the other folders cover Hyperbeat vaults, staking and BeatPot and are not listed (any of them may relate to the beatUSD settlement token, which is context only). No audit of the Hyperbeat Operator backend or the Pay app was found.
  checked_at: "2026-10-13"
  reports:
    - auditor: Nethermind Security
      date: "2025-12-17"
      type: review
      scope: >-
        Hyperbeat Pay Management Account (NM-0697): ManagementAccount, ManagementAccountFactory, MorphoService, ServiceRegistry, TokenWhitelistRegistry and libraries (1785 lines of Solidity)
      url: https://github.com/0xhyperbeat/Audits/blob/990f60173c016971a4c910e1378f20bb472e37d8/liquid-bank/Nethermind.pdf
      commit: 33f200c
      covers_deployed: unknown
      findings: "2 medium, 10 low, 14 informational, 3 best practices; 5 fixed, 24 acknowledged"
      note: >-
        Initial report 25 November 2025 on commit 09e970; 33f200c is the final commit. The audited Liquid-Bank repo is private and the deployed contracts are unverified on HyperEVMScan and Sourcify, so the audited code could not be matched to the deployment.
    - auditor: Zellic
      date: "2025-11-06"
      type: audit
      scope: >-
        Hyperbeat Pay smart contracts in Liquid-Bank: ManagementAccount, ManagementAccountFactory, ManagementAccountStorage, ManagementAccountLib, MorphoService, ServiceRegistry, TokenWhitelistRegistry
      url: https://github.com/0xhyperbeat/Audits/blob/990f60173c016971a4c910e1378f20bb472e37d8/liquid-bank/Zellic.pdf
      commit: 431de44bc37ea1b647da376bee1a3031affff435
      repo: https://github.com/0xhyperbeat/Liquid-Bank
      covers_deployed: unknown
      findings: "1 critical, 3 medium, 7 low, 1 informational; 11 marked fixed, 3 acknowledged only"
      note: >-
        Review window 24-31 October 2025. The Liquid-Bank repo returns 404 (private) and the deployed contracts are unverified, so neither the audited commit nor the fixes can be matched to what runs.
    - auditor: Cantina
      date: "2024-01-05"
      type: contest
      scope: "Shared component (credit mode only): Morpho Blue core lending contract, public competition"
      url: https://github.com/morpho-org/morpho-blue/blob/main/audits/2024-01-05-morpho-blue-cantina-competition.pdf
      repo: https://github.com/morpho-org/morpho-blue
      covers_deployed: unknown
      findings: "0 critical, 1 high, 8 medium, 151 low, 36 gas, 163 informational submissions"
      note: >-
        Competition ran 16 November to 7 December 2023. Morpho Blue is used only when a user borrows in Credit mode; the Morpho deployment on HyperEVM was not compared with the audited code.
    - auditor: Cantina
      date: "2023-11-13"
      type: audit
      scope: "Shared component (credit mode only): Morpho Blue core lending contract, managed review"
      url: https://github.com/morpho-org/morpho-blue/blob/main/audits/2023-11-13-morpho-blue-cantina-managed-review.pdf
      repo: https://github.com/morpho-org/morpho-blue
