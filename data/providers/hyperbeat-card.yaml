slug: hyperbeat-card
name: Hyperbeat Card
type: incumbent
website: https://hyperbeat.org
repos: []
contracts: []

components:
  - name: Liquid Bank contracts (ManagementAccount, factory, registries; source private)
    role: contracts
    public: false
    license: proprietary
    operator: Hyperbeat (Zoeion Ltd Corporation)
    required: true
  - name: Hyperbeat Operator (settlement contract and backend)
    role: signer
    public: false
    license: proprietary
    operator: Hyperbeat
    required: true
  - name: Hyperbeat Pay app and backend (web dapp, iOS app, card authorisation)
    role: backend
    public: false
    license: proprietary
    operator: Zoeion Ltd Corporation (Panama)
    required: true
  - name: Turnkey (owner key management)
    role: wallet
    public: false
    license: proprietary
    operator: Turnkey
    required: true
  - name: Card issuer and program manager (not named in public documents)
    role: card-issuer
    public: false
    license: proprietary
    operator: unknown
    required: true
  - name: Visa (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC and screening provider (not named)
    role: kyc
    public: false
    license: proprietary
    operator: unknown
    required: true
  - name: Morpho (credit-mode borrowing)
    role: other
    public: true
    license: GPL-2.0-or-later
    operator: Morpho
    required: false

context: >-
  The Terms of Use say the Platform is provided and operated by Zoeion Ltd Corporation; the Privacy Policy gives a Panama City address. The Terms refer to a separate "Hyperbeat Pay Cardholder Agreement", which is not published on hyperbeat.org or docs.hyperbeat.org, so the card issuer and its regulator are not named publicly.

