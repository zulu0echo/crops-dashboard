        path: src/BETH.sol
        detail: BETH inherits only ERC20, ReentrancyGuard and ERC20Permit; its one privileged role, initializer, can only set the reward pool once and then zeroes itself (L54). There is no pause, blacklist or allowlist. This file is identical to the Sourcify source of 0x5624…9Cf8.
