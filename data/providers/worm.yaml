slug: worm
name: WORM (BETH proof-of-burn)
type: transfer
website: https://worm.cx
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    The contracts README (worm@b34b507d README.md L9-L19) lists deployments only on Ethereum mainnet, and the official CLI maps network "mainnet" to BETH 0x5624…9Cf8 (worm-miner@fd23cd80 common/src/contracts/network.rs L58-L66). Unit: BETH (proof-of-burn mint and spend), its two Groth16 verifiers, the Staking reward pool that mintCoin pays, and the BETHToETH hook used by the official send flow. Excluded: the WORM mining token, distributors and ICO contracts (not in the payment path), and Sepolia.

repos:
  - url: https://github.com/worm-privacy/worm
    role: contracts
    license: MIT
  - url: https://github.com/worm-privacy/proof-of-burn
    role: contracts
    license: MIT
  - url: https://github.com/worm-privacy/worm-miner
    role: sdk
    license: none
  - url: https://github.com/worm-privacy/worm-privacy.github.io
    role: frontend
    license: none
  - url: https://github.com/worm-privacy/trusted-setup
    role: deploy
    license: none

contracts:
  - address: "0x5624344235607940d4d4EE76Bf8817d403EB9Cf8"
    chain_id: 1
    role: BETH (mintCoin, spendCoin)
    verified: sourcify
  - address: "0x7c155d52b78799d4975417a3815cDe8C5aec434f"
    chain_id: 1
    role: ProofOfBurnVerifier (Groth16)
    verified: sourcify
  - address: "0x5745a35b9c5938B2307F0287f45df5743A9D02e6"
    chain_id: 1
    role: SpendVerifier (Groth16)
    verified: sourcify
  - address: "0x03d4702b51a98661B89dF5fcBe8C4baeF84C60B7"
    chain_id: 1
    role: Staking (reward pool credited on every mint)
    verified: sourcify
  - address: "0xbA5A285806c343AaD955a40FE4b6e5e607B752b6"
    chain_id: 1
    role: BETHToETH swap hook (optional)
    verified: sourcify

components:
  - name: BETH contract (proof-of-burn mint and spend)
    role: contracts
    public: true
    license: MIT
    operator: none (no owner, no proxy; initializer cleared)
    required: true
    repo: https://github.com/worm-privacy/worm
  - name: ProofOfBurn and Spend Groth16 verifiers
    role: contracts
    public: true
    license: GPL-3.0
    operator: none
    required: true
    repo: https://github.com/worm-privacy/worm
  - name: Staking reward pool (receives the 0.5% pool fee in mintCoin)
    role: contracts
    public: true
    license: MIT
    operator: none (no owner)
    required: true
    repo: https://github.com/worm-privacy/worm
  - name: Proof-of-burn and spend circuits
    role: other
    public: true
    license: MIT
    operator: none
    required: true
    repo: https://github.com/worm-privacy/proof-of-burn
  - name: Trusted-setup parameters (GitHub release assets)
    role: other
    public: true
    license: none
    operator: worm-privacy GitHub org
    required: true
    repo: https://github.com/worm-privacy/trusted-setup
  - name: worm-miner CLI (local burn, proof and mint)
    role: sdk
    public: true
    license: none
    operator: user
    required: true
    repo: https://github.com/worm-privacy/worm-miner
  - name: Ethereum mainnet and an RPC that serves eth_getProof
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators; RPC (hardcoded dRPC in the CLI)
    required: true
    repo: https://github.com/ethereum/go-ethereum
  - name: Hosted prover and broadcaster (prover-2.worm.cx, worm-miner server)
    role: relayer
    public: false
    license: proprietary
    operator: WORM team
    required: false
  - name: worm.cx frontend (GitHub Pages build of worm-privacy.github.io)
    role: frontend
    public: true
    license: none
    operator: WORM team
    required: false
    repo: https://github.com/worm-privacy/worm-privacy.github.io
  - name: BETHToETH and BETHToERC20 hooks with CypherETH pool liquidity
    role: contracts
    public: true
    license: MIT
    operator: none (immutable hooks); liquidity from third parties
    required: false
    repo: https://github.com/worm-privacy/worm
  - name: Public RPCs, WalletConnect and Uniswap Permit2 used by the frontend
    role: other
    public: false
    license: proprietary
    operator: various (dRPC, NodeReal, GetBlock, others; WalletConnect; Uniswap)
    required: false

