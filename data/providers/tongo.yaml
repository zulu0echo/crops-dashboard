        kind: document
        url: https://docs.tongo.cash/protocol/vault.html
        quote: Tongo contracts have a set owner (and an optional auditor) that have full control of the contract
        detail: The docs describe the owner's control in broad terms; the code limits it to auditor rotation and external-transfer approval.
        checked_at: "2026-10-09"
        confirmed_at: 2026-10-19
    finding: >-
      The settlement contracts have no pause, freeze, blacklist or upgrade path. At Starknet block 16117583, get_tongo_config on the USDC, STRK and ETH v2 ledgers returned owner 0x3bb4…a4e7 and no auditor (Option::None). The owner can therefore only allow or refuse external transfers from other ledgers, which ordinary transfers within a ledger do not use. The docs' phrase "full control of the contract" overstates what the code allows. Judgment call: the substance fits 3, but 3 needs onchain evidence, and the schema cannot hold Starknet addresses, so 2.
    provider_response: null
