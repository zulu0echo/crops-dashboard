        commit: 7dac05e823f83620fe231605ba81642a178657ad
        path: packages/contracts/src/tongo/Tongo.cairo
        detail: The ledger owner's only powers are change_auditor_key (rejected if the instance has no auditor) and approveTongo/revokeTongo, which gate receive_external_transfer from other ledgers. There is no pause, freeze, blacklist or replace_class in Tongo.cairo or Vault.cairo, and the Vault has no owner.
        checked_at: "2026-10-09"
        recheck: curl -s -X POST -H 'content-type:application/json' https://starknet-rpc.publicnode.com -d '{"jsonrpc":"2.0","id":1,"method":"starknet_call","params":{"request":{"contract_address":"0x00b32618c475b2fb50b0facd2c49136be6e77281834dc86bdae652680faad4d3","entry_point_selector":"0x2f9dcd9248258202f28bd37f3175e5a6107267df83a34999b7ac96f0d53d62e","calldata":[]},"block_id":"latest"}}' | jq -c .result
        confirmed_at: 2026-10-19
