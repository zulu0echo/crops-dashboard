notes: >-
  Unit: the v2 canonical Tongo ledgers and Vaults on Starknet mainnet. Starknet state was read via starknet-rpc.publicnode.com at block 16117583, using starknet_call and starknet_getClassHashAt. Those reads cannot be cited as onchain evidence because the schema accepts only 20-byte EVM or base58 addresses. This caps C1, C2, S1 and S2 at 2, as the findings explain. Usage is small: the v2 USDC Vault held 7.78 USDC and the other v2 Vaults held 0, while the larger v1 STRK instance held about 295.6 STRK. Contracts are identical at tag v2.0.0 (47ea644b) and master (7dac05e8). We ran no transactions, built nothing and inspected no frontend.

