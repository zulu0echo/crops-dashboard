slug: tongo
name: Tongo (confidential ERC-20 on Starknet)
type: transfer
website: https://tongo.cash
primary_chain:
  name: Starknet
  caip2: starknet:SN_MAIN
  basis: >-
    Tongo runs only on Starknet. The docs instances page lists the mainnet v2 Vaults and Tongo ledgers (USDC, STRK, ETH, USDT, WBTC) and the legacy v1 instances. Unit: the v2 canonical ledgers and their Vaults, class hashes 0x072c…471e (Tongo) and 0x044d…121f (Vault), which match onchain at Starknet block 16117583. Excluded: v1 instances, the Sepolia deployments, tongo-evm (a separate repo with no mainnet deployment listed), and the optional Relayer. Starknet addresses do not fit the schema's address format, so `contracts` is empty and onchain reads are recorded in findings and the research log.

repos:
  - url: https://github.com/fatlabsxyz/tongo
    role: contracts
    license: Apache-2.0
  - url: https://github.com/fatlabsxyz/she
    role: sdk
    license: Apache-2.0

contracts: []

components:
  - name: Tongo ledger contracts (v2 canonical instances)
    role: contracts
    public: true
    license: Apache-2.0
    operator: Owner 0x3bb4…a4e7 (external-transfer approvals only; no auditor)
    required: true
    repo: https://github.com/fatlabsxyz/tongo
  - name: Vault contracts (hold the ERC-20 reserve, deploy ledgers)
    role: contracts
    public: true
    license: Apache-2.0
    operator: none (no owner)
    required: true
    repo: https://github.com/fatlabsxyz/tongo
  - name: SHE proof library (Cairo verifier and TypeScript provers)
    role: sdk
    public: true
    license: Apache-2.0
    operator: user
    required: true
    repo: https://github.com/fatlabsxyz/she
  - name: "@fatsolutions/tongo-sdk (client-side proving and transaction building)"
    role: sdk
    public: true
    license: Apache-2.0
    operator: user
    required: true
    repo: https://github.com/fatlabsxyz/tongo
  - name: Starknet mainnet and a JSON-RPC endpoint of the user's choice
    role: ledger
    public: true
    license: Apache-2.0
    operator: StarkWare-operated sequencer; RPC chosen by the user
    required: true
    repo: https://github.com/starkware-libs/sequencer
  - name: Tongo Relayer contract (optional gasless path)
    role: relayer
    public: true
    license: Apache-2.0
    operator: Relayer owner (whitelists ledgers, assets and forwarders)
    required: false
    repo: https://github.com/fatlabsxyz/tongo
  - name: AVNU paymaster used by the Relayer
    role: paymaster
    public: false
    license: proprietary
    operator: AVNU
    required: false
  - name: Demo frontend (demo.tongo.cash)
    role: frontend
    public: false
    license: proprietary
    operator: Fat Solutions
    required: false

