        address: "0xAFa697ebC7919998AF5CdE325Fbe990dC926aae4"
        block_number: 52290735
        detail: ContractRegistry owner() and admin() both return 0x8b72904e3685448E6f890d65a15D2aA206C1e0ab, which has no code (EOA); contractByName("FundsManagementOracle") returns 0x467F3ACD346A3Aa56F612820367023B94dC73d3f, also an EOA.
        checked_at: "2026-10-07"
        check:
          call: "0xf851a440"
          expect: "0x0000000000000000000000008b72904e3685448e6f890d65a15d2aa206c1e0ab"
        recheck: cast call 0xAFa697ebC7919998AF5CdE325Fbe990dC926aae4 "admin()(address)" --rpc-url https://mainnet.base.org; cast code 0x8b72904e3685448E6f890d65a15D2aA206C1e0ab --rpc-url https://mainnet.base.org
      - tier: verified
        kind: onchain
        url: https://repo.sourcify.dev/8453/0x9D56758B772CA389802E97D832D0DAf6b8E47703
        address: "0x9D56758B772CA389802E97D832D0DAf6b8E47703"
        block_number: 52290735
        detail: FundsManagement (Sourcify match) processOutgoingTransaction (L293-L346) is onlyOracle and moves any amount of a token out of a named user wallet via executeFromExecutor; the oracle and admin addresses are read from the registry, which the owner EOA can repoint.
        checked_at: "2026-10-07"
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/terms
        detail: Terms 4.17 let Wirex restrict or block addresses through Wirex One for sanctions or risk policy.
        quote: Wirex may restrict or block access, through Wirex One, to certain On-Chain Infrastructure, digital assets, or blockchain addresses
        checked_at: "2026-10-07"
    finding: >-
      There is no pause flag, but there is a stronger power. A single oracle EOA, set in a registry whose owner and admin is one EOA, both decides and executes every debit from user wallets, and the Terms let Wirex block addresses. No multisig, no timelock, and it can target individual wallets. The Terms' statement that Wirex cannot move a user's assets does not match FundsManagement's oracle path.
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-07
    review:
      status: pending

