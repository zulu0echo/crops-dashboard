slug: wirex-one
name: Wirex One
type: card
website: https://www.wirexapp.com/legal/one/terms
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    The Wirex One web app bundle (archived) sets companyName "Wirex One", calls the Wirex BaaS API and registers chain 8453; Wirex's BaaS repo (7dff6ea) names Base and production ContractRegistry 0xAFa697eb..., whose FundsManagement runs card debits (Card-Debit-POS). Reads pinned to Base block 52290735. Excluded: legacy Wirex Pay chain 31415 (not in the RPC list), Stellar, chain 5042.

repos:
  - url: https://github.com/wirexapp/wirex-baas-agent-skills
    role: docs
    license: Apache-2.0

contracts:
  - address: "0xAFa697ebC7919998AF5CdE325Fbe990dC926aae4"
    chain_id: 8453
    role: ContractRegistry (owner and admin EOA; unverified)
    verified: none
  - address: "0xFB384a73e9B89b01749C1127cDe4FeA20fb9F06a"
    chain_id: 8453
    role: FundsManagement proxy (wallet executor; card debits)
    verified: sourcify
  - address: "0x9D56758B772CA389802E97D832D0DAf6b8E47703"
    chain_id: 8453
    role: FundsManagement implementation
    verified: sourcify
  - address: "0x51ca975555B547f9E3224d60e97292360f1f9DB7"
    chain_id: 8453
    role: Accounts proxy
    verified: sourcify
  - address: "0x780c27ece1037B65553A306317780fD4Ecf571a3"
    chain_id: 8453
    role: ExecutionDelayPolicy proxy (withdrawal delay)
    verified: sourcify
  - address: "0x8CE61167f79aae19a528C30f5ebfcf7FC2242890"
    chain_id: 8453
    role: ExecutionDelayPolicy implementation
    verified: sourcify
  - address: "0xfb7Fb83C837b0AD724DfeDB02D45a82c053647cF"
    chain_id: 8453
    role: TokensRegistry proxy (implementation unverified)
    verified: sourcify
  - address: "0xbFACe6Ad3c7f07714F2Cc0a2651436f897537a95"
    chain_id: 8453
    role: FundsBuffer proxy (receives card debits)
    verified: sourcify
  - address: "0xED22eA8be14bea1dd70fD0A770D2498117cfE0fF"
    chain_id: 8453
    role: ProxyAdmin of FundsManagement (owner EOA)
    verified: none
  - address: "0x7a55A64c4527A2fD8e423F4c0F684C14FDe774c1"
    chain_id: 8453
    role: Sample user wallet (Kernel v3.1 proxy)
    verified: none

components:
  - name: Wirex BaaS contracts on Base (registry, FundsManagement, policies)
    role: contracts
    public: true
    license: none
    operator: Wirex (owner EOA 0x8b72...e0ab)
    required: true
  - name: Kernel v3.1 smart account (ZeroDev)
    role: wallet
    public: true
    license: MIT
    operator: user, with Wirex executor module installed
    required: true
  - name: Wirex One app (web and mobile)
    role: frontend
    public: false
    license: proprietary
    operator: Wirex
    required: true
  - name: Wirex BaaS API (api-baas.wirexapp.com)
    role: backend
    public: false
    license: proprietary
    operator: Wirex
    required: true
  - name: FundsManagementOracle (EOA that executes card debits)
    role: signer
    public: false
    license: proprietary
    operator: Wirex
    required: true
  - name: Privy key management (user signer)
    role: signer
    public: false
    license: proprietary
    operator: Privy
    required: true
  - name: ERC-4337 bundler and paymaster (operator for Base not identified)
    role: bundler
    public: false
    license: proprietary
    operator: undisclosed (repo docs show bundler.wirexpay.com for Polygon)
    required: true
  - name: Card issuer (Wirex Limited; Novatti in AU/NZ)
    role: card-issuer
    public: false
    license: proprietary
    operator: Wirex Limited, Novatti Group
    required: true
  - name: Visa or Mastercard
    role: card-network
    public: false
    license: proprietary
    operator: Visa, Mastercard
    required: true
  - name: Identity verification provider (not named)
    role: kyc
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Crossmint Europe (EEA crypto-asset services, SEPA off-ramp)
    role: other
    public: false
    license: proprietary
    operator: Crossmint Europe S.L.
    required: false
  - name: Web app analytics (Sentry, Amplitude, Google Tag Manager, GrowthBook)
    role: other
    public: false
    license: proprietary
    operator: Sentry, Amplitude, Google, GrowthBook
    required: false
  - name: Settlement tokens (USDC, USDT, EURC, DAI; Wirex synthetics WUSD, WEUR)
    role: contracts
    public: true
    license: proprietary
    operator: Circle, Tether, Sky, Wirex
    required: true

