    avalanchecard.com and legal.avalanchecard.com (no audit mentioned), Rain's security page (audits under NDA, Sherlock named; SOC 2, PCI DSS and pentest summary only on request, not code audits), Rain's GitHub org SignifyHQ (SDKs and integration examples, no audits folder) and the Sherlock report repo (one Rain report). No audit of Rain's v1 RainCollateral contracts live on Avalanche C-Chain, or of the card app, is published.
