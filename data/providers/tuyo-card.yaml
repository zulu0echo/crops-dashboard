slug: tuyo-card
name: Tuyo Card
type: card
website: https://tuyo.com
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    Tuyo's FAQ says "The Tuyo Card and account services operate on Base" and the card guide says the card is powered by USDC on Base. Tuyo's recovery guide names the account contracts on Base: Kernel 3.2 implementation 0xD830D15D... and ECDSA validator 0x845ADb2C... (ZeroDev). Excluded: Ethereum, Arbitrum, BSC and Polygon, which are deposit and withdraw networks only. I could not identify a sample Tuyo account or its card collateral contract, so per-account onchain cells are unknown.

repos:
  - url: https://github.com/zerodevapp/kernel
    role: contracts
    license: MIT

contracts:
  - address: "0xD830D15D3dc0C269F3dBAa0F3e8626d33CFdaBe1"
    chain_id: 8453
    role: ZeroDev Kernel 3.2 implementation (Tuyo smart accounts)
    verified: sourcify
  - address: "0x845ADb2C711129d4f3966735eD98a9F09fC4cE57"
    chain_id: 8453
    role: ZeroDev ECDSA validator (root validator)
    verified: sourcify

components:
  - name: ZeroDev Kernel 3.2 smart account and ECDSA validator
    role: contracts
    public: true
    license: MIT
    operator: ZeroDev (code); account owned by the user
    required: true
    repo: https://github.com/zerodevapp/kernel
  - name: Card collateral contracts (not identified)
    role: contracts
    public: false
    license: proprietary
    operator: card provider (not named by Tuyo)
    required: true
  - name: Tuyo mobile app (signer key, card UI)
    role: wallet
    public: false
    license: proprietary
    operator: Tuyo, Inc.
    required: true
  - name: Tuyo backend
    role: backend
    public: false
    license: proprietary
    operator: Tuyo, Inc.
    required: true
  - name: Card provider and issuer (unnamed third-party issuer)
    role: card-issuer
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Visa card network
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC by the card provider
    role: kyc
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Bridge (fiat on and off ramp, virtual accounts)
    role: other
    public: false
    license: proprietary
    operator: Bridge Ventures LLC
    required: false

