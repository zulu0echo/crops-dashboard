context: >-
  Not scored. Tuyo, Inc. operates the app; the Terms of Service (28 July 2026) say the card is issued by an unnamed third-party issuer, and fiat ramps and virtual accounts are provided by licensed Financial Services Providers (Bridge is named in the Privacy Policy). The Terms state that Tuyo never holds the user's private key and that a suspended user can still withdraw through a block explorer. I found no primary source naming the issuer or its regulator.

notes: >-
  Scored from Tuyo's Terms (Notion, client-rendered, archived), Privacy Policy (archived), the help.tuyo.com guides (curl-readable), the ZeroDev Kernel source at tag v3.2, and Sourcify for the two Base contracts that Tuyo names. I could not identify a sample Tuyo account or its card collateral. base.blockscout.com is behind a Cloudflare challenge (not bypassed), Base public RPC refuses USDC log scans over 300 blocks, and Rain's docs need a login. As a result S1, S2, S3, P3 and the card-path onchain facts are unknown. Card Map (third party) lists Rain as issuer; no Tuyo document confirms it.
