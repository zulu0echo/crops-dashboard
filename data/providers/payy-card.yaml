slug: payy-card
name: Payy Card
type: card
website: https://payy.network
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    The card settles inside the Payy zk-rollup ("transactions are settled privately on Payy Network", Payy Card docs), and that rollup's state, USDC escrow and exits are enforced by RollupV1 proxy 0x367C1eAF... on Ethereum (polybase/payy 2f95947 eth/README.md#L142-L170, Mint migration Polygon -> Ethereum at L185). The rollup is not an EVM chain with its own RPC, so its L1 contract is the unit. Excluded: the legacy Polygon rollup 0x4cbb5041... (0 USDC at Polygon block 95103541) and the Payy Network EVM L2 (testnet only in @payy/client).

repos:
  - url: https://github.com/polybase/payy
    role: contracts
    license: none
  - url: https://github.com/polybase/payy/tree/2f95947f12981a838f6f0c9dddace825bf835502/pkg/node
    role: backend
    license: none

contracts:
  - address: "0x367C1eAF14AA06b78ce76bd0243297de79d85270"
    chain_id: 1
    role: RollupV1 proxy (USDC escrow, state root)
    verified: sourcify
  - address: "0x7d8837b547F4FEa0053571CB149e845FC58e9B2D"
    chain_id: 1
    role: RollupV1 implementation
    verified: sourcify
  - address: "0xfE455baCAF1968F1Ae6a322b8Ffbe56840e2f590"
    chain_id: 1
    role: ProxyAdmin of the rollup proxy
    verified: sourcify
  - address: "0x230Dfb03F078B0d5E705F4624fCC915f3126B40f"
    chain_id: 1
    role: Owner Safe 2-of-4 (rollup and ProxyAdmin owner)
    verified: sourcify
  - address: "0x14DACD534ddc676601B27f41Eb541a7951524a2F"
    chain_id: 1
    role: HonkVerifier for the live aggregate proof key
    verified: sourcify

components:
  - name: RollupV1 and Honk verifier contracts (Ethereum)
    role: contracts
    public: true
    license: none
    operator: Payy (Zeplo, Inc.), owner Safe 2-of-4
    required: true
    repo: https://github.com/polybase/payy
  - name: Payy node, aggregator and prover (sole onlyProver, validator signatures)
    role: other
    public: true
    license: none
    operator: Payy
    required: true
    repo: https://github.com/polybase/payy
  - name: Payy Wallet mobile app (holds keys, builds proofs, funds card debits)
    role: wallet
    public: false
    license: proprietary
    operator: Payy
    required: true
  - name: Payy backend (guild API - ramps, card, notes, KYC orchestration)
    role: backend
    public: false
    license: proprietary
    operator: Payy
    required: true
  - name: Rain card programme
    role: other
    public: false
    license: proprietary
    operator: Rain
    required: true
  - name: U.S.-based card issuer (issuing partner of Rain, not named)
    role: card-issuer
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Visa card network
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC vendor (Sumsub and Rain in the provider enum)
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub / Rain
    required: true

