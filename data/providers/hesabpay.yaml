context: >-
  Licensing: Da Afghanistan Bank's public list of licensed electronic money institutions (https://www.dab.gov.af/non-banking-financial-institutions, read 2026-10-07) lists HesabPay under the legal name Zinzir Ltd, licence No EMI101005, licence date 5 June 2023, website https://hesab.com/. The terms and privacy policy name the contracting entity as HesabPay, Inc. (Delaware); how that entity relates to the licensee Zinzir Ltd is not stated in the sources read. Funds: HesabPay's terms s2.3 state that it holds user funds 1:1 in the banking system, and privacy policy s3 says licensed banks hold the funds; these are HesabPay's own statements, and no regulator or auditor document confirming a safeguarding arrangement was read (Da Afghanistan Bank's regulation page links a payment-system licensing regulation whose PDF returned 404 on 2026-10-07). KYC/AML: privacy policy s2 cites Know Your Customer and Anti-Money Laundering rules "as required by Da Afghanistan Bank". Recourse: terms s9 put the agreement under the laws of Delaware, with negotiation or mediation before litigation.
notes: >-
  Eligibility: no public repository owned by HesabPay and no verified contract found, so type is incumbent. Searched 2026-10-07: gh search repos hesabpay / hesab; gh search code hesabpay; GitHub users/orgs hesabpay, HesabPay, hesab-pay, hesabpay-official, hesabpayglobal (all 404) and user search "hesabpay" (two unrelated accounts: HesabPayZinzir with 0 repos, habib-studio). Every hesabpay repo found is a third-party merchant integration (WooCommerce, Laravel, Django, Flutter) calling HesabPay's hosted API, not code needed to run the product. Blockscout search "hesab" on Ethereum returned nothing; hesab.com, its privacy policy, terms and the developer-portal bundle contain no EVM address or contract reference. hesabpay.com returns a Cloudflare 403 to non-browser clients; the operating site is hesab.com, which the privacy policy names as the website. HesabPay is described on hesab.com and in an Algorand Foundation case study (claimed tier) as running on Algorand. Algorand ASAs named "HesabPay" exist (e.g. 1258542524, 3561304383) whose self-asserted url field points at hesab.com, but no HesabPay document links to them, ASAs carry no verifiable source, and the schema does not represent Algorand; they are logged in docs/research/hesabpay.md and not used. Scores rest on the terms and privacy policy (documented tier, cap 1) and one reproducible page fetch.
