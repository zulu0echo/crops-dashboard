        detail: Deployed ERC20FeeProxy is a Sourcify exact_match to this source; tx 0x2580e807b575a321c20e3134eea8e18a0edba56ae97ca25b315215e0a7113d4e (block 52282170) shows a non-Request contract calling it and emitting TransferWithReferenceAndFee.
        checked_at: "2026-10-07"
