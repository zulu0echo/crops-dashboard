slug: request-network
name: Request Network
type: checkout
website: https://request.network
primary_chain:
  name: Base
  chain_id: 8453
  basis: >-
    The vendor's docs repo (RequestNetwork/mintlify-docs@1845bc53) uses "USDC-base" as its example payment currency more than any other mainnet ID (15 occurrences vs 8 for USDC-mainnet), and Base is one of the 7 EVM chains in its supported-chains table (resources/supported-chains-and-currencies.mdx L19). Excluded: Ethereum, Arbitrum, Optimism, Polygon, BSC, Tron, about 20 SDK-only legacy chains, NEAR, and Gnosis Chain, which hosts request storage (described in notes, not scored onchain).

