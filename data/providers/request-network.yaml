        checked_at: "2026-10-07"
        recheck: gh api "repos/RequestNetwork/invoicing-template/contents/utils/context.tsx?ref=6f4872a68e08a3e18a42b72fb7baa9c2ba8de253" --jq .content | base64 -d | sed -n 39,46p
    finding: >-
      On the open path, the only required intermediary is a Request Node, which stores the request and needs IPFS and a Gnosis RPC. Its code, a README setup guide, Docker images, and a Helm chart are all public. The SDK configures no fallback node; the reference template falls back to Request's hosted Gnosis gateway. No relayer, paymaster, or bundler is needed. Request Network's current docs describe only its hosted API, which is closed and single-vendor and would score 0. Judgment call: we score the open protocol path, because a payment completes without the API. We score 2 and not 3, because the SDK itself sets no fallback. Storing a request on Gnosis also needs the open hash submitter to stay whitelisted by Request's Safe (see C1).
    provider_response: null
    assessed_by: AI research agent (seed), 2026-10-07
