availability:
  model: global
  note: >-
    Scored unit is the open protocol path. The fee proxies have no admin and no address or country check, and the SDK has no geoblock, so anyone can pay from anywhere. The hosted API, Secure Payment page and Dashboard are optional; their API terms (request.network/api-terms-and-conditions) and privacy policy name no countries, and the API's optional KYT screening (Hypernative) screens wallet addresses, including exposure to "Sanctioned Jurisdiction Exchanges", not users' countries. Product variant: the easy-invoice template's crypto-to-fiat flow offers a 40-country list in its compliance form (easy-invoice@42ad4d0e src/lib/constants/compliance.ts), which is an optional off-ramp, not the payment path. Judgment call: the closed API could gate by country without saying so; it is not required to pay.
