slug: railgun
name: Railgun
type: transfer
website: https://railgun.org
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    The deployments repo (Railgun-Community/deployments@68d93979 src/chains/ethereum.ts L1-L60) is the only chain with the governance stack (Delegator, Voting, Staking, ProxyAdmin) and empty L1Sender/L2Executor, so Ethereum governs the protocol; shared-models network-config.ts lists Ethereum first. Unit: RailgunSmartWallet proxy 0xFA70…a4b9 and its implementation, with the ProxyAdmin, Delegator and Voting contracts that control it. Excluded: the BSC, Polygon and Arbitrum deployments, the V3 contracts (supportsV3 false on Ethereum), RelayAdapt, and the RAIL token and treasury.

repos:
  - url: https://github.com/Railgun-Privacy/contract
    role: contracts
    license: none
  - url: https://github.com/Railgun-Privacy/circuits-v2
    role: contracts
    license: none
  - url: https://github.com/Railgun-Community/engine
    role: sdk
    license: MIT
  - url: https://github.com/Railgun-Community/wallet
    role: sdk
    license: MIT
  - url: https://github.com/Railgun-Community/shared-models
    role: sdk
    license: MIT
  - url: https://github.com/Railgun-Community/deployments
    role: deploy
    license: none
  - url: https://github.com/Railgun-Community/waku-broadcaster-client
    role: sdk
    license: MIT
  - url: https://github.com/Railgun-Community/private-proof-of-innocence
    role: backend
    license: MIT
  - url: https://github.com/Railgun-Community/subsquid-integration
    role: indexer
    license: MIT
  - url: https://github.com/Railway-Wallet/Railway-Wallet
    role: frontend
    license: AGPL-3.0

contracts:
  - address: "0xFA7093CDD9EE6932B4eb2c9e1cde7CE00B1FA4b9"
    chain_id: 1
    role: RailgunSmartWallet proxy (PausableUpgradableProxy)
    verified: sourcify
  - address: "0xD662C4B1F22AcEb0BEaCdf3A493De6f478686A0C"
    chain_id: 1
    role: RailgunSmartWallet implementation
    verified: sourcify
  - address: "0x4F8E20f55f879beE7Bc010Bd6bD2138B34aC65c8"
    chain_id: 1
    role: ProxyAdmin (upgrade and pause)
    verified: sourcify
  - address: "0xB6d513f6222Ee92Fff975E901bd792E2513fB53B"
    chain_id: 1
    role: Delegator (governance executor)
    verified: sourcify
  - address: "0xc480F68A3dcC3EdD82134FAB45C14A0FcF1dA3CC"
    chain_id: 1
    role: Voting (RAIL governance)
    verified: sourcify

components:
  - name: RailgunSmartWallet proxy and implementation
    role: contracts
    public: true
    license: none
    operator: RAIL governance (upgrade and pause via ProxyAdmin)
    required: true
    repo: https://github.com/Railgun-Privacy/contract
  - name: Circuits and proving artifacts (IPFS, circuits-v2)
    role: other
    public: true
    license: none
    operator: none (static artifacts)
    required: true
    repo: https://github.com/Railgun-Privacy/circuits-v2
  - name: RAILGUN engine, wallet and shared-models SDK (npm @railgun-community)
    role: sdk
    public: true
    license: MIT
    operator: user
    required: true
    repo: https://github.com/Railgun-Community/wallet
  - name: Ethereum mainnet and a JSON-RPC endpoint of the user's choice
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators; RPC chosen by the user
    required: true
    repo: https://github.com/ethereum/go-ethereum
  - name: Governance (Voting, Delegator, ProxyAdmin, VKeySetters)
    role: contracts
    public: true
    license: none
    operator: RAIL stakers
    required: false
    repo: https://github.com/Railgun-Privacy/contract
  - name: Broadcasters over Waku (waku-broadcaster-client)
    role: relayer
    public: true
    license: MIT
    operator: independent broadcaster operators
    required: false
    repo: https://github.com/Railgun-Community/waku-broadcaster-client
  - name: Hosted Subsquid indexer (rail-squid.squids.live, SDK default)
    role: indexer
    public: true
    license: MIT
    operator: unknown (Subsquid Cloud deployment)
    required: false
    repo: https://github.com/Railgun-Community/subsquid-integration
  - name: IPFS gateway ipfs-lb.com (SDK default for artifacts)
    role: other
    public: false
    license: proprietary
    operator: unknown
    required: false
  - name: Private Proof of Innocence aggregator (ppoi.fdi.network, Railway default)
    role: backend
    public: true
    license: MIT
    operator: unknown
    required: false
    repo: https://github.com/Railgun-Community/private-proof-of-innocence
  - name: Railway Wallet (desktop and mobile)
    role: frontend
    public: true
    license: AGPL-3.0
    operator: Right to Privacy Foundation
    required: false
    repo: https://github.com/Railway-Wallet/Railway-Wallet
  - name: Railway remote config and price APIs (CoinGecko, CoinPaprika, DefiLlama)
    role: api
    public: false
    license: proprietary
    operator: Right to Privacy Foundation; price vendors
    required: false

