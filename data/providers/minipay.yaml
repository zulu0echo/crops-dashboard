    score: 0
    evidence:
      - tier: documented
        kind: document
        url: https://minipay.to/terms-of-service
        quote: "reserves the right at any time to modify or discontinue the Services in whole or in part, and to terminate your access to the Services at any time, with or without notice"
        detail: "Blueboard Terms of Service, general section: Blueboard may terminate an individual user's access to the Services at any time, with or without notice."
        checked_at: "2026-10-07"
        confirmed_at: 2026-10-19
    finding: >-
      Blueboard can cut an individual user off from the MiniPay app at any time with no notice, which blocks the MiniPay payment path for that user. MiniPay has no settlement contracts of its own: transfers are plain stablecoin transfers on Celo, and issuer freeze powers over USDC and USDT belong under C5. Judgment call: scored 0 on the termination power over the app path. The user's keys stay with the user (see C2 and S4), so the funds themselves are not frozen by this power.
