slug: minipay
name: Opera MiniPay
type: incumbent
website: https://minipay.to
repos: []
contracts: []
notes: >-
  Incumbent by the eligibility rule: no verified contract and no public repository needed to run MiniPay was found. MiniPay is a closed, self-custodial stablecoin wallet app (Android, iOS, inside Opera Mini) offered by Blueboard Limited (Opera Group) on Celo mainnet (chain 42220). It settles in third-party stablecoins (USDm, USDC, USDT) and maps phone numbers through Celo's generic SocialConnect stack (ODIS plus the FederatedAttestations core contract 0x0aD5b1d0C25ecF6266Dd951403723B2687d6aff2). The one MiniPay-specific onchain element is its SocialConnect issuer, 0x7888612486844Bb9BE598668081c59A9f7367FBc, which has no code (an EOA), so it is not a verified contract. MiniPay-related public repos all belong to celo-org (snippets, Mini App templates, workshops); none runs the wallet. The Opera and operasoftware GitHub orgs have no MiniPay repo, and github.com/minipay is an unrelated 2019 org. www.opera.com/products/minipay redirects to minipay.to, which links the terms, privacy statement and docs.minipay.xyz. The FAQ on minipay.to is support content, so it is claimed tier and holds no score up. Search log: docs/research/minipay.md.
