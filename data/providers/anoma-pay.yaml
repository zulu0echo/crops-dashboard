slug: anoma-pay
name: AnomaPay
type: transfer
website: https://anomapay.app
primary_chain:
  name: BNB Chain
  chain_id: 56
  basis: >-
    Anoma's launch post and press release (2 Apr 2026) put the AnomaPay public beta on BNB Chain, and pa-evm bindings/src/addresses.rs (L32-L35) and the forwarder's addresses.rs map BinanceSmartChain to protocol adapter 0xFC44…2B68 and ERC20 forwarder 0xDe6A…840e. Unit: those two contracts and the RISC Zero verifier they call. Excluded: deployments on Ethereum, Base, Optimism, Arbitrum, Monad, Stable, MegaETH and Aurora (Base had a private beta), and the Solana adapter.

repos:
  - url: https://github.com/anoma/pa-evm
    role: contracts
    license: MIT
  - url: https://github.com/anoma/anomapay-erc20-forwarder
    role: contracts
    license: MIT
  - url: https://github.com/anoma/anoma-app-sdk
    role: sdk
    license: Apache-2.0
  - url: https://github.com/anoma/arm-risc0
    role: sdk
    license: Apache-2.0
  - url: https://github.com/anoma/anomapay-erc20-resource
    role: sdk
    license: none

contracts:
  - address: "0xFC44b66a39fe6923Ad8d3c93bFeC369728862B68"
    chain_id: 56
    role: Protocol Adapter v1.1.0 (settlement, proof verification)
    verified: sourcify
  - address: "0xDe6A308ed57AF26BFf059e6C550BD4908aC1840e"
    chain_id: 56
    role: ERC20 Forwarder v1.0.1 (holds wrapped tokens)
    verified: sourcify
  - address: "0x7C1B7b8fEB636eA9Ecd32152Bce2744a0EEf39C7"
    chain_id: 56
    role: RISC Zero verifier router
    verified: sourcify
  - address: "0xBbcD45801a3c3B858fbc66674FE7c9f94e33dC72"
    chain_id: 56
    role: RISC Zero verifier (estop) for selector 0x73c457ba
    verified: sourcify

components:
  - name: Protocol Adapter v1.1.0 (non-upgradeable)
    role: contracts
    public: true
    license: MIT
    operator: Anoma Foundation Safe 0xE908…Da10 (3-of-5) holds emergencyStop
    required: true
    repo: https://github.com/anoma/pa-evm
  - name: ERC20 Forwarder (holds deposited tokens; emergency migratable)
    role: contracts
    public: true
    license: MIT
    operator: Emergency committee Safe 0xc703…d6C4 (3-of-5, same owners)
    required: true
    repo: https://github.com/anoma/anomapay-erc20-forwarder
  - name: RISC Zero verifier router and estop verifier
    role: contracts
    public: true
    license: Apache-2.0
    operator: RISC Zero router; verifier estop owned by the Anoma Safe 0xE908…Da10
    required: true
    repo: https://github.com/risc0/risc0-ethereum
  - name: Uniswap Permit2 (deposit authorisation)
    role: contracts
    public: true
    license: MIT
    operator: none (immutable)
    required: true
    repo: https://github.com/Uniswap/permit2
  - name: Anoma Resource Machine proving library (arm-risc0)
    role: sdk
    public: true
    license: Apache-2.0
    operator: user or proving service
    required: true
    repo: https://github.com/anoma/arm-risc0
  - name: AnomaPay ERC20 resource logic and circuits
    role: sdk
    public: true
    license: none
    operator: user or proving service
    required: true
    repo: https://github.com/anoma/anomapay-erc20-resource
  - name: anoma-app-sdk (keys, transfer building, API clients)
    role: sdk
    public: true
    license: Apache-2.0
    operator: user's client
    required: true
    repo: https://github.com/anoma/anoma-app-sdk
  - name: Transaction and Proving Service (backend.anoma.money)
    role: backend
    public: false
    license: proprietary
    operator: Anoma Foundation
    required: true
  - name: Vast.ai GPU datacenters running the prover
    role: other
    public: false
    license: proprietary
    operator: Vast.ai
    required: true
  - name: AnomaPay Indexer (encrypted resource discovery)
    role: indexer
    public: false
    license: proprietary
    operator: Anoma Foundation
    required: true
  - name: Envio GraphQL endpoint (public nullifier index)
    role: indexer
    public: false
    license: proprietary
    operator: Envio (hosted)
    required: true
  - name: AnomaPay web app (anomapay.app; source repo not public)
    role: frontend
    public: false
    license: proprietary
    operator: Anoma Foundation
    required: false
  - name: BNB Smart Chain and a JSON-RPC endpoint
    role: ledger
    public: true
    license: LGPL-3.0
    operator: BNB Chain validators; RPC chosen by the client
    required: true
    repo: https://github.com/bnb-chain/bsc

