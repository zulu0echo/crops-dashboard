availability:
  model: blocklist
  countries: [ BY, BI, CF, CG, CD, KP, GN, GW, IR, IQ, LB, LY, ML, MM, SS, RU, SO, SD, SY, UA, VE, YE, ZW ]
  note: >-
    From the AnomaPay terms (Version 1.0), which name SECO-embargoed "Prohibited Jurisdictions" as "including, but not limited to" this list, so it is not exhaustive. "Congo" is not specified; we list both CG and CD (more restrictive reading). The clause as published reads "are using the Software from one of the countries embargoed", apparently a drafting error for "are not". The terms also bar persons under UN, US, EU or Swiss sanctions and commercial use, and reserve geo-restriction. The contracts have no address or country check; we did not inspect the closed app for a geoblock.
  evidence:
    - tier: documented
      kind: document
      url: https://anomapay.app/terms-and-conditions
      detail: Section 2 lists the Prohibited Jurisdictions and reserves geo-restriction.
      checked_at: "2026-10-09"
      quote: "including, but not limited to: Belarus, Burundi, Central African Republic, Congo"
      confirmed_at: 2026-10-12
  checked_at: "2026-10-09"

notes: >-
  Unit: the BNB Smart Chain protocol adapter (v1.1.0) and ERC20 forwarder used by the AnomaPay public beta, with the RISC Zero verifier they call. BSC reads at blocks 126599704 (adapter owner, stop state) and 126599882 (Safes, forwarder state, balances); publicnode serves only recent BSC state, so rechecks use the latest block. Operator: Anoma Foundation (Zug) per the terms. The anomapay.app landing page also advertises an "AnomaPay Card"; card products were not assessed. No transactions, app runs, traces or self-host attempts.

