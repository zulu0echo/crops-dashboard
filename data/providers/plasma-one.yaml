settlement:
  tokens:
    - symbol: USDT0
      class: stablecoin
      backing: fiat
      issuer: USDT0 (LayerZero OFT of Tether's USDT)
      default: true
      chain_id: 9745
      address: "0xB8CE59FC3717ada4C02eaDF9682A9e934F625ebb"
  conversion: at_spend
  note: >-
    Plasma One's Terms say the card makes fiat payments funded by stablecoin balances in the user's wallet, without naming the token. Onchain, the Rain Coordinator on Plasma accepts USDT0 as a collateral asset, and the observed card funding pulled USDT0 from the user's account into its Rain collateral; Rain then pays the merchant in dollars over Visa. Other collateral assets, if any, were not enumerated (the Coordinator exposes a per-token check, not a list). The in-app Swap Function (via 0x) converts other assets, including XPL cashback, into stablecoins, but it is a manual step, not an auto-swap at spend. Cashback is paid in XPL. USDT0 is an omnichain representation of Tether's USDT; Tether is the underlying reserve issuer.
