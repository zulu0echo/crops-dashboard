notes: >-
  Plasma One publishes no contract addresses or repositories. The card-side contracts were found from USDT0 Transfer logs on Plasma (block range 34379335-34429334): per-user Rain Collateral BeaconProxies funded by Coordinator.pullAssetFromUserWallet. The International Card Terms name Plasma as the only Supported Blockchain and Rain as issuer, which is the basis for scoring Rain's Plasma deployment; the specific sample account is not confirmed as a Plasma One user. The accounts seen funding collateral are EIP-7702 delegations to ZeroDev Kernel v3.3 (0xd6CEDDe8...), which does not match a third-party claim (HarrisHan/plasma-one-account) that Plasma One uses Biconomy Nexus 1.2.0; neither is attributed. All reads pinned to Plasma block 34429835.

