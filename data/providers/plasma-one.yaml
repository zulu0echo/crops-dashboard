slug: plasma-one
name: Plasma One
type: card
website: https://www.plasma.org/personal
primary_chain:
  name: Plasma
  chain_id: 9745
  basis: >-
    The International Card Terms define Supported Blockchains as "the Plasma blockchain network" and name Rain as issuer, so the card's collateral runs on Rain's Plasma deployment: Coordinator 0xd5dd7939... and Collateral beacon 0xBb931B7B... (block 34429835). Judgment call: Plasma One publishes no addresses; that this Coordinator serves Plasma One rests on the terms, and the sample collateral used to show the flow is not confirmed as a Plasma One cardholder's. Excluded: the US card terms and the Bridge account services.

repos: []

contracts:
  - address: "0xd5dd79397FdfBe5E1fceEdC2463fE4A464873077"
    chain_id: 9745
    role: Rain Coordinator (payments, withdrawals, pulls)
    verified: explorer
  - address: "0x36F5A3156FC6deD6bbcA970D26972ABB2dfD6274"
    chain_id: 9745
    role: Rain collateral factory (TransparentUpgradeableProxy)
    verified: explorer
  - address: "0x6f3b5Fd970Ffe143E04F636B0d7c8a62DEf58740"
    chain_id: 9745
    role: ProxyAdmin of the collateral factory
    verified: none
  - address: "0xBb931B7BF3691053a7C9caf47Fb0172d20608134"
    chain_id: 9745
    role: Collateral UpgradeableBeacon (unverified)
    verified: none
  - address: "0x05263D2448d8Bd3dfB9B0b63B6585450c823C1a9"
    chain_id: 9745
    role: Collateral implementation
    verified: explorer
  - address: "0xe0C209DbE0A57e664Bc63Df4247E25939AECb959"
    chain_id: 9745
    role: Sample per-user collateral (BeaconProxy, unattributed)
    verified: none

components:
  - name: Rain Coordinator and per-user Collateral contracts
    role: contracts
    public: true
    license: proprietary
    operator: Signify Holdings, Inc. d/b/a Rain (owner EOA 0x21ebc2f2...)
    required: true
  - name: Rain collateral beacon and factory admin (unverified beacon)
    role: contracts
    public: false
    license: proprietary
    operator: Rain (EOA 0x21ebc2f2...)
    required: true
  - name: Rain executor, publisher and pull-operator keys
    role: signer
    public: false
    license: proprietary
    operator: Rain
    required: true
  - name: Rain (card issuer and program manager, Visa Principal Member)
    role: card-issuer
    public: false
    license: proprietary
    operator: Signify Holdings, Inc. d/b/a Rain
    required: true
  - name: Visa (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: Plasma One app and backend
    role: backend
    public: false
    license: proprietary
    operator: Plasma (Cayman Islands) and Plasma Labs UK Ltd.
    required: true
  - name: Privy wallet contracts and TEE key management (not identified)
    role: wallet
    public: false
    license: proprietary
    operator: Privy
    required: true
  - name: Sumsub (identity verification)
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub
    required: true
  - name: Bridge (global account services; not in the card path)
    role: other
    public: false
    license: proprietary
    operator: Bridge Building Inc. / Sp. Z.o.o. / Limited
    required: false
  - name: Plasma chain (PlasmaBFT validators)
    role: other
    public: true
    license: none
    operator: Plasma validators
    required: true

context: >-
  Per its Terms of Service and Privacy Policy, Plasma is an exempted company incorporated in the Cayman Islands (CO-412800) with Plasma Labs UK Ltd. as joint data controller, and states it is not a bank, exchange, broker or virtual asset service provider. The card is issued by Rain, a Visa Principal Member, under licence from Visa; global account services are provided by Bridge entities in the US, EEA (Poland) and elsewhere.

