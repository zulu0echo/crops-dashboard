  model: allowlist
  countries: [ US ]
  note: >-
    The assessed payment path is the virtual Phantom debit card (Lead Bank prepaid Visa via Bridge), which Phantom's help centre says is available only in the United States, except New York. The Cash account itself is described as available worldwide, and Stripe funding is also offered in EU member states, but without the card there is no card payment rail. The Lead Bank cardholder agreement names no countries or states.
  evidence:
    - tier: documented
      kind: document
      url: https://help.phantom.com/articles/use-your-virtual-phantom-debit-card-us-only-44800221533459
      detail: Phantom's debit card article limits the card to the US, excluding New York.
      quote: "The card is available in the US only (except New York)"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
      drift: true
    - tier: documented
      kind: document
      url: https://help.phantom.com/articles/cash-faq-44800866087443
      detail: The Cash FAQ says the Cash account is available worldwide but some features, including the card, are US (except New York) or EU only.
      quote: "Cash is available worldwide. Some features are available only in the United States (except New York) and EU"
      checked_at: "2026-10-09"
      drift: true
  checked_at: "2026-10-09"
