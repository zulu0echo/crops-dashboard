audits:
  searched: >-
    phantom.com (Cash, security and legal pages), help.phantom.com, docs.phantom.com/cash, github.com/phantom (no Cash, card or Cash-account program code), usecash.xyz and bridge.xyz, Least Authority's published reports, and Halborn's audit listing. The only published report is Least Authority's 2024 audit of the Phantom wallet code; it predates Cash. Phantom said in 2022 that Halborn and OtterSec had audited the wallet, but no such report is published. No audit was found for the CASH token program set-up, the Bridge debit-card contract or Phantom's Cash backend.
