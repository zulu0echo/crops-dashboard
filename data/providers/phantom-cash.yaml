context: >-
  Not scored. Per phantom.com/cash and the Lead Bank Prepaid Visa Cardholder Agreement, the card is issued by Lead Bank under licence from Visa, with Bridge Ventures LLC as Program Manager and Phantom as Platform Provider. usecash.xyz says CASH is issued by Bridge Building Inc., a FinCEN-registered MSB with state money-transmission licences (NMLS #2450917), with reserves in segregated accounts; it expects to move CASH under the GENIUS Act regime.

notes: >-
  Eligibility: no verified contract and no public repository needed to run the product, so type is incumbent. Searched 2026-10-07: phantom.com/cash, terms, privacy; help.phantom.com Cash section (FAQ, Understanding your Cash account, debit card, recovery, compromise, KYC); docs.phantom.com/cash; bridge.xyz Phantom card agreement; usecash.xyz; github.com/phantom (no Cash, card or Cash-account program). Onchain: the CASH mint (read above) and a sample of 60 recent CASH transactions, which use only SPL Token-2022, ATA, swap and prediction programs; no Squads or other smart-account program appeared, and the "self-custodial smart-contract wallet" and "debit-card smart contract" the help pages mention could not be identified. One candidate program, 99vQwtBw... (ExecuteTransfer with an ed25519 voucher), turned out to be a single-vault payout program unrelated to Cash accounts and was excluded. Re-assess as type card if Phantom or Bridge publishes the Cash account or debit-card program.

