  tokens:
    - symbol: CASH
      class: platform
      issuer: Bridge Building Inc. (Stripe), co-branded with Phantom
      default: true
      caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
      address: "CASHx9KJUStyftLFWGvEVf59SGeG9sh5FfcnZMVPCASH"
  conversion: at_spend
  note: >-
    CASH is a USD-pegged, fiat-reserve-backed stablecoin from Bridge and Phantom, classed here as platform because it is the provider's own-branded dollar. USDC, USDT or PYUSD sent to the Cash address on Solana are automatically swapped into CASH, so CASH is the only token the card debits. At payment Stripe/Bridge draws CASH from the Cash account and converts it to USD.
