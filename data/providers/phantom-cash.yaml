      commit: 18c5d927b8063911a3f09f82d31c57e49f171d85
      covers_deployed: unknown
      findings: "No issues; 2 suggestions (BIP32 validation, stronger password key derivation), both resolved"
      note: >-
        Initial review at aea4d38 (February to April 2024), verification at 18c5d92. The report predates the Cash account and debit card, and the closed-source app cannot be compared with the audited revision.
