slug: holyheld-card
name: Holyheld Card
type: card
website: https://holyheld.com
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    The card top-up contract is the only onchain component. Its Ethereum deployment 0x6fC79dDD... (TransparentUpgradeableProxy, Sourcify exact match) emits CardTopup events continuously from block 16810662 to a top-up at block 26074697 (28 Sep 2026), found via the CardTopup topic on eth.blockscout.com. Excluded: Base (an unverified, non-proxy contract with the same address and the same CardTopup event; no event in the last 5,000 blocks read), Arbitrum (no code at that address, no CardTopup event in 240,000 blocks) and Solana, which the SDK also supports.

repos:
  - url: https://github.com/holyheld/hh-v1-sdk
    role: sdk
    license: source-available

contracts:
  - address: "0x6fC79dDD0379Fd11d67dD73056465e822b843d13"
    chain_id: 1
    role: Card top-up proxy (TransparentUpgradeableProxy)
    verified: sourcify
  - address: "0x1Fd0FB3F9931a820cE63d6f4caefeA30EE18A94a"
    chain_id: 1
    role: Card top-up implementation (unverified)
    verified: none
  - address: "0xaf3d7e4cbB718Ec026d88B330dd68abBbDC6E5C3"
    chain_id: 1
    role: OpenZeppelin ProxyAdmin of the top-up proxy
    verified: sourcify

components:
  - name: Holyheld card top-up contract (proxy + unverified implementation)
    role: contracts
    public: false
    license: proprietary
    operator: Holyheld Labs AG
    required: true
  - name: Holyheld SDK (@holyheld/sdk)
    role: sdk
    public: true
    license: source-available
    operator: Holyheld Labs AG
    required: false
    repo: https://github.com/holyheld/hh-v1-sdk
  - name: "@holyheld/web-app-shared (private library bundled into the SDK)"
    role: sdk
    public: false
    license: proprietary
    operator: Holyheld Labs AG
    required: false
  - name: Holyheld app and web app
    role: frontend
    public: false
    license: proprietary
    operator: Holyheld Labs AG
    required: true
  - name: Holyheld API (apicore, apiassets, apiview) and top-up signer
    role: backend
    public: false
    license: proprietary
    operator: Holyheld Labs AG
    required: true
  - name: Card settlement wallet (EOA receiving top-ups)
    role: wallet
    public: false
    license: proprietary
    operator: Holyheld Labs AG
    required: true
  - name: Card issuer and e-money partner (not named in the Terms)
    role: card-issuer
    public: false
    license: proprietary
    operator: undisclosed licensed issuer
    required: true
  - name: Card network (not named in the Terms)
    role: card-network
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: KYC vendors Sumsub and Idenfy
    role: kyc
    public: false
    license: proprietary
    operator: Sumsub, Idenfy
    required: true
  - name: Wallet and transaction screening vendors (unnamed)
    role: other
    public: false
    license: proprietary
    operator: undisclosed
    required: true
  - name: Settlement token (USDC by Circle in the sample top-up)
    role: contracts
    public: true
    license: proprietary
    operator: Circle
    required: true

