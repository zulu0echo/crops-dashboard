  Not scored. The Terms (last updated 01.07.2026) say Holyheld is operated by Holyheld Labs AG, Zug (CHE-207.939.735), a member of a Swiss Self-Regulatory Organisation supervised for AML/CFT under the Swiss Anti-Money Laundering Act, and that e-money services are provided by regulated partners; the card is issued by a licensed payment-instrument issuer that the Terms do not name (https://holyheld.com/legal/terms-and-conditions). Personal data is processed under the Swiss FADP (https://holyheld.com/legal/privacy-policy). I found no primary source naming the issuer, its regulator or safeguarding arrangements.

notes: >-
  Eligibility: the public SDK repo holyheld/hh-v1-sdk (BUSL-1.1) and the Sourcify-verified top-up proxy on Ethereum make this a card provider, not an incumbent, although the logic contract is unverified. The top-up proxy address is not in the SDK source (it comes from the API at init); it was found by searching the CardTopup event topic 0x9ceec115... on eth.blockscout.com. Onchain reads pinned to Ethereum block 26139997 (backendSignatureCheck at 26140011). Holyheld now markets itself as an invitation-only membership for accounts and payments; the Terms still define the card. The README's documentation link (holyheld.com/documentation) returns 404.

