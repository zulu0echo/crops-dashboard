context: >-
  Authorisation: the Central Bank of Kenya (CBK) Directory of Authorized Payment Service Providers as at August 10, 2026 (centralbank.go.ke, PDF read 2026-10-07) lists Safaricom PLC, first licensed January 1, 2016, approved "to issue, process, store, send and facilitate mobile money payments". Safeguarding: the National Payment System Regulations, 2014 (CBK copy: https://www.centralbank.go.ke/wp-content/uploads/2018/12/NPSRegulationsNew2014-1.pdf) require a provider to hold all monies received in a Trust Fund never less than what is owed to customers, not move them to its operating account or commingle them, and place them in licensed commercial banks or Government of Kenya securities (reg 25(3)); to file separate audited statements for the Trust accounts and an independent system security audit (reg 29); and on revocation let CBK take over the business to distribute Trust Fund balances, with any shortfall recoverable from each trustee (reg 10). The same Regulations require a register of customers with ID or passport numbers verified against the Integrated Population Registration System (reg 12) and transaction screening for AML and counter-terrorism laws (reg 31). These are legal requirements; no document confirming Safaricom's own trust arrangement or screening was read, because safaricom.co.ke returned 403.
notes: >-
  Incumbent. M-Pesa is a closed, custodial mobile-money ledger run by Safaricom; the repos listed are sample clients and callback listeners for the Daraja REST API, not code that runs the rail. Attribution of github.com/safaricom is a judgment call: the org is not GitHub-verified and developer.safaricom.co.ke does not link to it, but the org profile links to developer.safaricom.co.ke and commits in mpesa-php-sdk and mpesa-java-sdk come from safaricom.net addresses, and the mpesa-php-sdk composer.json author uses a safaricom.co.ke address. Forks in that org (android-daraja-sdk, mpesa-py, mpesa-api-go, Mpesa.Net), unrelated repos (kubernetes, kubespray, cisco-anyconnect) and the empty mpesa-perl-sample are excluded. www.safaricom.co.ke, including the data privacy statement and M-Pesa terms, returned HTTP 403 (bot protection) to every non-browser request on 2026-10-07, so neither document could be read or cited; the website field therefore points at the Daraja developer portal, which does resolve. Daraja pages are a client-rendered app: page URLs return 200 and their content loads from the portal's /api/graphql populateApi query, which is how the docs were read. The static Postman collection is the one fully fetchable interface artifact.
