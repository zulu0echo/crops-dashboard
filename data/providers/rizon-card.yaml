context: >-
  Not scored. The app is operated by Rizon Global, Inc. (Delaware), with Rizon Technologies, UAB (Lithuania) as commercial agent; the Terms present Rizon as a non-custodial software interface that provides no regulated financial services (https://www.getrizon.com/terms-of-service). The card is issued by Third National under licence from Visa, with Rain (Signify Holdings, Inc. and Nimbus LLC) running the card and collateral services; the card terms say neither Rizon nor the issuer holds custody of the collateral, but a fall in collateral value can trigger liquidation (https://intercom.help/rizon/en/articles/11822548-rizon-global-inc-spend-card-terms). Personal data is processed under GDPR and Lithuanian law, with AML records kept up to eight years (https://www.getrizon.com/privacy-policy). I found no primary source naming Third National's regulator.

notes: >-
  Incumbent: no verified contract or public repository needed to run the product was found. Searched: GitHub (repo search "rizon" returns only unrelated projects such as the RIZON Cosmos chain and the Rizon IRC network; orgs rizonapp, rizon-app, rizonmoney, rizonfi and others do not exist); getrizon.com pages, Terms, privacy policy and card terms; the Intercom help centre (legal, deposit, card and wallet collections); dashboard.getrizon.com (business login shell, no contract or chain config). The Terms say each user gets a Rain-managed collateral smart contract, but no Rizon or Rain document gives an address, factory or team id for this program. The card terms' Supported Blockchains (Polygon, Optimism, Arbitrum) are Rain boilerplate and conflict with the help centre's list, and Rain's shared collateral contracts serve many programs, so no onchain contract can be attributed to Rizon (same reasoning as the Avalanche Card file). Card Map and review sites were not used as evidence.

availability:
  model: allowlist
  countries: [ AG, AR, AU, BS, BB, BD, BZ, BR, KY, CO, CR, DM, DO, EC, EG, SV, GH, GD, GT, GY, HN, JP, MY, MX, MA, NZ, PK, PA, PY, PE, PH, KN, LC, VC, SN, SG, SR, TH, TC, UG, AE, US, UY, ZM ]
  note: >-
    Rizon's help centre lists 44 supported nationalities and says eligibility depends on citizenship (passport), not only residence, so a resident of a listed country with another nationality may fail KYC. The codes here are those nationalities. US citizens get the Rizon US Spend Card; the Rizon Global, Inc. card terms require attesting that you are not a US citizen. The Terms of Service also list jurisdictions where accounts may not be opened under Rain's compliance rules (Afghanistan, Albania, Belarus, Bosnia, Central African Republic, Congo, Croatia, Cuba, Cyprus, Eritrea, Haiti, Iran, Iraq, Kosovo, Lebanon, Liberia, Libya, North Macedonia, Moldova, Montenegro, North Korea, Russia, Serbia, Somalia, Syria, Ukraine, Venezuela, Vietnam, Yemen, Zimbabwe, plus Crimea, Donetsk and Luhansk) and exclude EU-, OFAC- and UN-sanctioned jurisdictions; none of those are on the nationality list. The Terms also say Rizon does not actively market its services in the EU or regions outside the US and Latin America.
  evidence:
    - tier: claimed
      by: provider
      kind: document
      url: https://intercom.help/rizon/en/articles/13517852-is-rizon-available-for-me
      detail: Rizon's help article gives the full list of supported nationalities and says eligibility follows citizenship.
      quote: "Below is the full list of nationalities that Rizon currently support"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://www.getrizon.com/terms-of-service
      detail: The Terms of Service name the jurisdictions where accounts may not be opened or operated, subject to update by Rain.
      quote: "Afghanistan, Albania, Belarus, Bosnia, Central African Republic, Congo, Croatia, Cuba, Cyprus"
      archive: data/archive/rizon-card-terms-jurisdictions.txt
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://intercom.help/rizon/en/articles/11822548-rizon-global-inc-spend-card-terms
      detail: The Rizon Global, Inc. card terms require users to attest they are not US citizens.
      quote: "You attest that you are not a United States citizen"
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
  checked_at: "2026-10-09"

settlement:
  tokens:
    - symbol: USDC
      class: stablecoin
      backing: fiat
      issuer: Circle
    - symbol: USDT
      class: stablecoin
      backing: fiat
      issuer: Tether
  conversion: at_spend
  note: >-
    Rizon accepts only USDC and USDT deposits (on Arbitrum, Solana, Base, Polygon, Optimism, Avalanche and BSC) into the user's self-custodial wallet. The card is a Rain card: Rizon's Terms say spending converts stablecoins into fiat through Rain and its licensed partners, and the help centre says the dollar balance with the lowest conversion fee is used at the moment of payment, so no single default token is stated. The chain and contract of the Rain collateral holding the spendable balance are not published, and the card terms' Supported Blockchains (Polygon, Optimism, Arbitrum) differ from the deposit list (see C5), so no chain or address is recorded.
  evidence:
    - tier: documented
      kind: document
      url: https://intercom.help/rizon/en/articles/13534577-how-to-top-up-with-stablecoins
      detail: Rizon's help centre says the wallet accepts only USDC and USDT, and lists the supported networks.
      quote: "Rizon currently supports USDC and USDT only"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://intercom.help/rizon/en/articles/13441290-can-i-use-the-rizon-card-with-different-currencies
      detail: The help centre says the card uses the user's dollar balance at the moment of payment.
      quote: "We automatically use your dollar balance with the lowest available conversion fee to a local currency at the moment of payment"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://www.getrizon.com/terms-of-service
      archive: data/archive/rizon-card-ops-terms-of-service.txt
      detail: The Terms describe the Rain card as converting stablecoins into fiat for spending.
      quote: "enabling Users to spend stablecoins by converting them into Fiat through Rain's and their licensed partners infrastructure"
      checked_at: "2026-10-12"
      confirmed_at: 2026-10-19
  checked_at: "2026-10-12"

audits:
  searched: >-
    getrizon.com (Terms, privacy policy) and the Rizon help centre (no audit linked), GitHub (no Rizon org), the Sherlock report repo and Rain's security page (Rain says its reports are shared under NDA and names Sherlock; its public GitHub, SignifyHQ, holds SDKs only), Privy's security docs and the privy-io/shamir-secret-sharing README, and web searches for Rizon, Rain and Privy audits. Privy's docs also name Doyensec; no Doyensec report is published. No audit of the Rizon app or backend was found.
  checked_at: "2026-10-13"
  reports:
    - auditor: Sherlock
      date: "2025-02-11"
      type: contest
      scope: "Shared component: Rain EVM collateral contracts v2 (Beacon, Collateral, Coordinator, Factory), private best-efforts contest"
      url: https://github.com/sherlock-protocol/sherlock-reports/blob/main/audits/2025.02.11%20-%20Final%20-%20Rain%20Private%20Best%20Efforts%20Audit%20Contest%20Report.pdf
      commit: 6f578d5b9c9fa35bbe857959a50fa5aab4fa611a
      repo: https://github.com/SignifyHQ/collateral-contract-evm-v2
      covers_deployed: unknown
      findings: "0 high, 2 medium (statement payoff rounding; missing Chainlink min/max answer check)"
      note: >-
        Contest ran 2-8 December 2024 on b432939a; 6f578d5 is the fix commit. Rizon's Terms say each user gets a Rain-managed collateral contract, but no address is published and the Rain repo is private, so the deployed version could not be compared with the audited one.
    - auditor: Zellic
      date: "2023-08-15"
      type: audit
      scope: "Shared component: Privy shamir-secret-sharing TypeScript library (index.ts, csprng.ts), used in Privy's embedded-wallet key sharding"
      url: https://github.com/Zellic/publications/blob/master/Privy_Shamir_Secret_Sharing_-_Zellic_Audit_Report.pdf
      commit: cd8422d
      repo: https://github.com/privy-io/shamir-secret-sharing
      covers_deployed: unknown
      findings: "1 low (missing input bounds in arithmetic functions); fixed in c9f0ab86"
      note: >-
        Covers only the open-source secret-sharing library, not Privy's closed key-management service, TEE or SDKs. Which library version Privy runs for Rizon wallets is not known.
    - auditor: Cure53
      date: "2023-04-24"
      type: audit
      scope: "Shared component: Privy shamir-secret-sharing TypeScript library (src/index.ts), cryptography review and source code audit"
      url: https://cure53.de/audit-report_privy-sss-library.pdf
      commit: 3383ad927211615f3d70b5ceb5489f8a149be191
      repo: https://github.com/privy-io/shamir-secret-sharing
      covers_deployed: unknown
      findings: "1 high (polynomial degree might be less than t-1), 2 informational; all three marked fixed and verified by Cure53"
      note: >-
        Two-day review in February 2023 (CW06); report dated 24 April 2023. Covers only the open-source library, not Privy's closed key-management service. Superseded in part by the Zellic review.
