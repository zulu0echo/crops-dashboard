slug: fuse-card
name: Fuse Card
type: card
website: https://fusewallet.com
primary_chain:
  name: Solana
  caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
  basis: >-
    Fuse Card is the Bridge-run Visa card in Squads' Fuse wallet (fusewallet.com), not a product of the Fuse Network (chain 122). The Fuse Terms and Fuse Pay post say a separate Squads smart-account "Card Account" holds the USDC and Bridge spends it through a daily Spending Limit. Onchain, 1,727 Squads v4 USDC spending limits share member AE2RGS1h... with period Day and a 2,000 USDC cap, matching the documented "up to $2,000" limit. Excluded: Fuse Network (122), which no Fuse Card document mentions.

repos:
  - url: https://github.com/Squads-Protocol/v4
    role: contracts
    license: AGPL-3.0
  - url: https://github.com/Squads-Protocol/public-v4-client
    role: frontend
    license: MIT

contracts:
  - address: "SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf"
    caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    role: Squads v4 multisig program (immutable)
    verified: none
  - address: "2ozzxmEwAoKAw5ekUzeMej3E7ToCV1KjTbvhNHdkdZDK"
    caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    role: Sample Fuse Card Account (v4 multisig, 1-of-1, 300 s lock)
    verified: none
  - address: "12BqReNBFWSfQ3hSwjDuyUGyVmZMDj1VLh5ctG6LAK4B"
    caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    role: Sample Bridge spending limit (2,000 USDC per day)
    verified: none
  - address: "6AFbKVmLKT7a8Nwx3D8bUrcpWny3sFpR8DbjHYAZzGXk"
    caip2: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
    role: Sample Fuse Main Account (v4 multisig, 2-of-3 keys)
    verified: none

components:
  - name: Squads v4 multisig program (Main and Card Accounts, spending limits)
    role: contracts
    public: true
    license: AGPL-3.0
    operator: Squads (program immutable)
    required: true
    repo: https://github.com/Squads-Protocol/v4
  - name: Fuse iOS app (key management, card UI)
    role: wallet
    public: false
    license: proprietary
    operator: Squads Labs
    required: true
  - name: Fuse backend and fee payer
    role: relayer
    public: false
    license: proprietary
    operator: Squads Labs
    required: true
  - name: Bridge card programme (program manager, spending-limit key AE2RGS1h...)
    role: signer
    public: false
    license: proprietary
    operator: Bridge Ventures LLC
    required: true
  - name: Lead Bank (card issuer)
    role: card-issuer
    public: false
    license: proprietary
    operator: Lead Bank
    required: true
  - name: Visa card network
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: KYC via Bridge
    role: kyc
    public: false
    license: proprietary
    operator: Bridge Ventures LLC
    required: true
  - name: Turnkey email recovery key (optional)
    role: signer
    public: false
    license: proprietary
    operator: Turnkey
    required: false
  - name: Squads public v4 client (self-hostable, not used by Fuse app)
    role: frontend
    public: true
    license: MIT
    operator: Squads / self-hosted
    required: false
    repo: https://github.com/Squads-Protocol/public-v4-client

