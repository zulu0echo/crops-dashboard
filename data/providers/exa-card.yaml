components:
  - name: User's modular smart account (Alchemy UpgradeableModularAccount v1)
    role: wallet
    public: true
    license: GPL-3.0
    operator: User (passkey owner via WebauthnOwnerPlugin)
    required: true
    repo: https://github.com/alchemyplatform/modular-account
  - name: WebauthnOwnerPlugin
    role: contracts
    public: true
    license: GPL-3.0
    operator: Exa Labs (code); user (owner)
    required: true
    repo: https://github.com/exactly/webauthn-owner-plugin
  - name: ExaPlugin, IssuerChecker and ProposalManager
    role: contracts
    public: true
    license: GPL-3.0
    operator: Exa Labs (admin Safe 0x6561...434C)
    required: true
    repo: https://github.com/exactly/exa
  - name: Exactly Protocol exaUSDC market (card collateral and credit)
    role: contracts
    public: true
    license: source-available
    operator: Exactly (timelock, protocol Safe, Pauser)
    required: true
    repo: https://github.com/exactly/protocol
  - name: USDC (Circle) on OP Mainnet
    role: contracts
    public: true
    license: Apache-2.0
    operator: Circle
    required: true
  - name: Exa server (card authorisation webhooks, KYC orchestration, collection signing)
    role: backend
    public: true
    license: none
    operator: Exa Labs
    required: true
    repo: https://github.com/exactly/exa
  - name: Keeper EOA and issuer signing key
    role: signer
    public: false
    license: proprietary
    operator: Exa Labs
    required: true
  - name: Card collector (Rain collateral BeaconProxy; implementation RainCollateral)
    role: contracts
    public: true
    license: none
    operator: Rain (beacon owner Safe 0x6454...Bf15, 2-of-5)
    required: true
  - name: Rain (card program and issuing API, "panda" in code)
    role: api
    public: false
    license: proprietary
    operator: Rain
    required: true
  - name: Third National (card issuer)
    role: card-issuer
    public: false
    license: proprietary
    operator: Third National
    required: true
  - name: Visa (card network)
    role: card-network
    public: false
    license: proprietary
    operator: Visa
    required: true
  - name: Persona (KYC)
    role: kyc
    public: false
    license: proprietary
    operator: Persona
    required: true
  - name: Sardine (transaction risk scoring in card authorisation)
    role: other
    public: false
    license: proprietary
    operator: Sardine
    required: true
  - name: Exa App (mobile and web frontend)
    role: frontend
    public: true
    license: none
    operator: Exa Labs
    required: false
    repo: https://github.com/exactly/exa
  - name: Alchemy (RPC, bundler, gas manager for the app)
    role: bundler
    public: false
    license: proprietary
    operator: Alchemy
    required: false
  - name: Exa substreams indexer
    role: indexer
    public: true
    license: none
    operator: Exa Labs
    required: false
    repo: https://github.com/exactly/exa

