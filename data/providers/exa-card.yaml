slug: exa-card
name: Exa Card
type: card
website: https://www.exactly.app
primary_chain:
  name: OP Mainnet
  chain_id: 10
  basis: >-
    Production app builds default to Optimism (exactly/exa 4fba32b, common/wagmi.config.ts#L18: CHAIN_ID falls back to optimism.id for EAS builds), and the Exa help center says the protocol behind the card "works on Optimism". Unit: the ExaPlugin, IssuerChecker and ProposalManager deployed by contracts/broadcast/*/10/run-latest.json at commit aceb1b5 (Sourcify exact match), the exaUSDC market they settle from, and a live collectDebit at block 157882808. Excluded: the Base deployment and its Firewall-gated markets, Exa Business, and ramp partners.

