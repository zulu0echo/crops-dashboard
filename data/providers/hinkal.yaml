slug: hinkal
name: Hinkal
type: transfer
website: https://hinkal.io
primary_chain:
  name: Ethereum
  chain_id: 1
  basis: >-
    Hinkal's Supported Chains page lists Ethereum (1) first among ten mainnets, and the Hinkal contract 0x7cb6…Cfa4 is the only deployment with a Sourcify exact match (chain 1, created at block 25543753). The SDK's deploy-data-ethMainnet names the same Hinkal, helper and timelock addresses. Unit: Hinkal.sol, its HinkalHelper and verifiers, governed by HinkalTimelockController 0xF043…b7D0. Excluded: the same address on Arbitrum, Polygon, Base, BNB, Tempo, Arc and Robinhood, plus Solana, TRON and the Emporium/wallet adapters.

repos:
  - url: https://github.com/Hinkal-Protocol/Hinkal-Contracts-Circuits
    role: contracts
    license: BUSL-1.1
  - url: https://github.com/Hinkal-Protocol/Hinkal-API-Enclave
    role: backend
    license: none
  - url: https://github.com/Hinkal-Protocol/hinkal-go
    role: sdk
    license: none
  - url: https://github.com/Hinkal-Protocol/hinkal-ios-sdk
    role: sdk
    license: none
  - url: https://github.com/Hinkal-Protocol/wdk-wallet-evm-hinkal
    role: sdk
    license: Apache-2.0
  - url: https://github.com/Hinkal-Protocol/Hinkal-Demo-App
    role: frontend
    license: none

contracts:
  - address: "0x7cb60446d7635C68EDf1c568cac74A1f98c1Cfa4"
    chain_id: 1
    role: Hinkal (shielded pool, entry point, not a proxy)
    verified: sourcify
  - address: "0x5f912cBBB7F14E4524faAe8559666e7C79227C1b"
    chain_id: 1
    role: HinkalHelper (checks, relayer allowlist)
    verified: explorer
  - address: "0x8c16D510bD236479bc4a61819599338bebe26c36"
    chain_id: 1
    role: VerifierEVM1x2x1v4 (one of the registered verifiers)
    verified: explorer
  - address: "0xd7d9eBEDb36C80265B83FC69A83134C90352a091"
    chain_id: 1
    role: VerifierEVM1x2x2v4 (one of the registered verifiers)
    verified: explorer
  - address: "0xF04310839973454155d9886a4023451F8D3Db7D0"
    chain_id: 1
    role: HinkalTimelockController (owner and helper manager)
    verified: explorer
  - address: "0x4d28b33517aB72e7e2f728FF6527F8256CceD7fB"
    chain_id: 1
    role: Safe 2-of-3 (timelock proposer, executor, admin)
    verified: none

components:
  - name: Hinkal pool contract, HinkalHelper and Groth16 verifiers
    role: contracts
    public: true
    license: BUSL-1.1
    operator: HinkalTimelockController (6 h delay), proposer Safe 2-of-3
    required: true
    repo: https://github.com/Hinkal-Protocol/Hinkal-Contracts-Circuits
  - name: Circom circuits (MainEVMCircuit)
    role: other
    public: true
    license: BUSL-1.1
    operator: Hinkal
    required: true
    repo: https://github.com/Hinkal-Protocol/Hinkal-Contracts-Circuits
  - name: Proving keys and circuit wasm (served from wallet-prodv12.hinkal.io)
    role: other
    public: false
    license: proprietary
    operator: Hinkal (Novelty Today, Inc.)
    required: true
  - name: TypeScript SDK @hinkal/common (npm build output, no source repository)
    role: sdk
    public: true
    license: MIT
    operator: user
    required: true
  - name: Ethereum mainnet and a JSON-RPC endpoint
    role: ledger
    public: true
    license: LGPL-3.0
    operator: Ethereum validators; RPC from the user's wallet provider
    required: true
    repo: https://github.com/ethereum/go-ethereum
  - name: Hinkal backend (snapshot, Merkle siblings, data server, token lists)
    role: api
    public: false
    license: proprietary
    operator: Hinkal
    required: false
  - name: Allowlisted relayers (2 addresses in the helper's RelayStore)
    role: relayer
    public: false
    license: proprietary
    operator: Hinkal (relayer list set by the timelock)
    required: false
  - name: Enclave API (remote proving, signature storage)
    role: backend
    public: true
    license: none
    operator: Hinkal on Google Cloud
    required: false
    repo: https://github.com/Hinkal-Protocol/Hinkal-API-Enclave
  - name: Chainalysis address screening at deposit
    role: oracle
    public: false
    license: proprietary
    operator: Chainalysis via Hinkal backend
    required: false
  - name: Integrity Check over $10,000 (CEX zkTLS attestation or zkKYC partner)
    role: kyc
    public: false
    license: proprietary
    operator: Reclaim Protocol, zkMe, Galxe, AiPrise, Authento, Binance BABt
    required: false
  - name: Hinkal Pay and Hinkal Wallet apps (pay.hinkal.io, browser extension)
    role: frontend
    public: false
    license: proprietary
    operator: Hinkal
    required: false
  - name: HinkalTimelockController and its proposer Safe
    role: other
    public: true
    license: BUSL-1.1
    operator: Safe 0x4d28…D7fB, 2-of-3, signers undisclosed
    required: false

