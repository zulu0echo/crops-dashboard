notes: >-
  Incumbent. Wise is a closed, custodial e-money and payments ledger. Customer balances are held by Wise and moved through Wise's own systems and partner banks. github.com/transferwise is the GitHub-verified org for wise.com (223 public repos). Listed repos are the ones that touch the transfer API: webhook and SCA signing examples, a signing library, a Postman collection, a reference Android bank integration and the Wise Platform samples. None of them runs the transfer rail. The remaining repos are internal tooling and data-science libraries (pipelinewise, wise-pizza and similar) and are excluded. Documents cited are the UK personal terms of use and the UK personal privacy notice (Wise Payments Limited), plus docs.wise.com, which serves Markdown copies of its client-rendered pages (the .md URLs are cited). Terms clause 26.1 asserts Wise's exclusive property over "sample source code, and code libraries", which conflicts with the MIT and Apache licences in those repos; the repo licences are recorded as found. Search log: docs/research/wise.md.
context: >-
  Wise Payments Limited states in its UK personal terms of use (clause 3.3) that it is an electronic money institution authorised by the Financial Conduct Authority under the Electronic Money Regulations 2011 and the Payment Services Regulations 2017, FCA reference number 900507. Clause 12.4 says Wise safeguards customer money under the PSRs, kept separate from the money Wise uses to run its business and held in Wise's name with established financial institutions, as cash, in secure assets such as government bonds, or through insurance guarantees, and that Wise may change safeguarding institutions or methods without notice. Clause 12.2 says Wise is not a bank and balances are not covered by any deposit protection scheme, including the FSCS. Source: https://wise.com/gb/legal/terms-of-use-personal (read 2026-10-07). Other Wise entities and jurisdictions have their own terms and were not read.
