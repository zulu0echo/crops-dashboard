    - tier: documented
      kind: document
      url: https://wise.com/help/articles/2978049/where-can-i-use-wise
      quote: You can hold money if you live in a country where you can open a Wise account
      detail: Wise Help Centre "Where can I use Wise?", which also lists the countries and regions Wise does not serve at all.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
  checked_at: "2026-10-09"

