    token_word: 0
    amount_word: 2
    window_days: 30
    exclusions: Payee amount only (word 2); feeAmount (word 3) is excluded. Erc20ConversionProxy delegatecalls ERC20FeeProxy, so conversion payments emit the same event from 0x8296…e6Ad and are counted once. Native payments through EthereumFeeProxy (different event) are not counted. Gross observed, including tests and self-payments.
  note: Spec checked against the live log in tx 0x2580…3d4e (word 0 USDC, word 2 = 3000000). Not computed; the maintainer runs scripts/volumes.mjs.
