slug: request-network
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: 0.9% per transaction, capped at $500 (hosted API path)
      basis: Request Network pricing page; the docs say the rate can change, is not published there, and is returned per payment in metadata.protocolFee; the payer bears it by default.
      evidence_index: 0
    - kind: provider
      paid_by: none
      amount: none in the contract (open protocol path)
      basis: ERC20FeeProxy takes no protocol fee; feeAmount and feeAddress are call parameters chosen by whoever builds the payment (for example an integrator's platform fee).
      evidence_index: 2
    - kind: network
      paid_by: payer
      amount: gas included on EVM chains (hosted API path)
      basis: Pricing page; on Tron the payer pays a flat $3.99 per transaction.
      evidence_index: 1
    - kind: network
      paid_by: payer
      amount: Base sample 2026-10-07, about 0.0000025 ETH (217,904 gas at 0.0116 gwei plus L1 fee)
      basis: Gas of one live payment on the open path (tx 0x2580…3d4e, block 52282170); that call also ran an Across fill, so a direct proxy call costs less. Varies with Base gas price.
      evidence_index: 3
    - kind: network
      paid_by: payee
      amount: 0.0999 xDAI per stored request (Gnosis storage fee, up to 1000 bytes)
      basis: RequestOpenHashSubmitter.getFeesAmount(1000) on Gnosis Chain; paid by whoever stores the request (usually the payee or its Request Node); the fee parameters are set by the Request admin Safe.
      evidence_index: 4
  evidence:
    - tier: documented
      kind: document
      url: https://request.network/pricing/
      detail: Pricing page states a flat 0.9% fee per transaction capped at $500, no monthly, setup or minimum fees.
      checked_at: 2026-10-09
      quote: Flat fee on transaction volume, capped at $500 per transaction
    - tier: documented
      kind: document
      url: https://request.network/pricing/
      detail: Pricing page says gas is included on EVM chains and Tron payers pay a flat $3.99.
      checked_at: 2026-10-09
      quote: On EVM chains gas is included
    - tier: verified
      kind: repo
      url: https://github.com/RequestNetwork/requestNetwork/blob/749b13070bcb88be4a10b8d59fcf3705339d43e0/packages/smart-contracts/src/contracts/ERC20FeeProxy.sol#L34-L58
      commit: 749b13070bcb88be4a10b8d59fcf3705339d43e0
      path: packages/smart-contracts/src/contracts/ERC20FeeProxy.sol
      detail: transferFromWithReferenceAndFee moves _amount to the payee and _feeAmount to _feeAddress, both supplied by the caller; the contract has no fee of its own.
      checked_at: 2026-10-09
    - tier: verified
      kind: onchain
      url: https://basescan.org/tx/0x2580e807b575a321c20e3134eea8e18a0edba56ae97ca25b315215e0a7113d4e
      chain_id: 8453
      block_number: 52282170
      detail: "Receipt read 2026-10-09: gasUsed 217904, effectiveGasPrice 11605490 wei, l1Fee 5950085349 wei; the ERC20FeeProxy TransferWithReferenceAndFee log pays 3.0 USDC with feeAmount 0. Block time 2026-10-07 06:14 UTC."
      checked_at: 2026-10-09
      recheck: cast receipt 0x2580e807b575a321c20e3134eea8e18a0edba56ae97ca25b315215e0a7113d4e --rpc-url https://mainnet.base.org
    - tier: verified
      kind: onchain
      url: https://gnosisscan.io/address/0x268C146Afb4790902Ee26A6D2d3aff968623Ec80
      address: "0x268C146Afb4790902Ee26A6D2d3aff968623Ec80"
      chain_id: 100
      block_number: 48666105
      detail: getFeesAmount(1000) and minimumFee() on RequestOpenHashSubmitter both return 99900000000000000 wei (0.0999 xDAI) at Gnosis block 48666105.
      checked_at: 2026-10-09
      recheck: cast call 0x268C146Afb4790902Ee26A6D2d3aff968623Ec80 "getFeesAmount(uint256)(uint256)" 1000 --rpc-url https://rpc.gnosischain.com
    - tier: verified
      kind: repo
      url: https://github.com/RequestNetwork/mintlify-docs/blob/1845bc537542f65a5e8c9826ebccc3ba053c4fd1/api-features/protocol-fees.mdx#L6-L25
      commit: 1845bc537542f65a5e8c9826ebccc3ba053c4fd1
      path: api-features/protocol-fees.mdx
      detail: Docs say a protocol fee applies to all API payments, the rate can change and is not published in the docs, and the payer bears it by default.
      checked_at: 2026-10-09
  note: Two fee regimes. The open protocol path (the CROPS unit) charges no protocol fee in contract; the hosted API path charges 0.9% and includes gas. FX applies only to conversion payments, through Chainlink rates in ChainlinkConversionPath, and no FX margin is stated. No limits are published beyond the $500 fee cap and API rate limits.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
    - criterion: S1
      index: 2
  note: Agrees with S1 (score 1). Funds move payer to payee in one call and are never held. The disclosed risk is that the 3-of-7 admin Safe can repoint Erc20ConversionProxy's delegatecall target and so redirect future conversion payments or open allowances; it does not hold funds.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
