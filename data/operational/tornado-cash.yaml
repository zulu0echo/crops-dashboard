    evidence:
      - tier: verified
        kind: onchain
        url: https://sourcify.dev/server/v2/contract/1/0x12D66f87A04A9E220743712cE6d9bB1B5616B8Fc?fields=deployment
        address: "0x12D66f87A04A9E220743712cE6d9bB1B5616B8Fc"
        chain_id: 1
        block_number: 9116966
        detail: Sourcify creation data gives tx 0xeed4367a9b4c066b9fbf0a44869f36b93d2f06e5a63a9464ddfd0597a8a45935, block 9116966, deployer 0x8589…DA16; the receipt's contractAddress is this pool and the block time is 2019-12-16 19:08 UTC.
        checked_at: 2026-10-09
        recheck: cast receipt 0xeed4367a9b4c066b9fbf0a44869f36b93d2f06e5a63a9464ddfd0597a8a45935 contractAddress --rpc-url https://eth.drpc.org && cast block 9116966 --field timestamp --rpc-url https://eth.drpc.org
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  entity:
    status: absent
    evidence:
      - tier: verified
        kind: api
        url: https://api.github.com/orgs/tornadocash
        detail: The organisation profile names no company or legal entity.
        checked_at: 2026-10-09
        recheck: gh api orgs/tornadocash --jq '{name,company,blog,email}'
    note: "Searched: the GitHub org profile, tornado-core and classic-UI READMEs and the classic UI source (no terms or legal entity), and https://tornado.cash (no response to curl). No contracting entity is disclosed. OFAC's 2022 designation treated \"Tornado Cash\" as an entity without naming a legal form, and the US and Dutch prosecutions named individuals; neither is a company record."
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  incidents:
    status: evidenced
    value:
      - date: 2023-05-20
        summary: TORN governance proposal 20 was executed although its target contract was created after the vote closed and carries an owner-only selfdestruct, so the code executed was not the code voters saw. It reached governance, the registries and the router path, not the pools. Wider effects were not reconstructed here.
        funds_lost: unknown
        url: https://sourcify.dev/server/v2/contract/1/0xC503893b3e3c0C6b909222b45f2a3a259a52752D
    refs:
      - criterion: S2
        index: 3
    note: "Primary sources only. A 2024 report of a backdoor in the IPFS-served frontend was not evidenced from a primary source and is not listed. No pool contract incident was found: the pools are immutable and their operator is zero (CROPS C1, S2)."
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  changes:
    status: evidenced
    value:
      - date: 2022-08-08
        summary: US Treasury (OFAC) designated Tornado Cash and its smart contract addresses.
        url: https://home.treasury.gov/news/press-releases/jy0916
      - date: 2022-08-22
        summary: Last push to the github.com/tornadocash repositories; all 47 are now archived.
        url: https://github.com/tornadocash
      - date: 2025-03-21
        summary: US Treasury announced removal of the Tornado Cash sanctions.
        url: https://home.treasury.gov/news/press-releases/sb0057
    evidence:
      - tier: documented
        kind: document
        url: https://home.treasury.gov/news/press-releases/jy0916
        detail: Treasury press release announcing the designation.
        checked_at: 2026-10-09
        quote: Treasury Sanctions Notorious Virtual Currency Mixer Tornado Cash
        confirmed_at: 2026-10-12
      - tier: documented
        kind: document
        url: https://home.treasury.gov/news/press-releases/sb0057
        detail: Treasury press release dated March 21, 2025 announcing the delisting.
        checked_at: 2026-10-09
        quote: we have exercised our discretion to remove the economic sanctions against Tornado Cash
        confirmed_at: 2026-10-12
    refs:
      - criterion: O2
        index: 0
    note: The pool contracts themselves have not changed since deployment. Governance changes to the optional registries and router are not itemised (72 proposals at the seed read).
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
