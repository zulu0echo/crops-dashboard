slug: tornado-cash
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: none
      amount: none in the pool contracts
      basis: withdraw sends the denomination minus the proof-bound fee to the recipient and the fee to the relayer; the pools take nothing and have no admin to add a fee.
      evidence_index: 0
    - kind: provider
      paid_by: payee
      amount: optional relayer fee, set by the chosen relayer
      basis: Deducted from the withdrawn denomination when a relayer submits the withdrawal; fee and relayer are bound into the proof. Zero when the withdrawer submits it.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: deposit sample 2026-10-09, 0.00287 ETH (919,444 gas at 3.12 gwei)
      basis: Router deposit into the ETH 1 pool, tx 0xb25e…d1cc, block 26153431; varies with Ethereum gas price.
      evidence_index: 1
    - kind: network
      paid_by: payee
      amount: withdrawal sample 2026-10-09, 0.00109 ETH (349,079 gas at 3.12 gwei)
      basis: Self-submitted withdrawal from the ETH 1 pool via the router with fee 0, tx 0x7678…48e3, block 26153424.
      evidence_index: 2
    - kind: limit
      paid_by: none
      amount: fixed denominations per pool (ETH 0.1/1/10/100, DAI 100 to 100k, USDC and USDT 100/1k)
      basis: Each pool's denomination is set at construction and cannot change; one deposit equals one denomination (pools enumerated per token in the InstanceRegistry, see refs).
  evidence:
    - tier: verified
      kind: repo
      url: https://github.com/tornadocash/tornado-core/blob/7033f34434208cde40503a8daf71c1c0f8dab578/contracts/ETHTornado.sol#L29-L40
      commit: 7033f34434208cde40503a8daf71c1c0f8dab578
      path: contracts/ETHTornado.sol
      detail: _processWithdraw sends denomination - fee to the recipient and fee to the relayer if fee > 0; there is no protocol fee.
      checked_at: 2026-10-09
    - tier: verified
      kind: onchain
      url: https://etherscan.io/tx/0xb25ecc750f4854305239ccef3fa4af9b8ecb81d59e833e1ae2a85c5d12d7d1cc
      chain_id: 1
      block_number: 26153431
      detail: "Deposit receipt read 2026-10-09: gasUsed 919444, effectiveGasPrice 3.119 gwei, cost 0.002868 ETH; Deposit log from the ETH 1 pool 0x47CE…2936."
      checked_at: 2026-10-09
      recheck: cast receipt 0xb25ecc750f4854305239ccef3fa4af9b8ecb81d59e833e1ae2a85c5d12d7d1cc --rpc-url https://ethereum-rpc.publicnode.com
    - tier: verified
      kind: onchain
      url: https://etherscan.io/tx/0x7678bb5e5132c430f767d15d076096119b9f23d651630964dd1bab96616248e3
      chain_id: 1
      block_number: 26153424
      detail: "Withdrawal receipt read 2026-10-09: gasUsed 349079, effectiveGasPrice 3.125 gwei, cost 0.001091 ETH; Withdrawal log from the ETH 1 pool with relayer 0x0 and fee 0."
      checked_at: 2026-10-09
      recheck: cast receipt 0x7678bb5e5132c430f767d15d076096119b9f23d651630964dd1bab96616248e3 --rpc-url https://ethereum-rpc.publicnode.com
  refs:
    - criterion: C5
      index: 0
  note: On the optional router path, relayers registered in the RelayerRegistry have TORN burned from their stake per withdrawal (FeeManager sets the rate); that cost falls on relayers and reaches users only through their fee. No FX.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
  note: Agrees with S1 (score 3). Funds sit in immutable pools between deposit and withdrawal and leave only to whoever holds the note; no operator, governance or relayer can move them. Holding the note is holding the funds, so a payer who keeps a copy can withdraw first.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
licences:
  status: not_applicable
  reason: No legal entity operates the pools and no party takes custody or provides a service on the required path; there is nobody to hold a licence. Relayers and frontends are optional and independent.
  burden: institution
  evidence:
    - tier: verified
      kind: api
      url: https://api.github.com/orgs/tornadocash
      detail: The GitHub organisation profile names no company (company null; name "Tornado Cash"; blog tornado.cash).
      checked_at: 2026-10-09
      recheck: gh api orgs/tornadocash --jq '{name,company,blog}'
  note: An institution using the pools carries its own licensing and sanctions analysis; see the provider file's `context` for the 2022 OFAC designation and its 2025 removal.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
cashout:
  status: not_applicable
  reason: The note holder withdraws the token to an address it chooses; converting it to local currency is outside the protocol.
  burden: institution
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
