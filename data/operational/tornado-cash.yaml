    window_days: 30
    exclusions: Count only. The Withdrawal event carries no amount or token (each pool has a fixed denomination), so no amount_word is set and the script returns one withdrawal count across all 12 pools. Value needs per-pool counts multiplied by each pool's denomination. Deposits are not counted. cDAI and WBTC pools and other chains are excluded.
  note: Settlement is observable but the event shape does not fit a single amount spec. 347 events (deposits and withdrawals) appeared on the four ETH pools in the 5000 blocks to 26153707, so the pools are in use. Not computed; the maintainer runs scripts/volumes.mjs.
