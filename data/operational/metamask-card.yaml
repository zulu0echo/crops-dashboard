fees:
  status: evidenced
  value:
    - kind: card
      paid_by: payer
      amount: Annual subscription 0 USD (Free tier) or 199 USD (Metal tier); Metal card replacement 99 USD
      basis: MetaMask support limits-and-fees page.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: 0.5% when the stablecoin is in neither the cardholder's nor the merchant's currency; otherwise no fee
      basis: Same page, token fees; exception for Argentina where the card is USD-denominated.
      evidence_index: 0
    - kind: provider
      paid_by: payer
      amount: 0.875% when spending other cryptocurrencies (e.g. wETH); DeFi tokens free to 1,200 USD per month, then 0.5%
      basis: Same page, token fees.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: Cross-border 1% (Free tier), none for Metal (fair usage)
      basis: Same page; applies when the merchant is outside the cardholder's country.
      evidence_index: 0
    - kind: cashout
      paid_by: payer
      amount: ATM 2% (Free tier); Metal free up to 1,200 USD per month, then 2%; ATM operator fees extra
      basis: Same page; ATM withdrawals are available to US cardholders only (FAQ).
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Network gas, typically about 0.01 USD on Linea
      basis: Same page.
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://support.metamask.io/trade/metamask-card/limits-and-fees/
      archive: data/archive/metamask-card-ops-limits-and-fees.txt
      detail: MetaMask Card limits and fees table (Free and Metal tiers) with footnotes.
      checked_at: 2026-10-09
      quote: Stablecoin denominated in currency not of cardholder country or merchant country
      confirmed_at: 2026-10-12
  note: "The support site serves region-dependent guidance; the static HTML read here is the default (US) view. Metal cards are no longer offered to new UK users (UK migration guide). Judgment call: MetaMask's own support pricing page is treated as documented for fees, while the CROPS seed cited the support site as claimed."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
