      - "0xFb2dc580Eed955B528407b4d36FfaFe3da685401"
    topic0: "0x29877766fa2bfe3b90008d6d92f965eca91cbc5757ed775740e460799fb92219"
    event: Announcement(address indexed receiver, uint256 amount, address indexed token, bytes32 pkx, bytes32 ciphertext)
    window_days: 30
    exclusions: Event count only. The token is an indexed topic (topic 2), which scripts/volumes.mjs cannot read, so amounts (data word 0) of ETH and different tokens would be summed together; amount_word is deliberately omitted. L2 deployments excluded.
  note: Judgment call. Every send emits one Announcement with the amount in clear, so settlement is observable, but a per-token sum needs the script to read the token from topic 2. Until then the spec yields a payment count, not a value. Not computed; the maintainer runs scripts/volumes.mjs.
  reason: "not computed on 2026-10-12: no RPC configured for chain 1 (set RPC_1)"
