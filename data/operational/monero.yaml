    value: Vulnerability Response Process. Acknowledgement within 3 working days; HIGH and MEDIUM fixed in a point release, LOW in the next regular release; HIGH announced publicly within 3 working days of the patch release; the response team has 90 days to complete the process, after which the researcher may disclose. No fixed patch deadline per severity of the 30/40/90-day kind.
    evidence:
      - tier: verified
        kind: repo
        commit: 97fb74b0bfffafa553b8ca6b4978218b4ca13362
        checked_at: 2026-10-09
        url: https://github.com/monero-project/meta/blob/97fb74b0bfffafa553b8ca6b4978218b4ca13362/VULNERABILITY_RESPONSE_PROCESS.md#L55-L131
        path: VULNERABILITY_RESPONSE_PROCESS.md
        detail: Section III steps 3 and 7 (response time, release type by severity), section IV step 1 (90 days) and step 3d (researcher disclosure after 90 days).
        confirmed_at: 2026-10-12
    note: The process covers code in the project's repositories, not the websites. It is run by volunteers.
    checked_at: 2026-10-09
