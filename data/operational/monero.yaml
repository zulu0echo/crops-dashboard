        path: _posts/2019-12-03-core-team-general-fund.md
        detail: The Core Team describes itself as an informal group that escrows the Community Crowdfunding System and stewards the General Fund; no legal entity is named.
        confirmed_at: 2026-10-12
    note: Judgment call. Recorded as absent (no maintaining legal entity exists) rather than unknown. The Core Team, the Monero Research Lab and the vulnerability response team are informal groups; the security contacts in meta/VULNERABILITY_RESPONSE_PROCESS.md are individuals. Search of the website and docs repositories for company, corporation, legal entity and foundation found no entity.
    checked_at: 2026-10-09
  incidents:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value:
      - date: 2017-05-17
        summary: Disclosure of the CryptoNote key-image bug that allowed undetectable inflation. Found 2017-02-19, patched secretly in v0.10.2 and enforced by the April 2017 fork; the project scanned the chain and states Monero was never exploited.
        funds_lost: "no"
        url: https://www.getmonero.org/2017/05/17/disclosure-of-a-major-bug-in-cryptonote-based-currencies.html
      - date: 2018-09-05
        summary: Post-mortem of the multiple-counting bug in wallet transfer reporting (fixed in v0.12.3.0); exchanges using get_transfers could be credited several times over. An exchange was exploited through a Monero fork; losses on Monero itself are not stated.
        funds_lost: unknown
        url: https://www.getmonero.org/2018/09/05/a-post-mortum-of-the-multiple-counting-bug-2018-09-05.html
      - date: 2018-09-25
        summary: Post-mortem of the burning bug. The wallet did not warn on outputs sent to a reused one-time address, so an attacker could leave a service with unspendable outputs; patched privately for exchanges, protocol and supply unaffected.
        funds_lost: unknown
        url: https://www.getmonero.org/2018/09/25/a-post-mortum-of-the-burning-bug.html
      - date: 2021-09-20
        summary: Post-mortem of two decoy-selection bugs in the reference wallet (v0.14.1.0 to v0.17.2.2) that weakened sender privacy; fixed in v0.17.2.3.
        funds_lost: "no"
        url: https://www.getmonero.org/2021/09/20/post-mortem-of-decoy-selection-bugs.html
      - date: 2023-06-08
        summary: Post-mortem of the 10-block-old decoy selection bug (HIGH severity, wallets v0.13.0.2 to v0.18.2.1) revealing the real input of transactions spending outputs exactly 10 blocks old.
        funds_lost: "no"
        url: https://www.getmonero.org/2023/06/08/10block-old-decoy-selection-bug.html
      - date: 2023-11-04
        summary: The Core Team reports the Community Crowdfunding System hot wallet was drained of 2,675.73 XMR on 2023-09-01, source not ascertained; the General Fund covered the loss. Project donation funds, not user funds or the protocol.
        funds_lost: "yes"
        url: https://www.getmonero.org/2023/11/04/ccs-wallet-incident.html
      - date: 2025-08-26
        summary: Post-mortem of the find_and_save_rings() bug (wallets v0.12.0.0 to v0.18.4.1) that sent outgoing transaction ids to the daemon on first wallet load, reducing sender anonymity against an untrusted remote node; fixed in v0.18.4.2.
        funds_lost: "no"
        url: https://www.getmonero.org/2025/08/26/post-mortem-of-find-and-save-rings-bug.html
    evidence:
      - tier: verified
        kind: repo
        commit: 5a596d19334d647cdad65cdb9f1287729c9d140d
        checked_at: 2026-10-09
        url: https://github.com/monero-project/monero-site/blob/5a596d19334d647cdad65cdb9f1287729c9d140d/_posts/2017-05-17-disclosure-of-a-major-bug-in-cryptonote-based-currencies.md#L9-L31
        path: _posts/2017-05-17-disclosure-of-a-major-bug-in-cryptonote-based-currencies.md
        detail: Overview and timeline of the key-image bug, including the statement that the Monero blockchain had never been exploited.
        confirmed_at: 2026-10-12
      - tier: verified
        kind: repo
        commit: 5a596d19334d647cdad65cdb9f1287729c9d140d
        checked_at: 2026-10-09
        url: https://github.com/monero-project/monero-site/blob/5a596d19334d647cdad65cdb9f1287729c9d140d/_posts/2023-11-04-ccs-wallet-incident.md#L1-L13
        path: _posts/2023-11-04-ccs-wallet-incident.md
        detail: Core Team notice of the CCS wallet drain of 2,675.73 XMR on 2023-09-01 and the General Fund covering it.
        confirmed_at: 2026-10-12
      - tier: verified
        kind: repo
        commit: 5a596d19334d647cdad65cdb9f1287729c9d140d
        checked_at: 2026-10-09
        url: https://github.com/monero-project/monero-site/blob/5a596d19334d647cdad65cdb9f1287729c9d140d/_posts/2025-08-26-post-mortem-of-find-and-save-rings-bug.md#L1-L20
        path: _posts/2025-08-26-post-mortem-of-find-and-save-rings-bug.md
        detail: Quick facts of the find_and_save_rings() privacy bug (severity, affected versions, fix). The other post-mortems listed are in the same _posts directory at this commit.
        confirmed_at: 2026-10-12
    note: Primary sources are the project's own post-mortems in monero-project/monero-site. The 2021-12 multisig vulnerability notice (experimental feature) and the 2016 MWR Labs statement are not listed. Privacy-loss incidents in the reference wallet are included because the rail's property is privacy; none moved funds.
    checked_at: 2026-10-09
  changes:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value:
      - date: 2017-01-10
        summary: Fork v4 (height 1,220,516) allows RingCT transactions (hidden amounts).
        url: https://github.com/monero-project/monero/blob/22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0/README.md#L130-L130
      - date: 2018-10-18
        summary: Forks v8/v9 (heights 1,685,555 and 1,686,275) enable then require Bulletproofs and fix ring size at 11.
        url: https://github.com/monero-project/monero/blob/22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0/README.md#L134-L135
      - date: 2019-11-30
        summary: Fork v12 (height 1,978,433) switches proof of work to RandomX and requires at least two outputs.
        url: https://github.com/monero-project/monero/blob/22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0/README.md#L138-L138
      - date: 2020-10-17
        summary: Forks v13/v14 (heights 2,210,000 and 2,210,720) introduce the CLSAG signature format and forbid MLSAG.
        url: https://www.getmonero.org/2020/08/18/network-upgrade-october-2020.html
      - date: 2022-08-13
        summary: Forks v15/v16 (heights 2,688,888 and 2,689,608) raise ring size to 16, add Bulletproofs+ and view tags, and change the dynamic fee and block-weight algorithm. No fork since; the next is listed as undetermined.
        url: https://www.getmonero.org/2022/04/20/network-upgrade-july-2022.html
    evidence:
      - tier: verified
        kind: repo
        commit: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0
        checked_at: 2026-10-09
        url: https://github.com/monero-project/monero/blob/22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0/README.md#L120-L145
        path: README.md
        detail: Scheduled software upgrades table with height, date, fork version and details for every mainnet fork; the next fork row is XXX (not determined).
      - tier: verified
        kind: repo
        commit: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0
        checked_at: 2026-10-09
        url: https://github.com/monero-project/monero/blob/22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0/src/hardforks/hardforks.cpp#L34-L76
        path: src/hardforks/hardforks.cpp
        detail: Mainnet fork heights compiled into monerod. Dates above are the activation-block timestamps read from xmrchain.net/api/block/<height>, which match the README dates.
        confirmed_at: 2026-10-12
    note: Forks v2, v3, v5 to v7, v10 and v11 are omitted for brevity; they are in the same README table.
    checked_at: 2026-10-09
