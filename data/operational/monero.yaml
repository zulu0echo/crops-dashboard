slug: monero
fees:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value:
    - kind: network
      paid_by: payer
      amount: Dynamic per-byte fee; sample 0.000491 XMR for a 1,535-byte transaction (block 3,780,260, 2026-10-09)
      basis: Consensus minimum since fork v15 is 0.95 x block_reward x 3000 / median_weight^2 per byte of weight; nodes reject fees more than 2% below it. Wallets pay a multiple by priority. Paid to the miner; changes need a hard fork.
      evidence_index: 0
  evidence:
    - tier: verified
      kind: repo
      commit: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0
      checked_at: 2026-10-09
      url: https://github.com/monero-project/monero/blob/22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0/src/cryptonote_core/blockchain.cpp#L3621-L3718
      path: src/cryptonote_core/blockchain.cpp
      detail: get_dynamic_base_fee (L3621-L3663) computes the per-byte minimum from the block reward, DYNAMIC_FEE_REFERENCE_TRANSACTION_WEIGHT (3000, cryptonote_config.h L75) and the long-term effective median from HF_VERSION_2021_SCALING (v15); check_fee (L3667-L3718) multiplies by transaction weight and rejects fees below 98% of it.
      recheck: gh api "repos/monero-project/monero/contents/src/cryptonote_core/blockchain.cpp?ref=22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0" --jq .content | base64 -d | sed -n 3621,3718p
    - tier: verified
      kind: onchain
      url: https://xmrchain.net/api/block/3780260
      block_number: 3780260
      detail: Block 3,780,260 (2026-10-09 12:10:24 UTC) holds two-output transactions of 1,532-1,539 bytes paying 490,240,000-492,480,000 piconero (about 0.00049 XMR, 320,000 piconero per byte). Read through a public explorer API; any monerod returns the same block.
      checked_at: 2026-10-09
      recheck: curl -s https://xmrchain.net/api/block/3780260 | jq '.data.txs[1:6][] | {tx_fee, tx_size}'
  note: There is no protocol, developer or provider fee; the only charge is the miner fee. The sample is one block on one day; the per-byte minimum moves with the block reward (tail emission 0.6 XMR) and the median block weight.
  checked_at: 2026-10-09
custody_model:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
  note: Agrees with the S1 finding (anchor 3 in substance, capped at 2 only for want of contract evidence). Value moves from the payer's outputs to one-time outputs only the payee's keys can spend; nobody holds funds in flight.
  checked_at: 2026-10-09
licences:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: not_applicable
  reason: No operating entity runs the rail. Monero is a proof-of-work chain run by independent miners and node operators; the project has no company, and its Core Team and volunteers maintain software and escrow donations but do not transmit or hold users' funds.
  burden: institution
  checked_at: 2026-10-09
cashout:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: not_applicable
  reason: Native-asset rail. The payee receives XMR at its own address; converting XMR to local currency is outside the protocol and depends on exchanges whose availability varies by jurisdiction.
  burden: institution
  checked_at: 2026-10-09
