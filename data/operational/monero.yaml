        block_number: 1
        detail: Block 1 (hash 771fbcd6...8148) has timestamp 1397818193, 2014-04-18 10:49:53 UTC. Block 0 (hash 418015bb...32e3, the CAIP-2 reference) has timestamp 0. Read through a public explorer API; any monerod returns the same headers.
