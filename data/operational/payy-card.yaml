custody_model:
  status: evidenced
  value: provider_custodial
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
    - criterion: S4
      index: 0
  note: "Judgment call. Payy says it is non-custodial and the note keys sit on the user's device, but the S1 finding (score 0) shows funds at rest in an upgradeable rollup escrow whose owner Safe can overwrite the state root, and S4 (score 0) shows every withdrawal needs Payy's prover. Unlike Exa and MetaMask Card, the provider controls the funds at rest, not only a spend path, so provider_custodial; a reviewer may prefer hybrid."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
