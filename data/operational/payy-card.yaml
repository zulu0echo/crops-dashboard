volume:
  status: not_observable
  reason: Card debits are private UTXO note transfers inside the Payy rollup; the L1 contract sees only state roots and proofs, so card spends cannot be separated from other transfers or valued from chain data. Payy's funding of Rain happens off this contract.
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
