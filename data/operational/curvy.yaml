volume:
  status: not_observable
  reason: "Amounts are public but not expressible in the spec format. The aggregator's PendingNotes event carries tokens and amounts in dynamic arrays, so they have no fixed word index. The vault's Deposit and Withdraw events keep the token in an indexed topic, which a spec cannot read, so amounts of ETH, USDC and other tokens would be summed together. A spec needs topic-based token selection or array decoding."
  note: Not a statement that settlement is hidden; with a token filter on topic1, Vault Deposit/Withdraw (word 0 = amount) would give gross shield and unshield flows per token.
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
