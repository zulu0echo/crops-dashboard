slug: aztec
fees:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value:
    - kind: network
      paid_by: payer
      amount: Mana used x fee per mana, in Fee Juice; minimum about 2.27e-6 AZTEC per mana on 2026-10-09
      basis: Rollup FeeLib minimum = sequencer cost (L1 gas and blobs) + prover cost (provingCostPerMana, set by governance) + congestion cost (burned), converted at an oracle ETH/fee-asset rate. Paid from a non-transferable Fee Juice balance or by a fee-paying contract.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Optional priority fee per mana, set by the user in gas settings
      basis: EIP-1559-style max and priority fee per mana chosen by the sender. Unburnt fees per epoch go 70% to the block proposer and 30% to provers.
      evidence_index: 1
  evidence:
    - tier: verified
      kind: repo
      commit: 49a592109ec4f18d79212b43d621891aaf36f7b6
      checked_at: 2026-10-09
      url: https://github.com/AztecProtocol/aztec-packages/blob/49a592109ec4f18d79212b43d621891aaf36f7b6/l1-contracts/src/core/libraries/rollup/FeeLib.sol#L269-L330
      path: l1-contracts/src/core/libraries/rollup/FeeLib.sol
      detail: getManaMinFeeComponentsAt sums sequencer, prover and congestion cost per mana. Read on Ethereum at block 26,154,934 (2026-10-09) with cast on Rollup 0x91fF8bbD8Ebb07893010D50A48A1609e5EBd8E34 (chain 1, not recordable as onchain evidence for an aztec:mainnet row) gives getManaMinFeeAt = 2,269,387,395,825; components congestionCost 0, multiplier 1e9 (minimum), sequencerCost 122,988,048,037, proverCost 2,146,399,347,788; manaTarget 75,000,000.
      recheck: cast call 0x91fF8bbD8Ebb07893010D50A48A1609e5EBd8E34 "getManaMinFeeComponentsAt(uint256,bool)((uint256,uint256,uint256,uint256))" $(cast block latest --field timestamp --rpc-url https://ethereum-rpc.publicnode.com) true --rpc-url https://ethereum-rpc.publicnode.com
    - tier: verified
      kind: repo
      commit: 49a592109ec4f18d79212b43d621891aaf36f7b6
      checked_at: 2026-10-09
      url: https://github.com/AztecProtocol/aztec-packages/blob/49a592109ec4f18d79212b43d621891aaf36f7b6/docs/docs-developers/docs/foundational-topics/fees.md#L46-L60
      path: docs/docs-developers/docs/foundational-topics/fees.md
      detail: fee = daMana x feePerDaMana + l2Mana x feePerL2Mana; Fee Juice is bridged AZTEC and non-transferable; base and priority fees per mana as in EIP-1559. L141-L143 says collected fees, minus burnt congestion, go to provers and block proposers once an epoch is proven.
    - tier: verified
      kind: repo
      commit: 49a592109ec4f18d79212b43d621891aaf36f7b6
      checked_at: 2026-10-09
      url: https://github.com/AztecProtocol/aztec-packages/blob/49a592109ec4f18d79212b43d621891aaf36f7b6/docs/docs-participate/token/economics.md#L39-L51
      path: docs/docs-participate/token/economics.md
      detail: Congestion cost is burned; of the remainder 70% goes to the sequencer and 30% to provers.
  note: No protocol or Aztec Labs fee. The payer needs Fee Juice bridged from AZTEC on Ethereum through the one-way FeeJuicePortal (an L1 transaction with its own ETH gas), or a third-party fee-paying contract, which may charge in other tokens and whose terms were not reviewed. The Fee Juice per transaction depends on its mana use, which was not sampled.
  checked_at: 2026-10-09
custody_model:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
  note: Agrees with the S1 finding (anchor 3 in substance, held at 2). A private transfer nullifies the sender's notes and creates notes for the recipient; keys stay in the user's PXE. The L1 backing of a bridged token sits in that token's portal under its owner's control, and the docs call some circuits under-constrained.
  checked_at: 2026-10-09
