  review:
    status: pending
  status: not_observable
  reason: Private transfers move value between encrypted notes inside the rollup; only nullifiers, note hashes and fee payers reach Ethereum, never amounts or tokens. Public L1 events (portal deposits and withdrawals, checkpoint proposals) are bridging and rollup bookkeeping, not payment settlement. The volume script reads EVM logs over the provider's listed contracts only, and this row lists none because its primary chain is aztec:mainnet.
