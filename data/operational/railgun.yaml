  status: unknown
  spec:
    chain_id: 1
    addresses:
      - "0xFA7093CDD9EE6932B4eb2c9e1cde7CE00B1FA4b9"
    topic0: "0xd93cf895c7d5b2cd7dc7a098b678b3089f37d91f48d9b83a0800a91cbdf05284"
    event: Unshield(address to, (uint8 tokenType, address tokenAddress, uint256 tokenSubID) token, uint256 amount, uint256 fee)
    amount_word: 4
    token_word: 2
    window_days: 30
    exclusions: Counts unshields only (value leaving the shielded pool to public addresses, net of the 0.25% fee). Private 0zk-to-0zk transfers, shields and RelayAdapt swaps are not included; ERC721 unshields count as amount 1. BSC, Polygon and Arbitrum deployments are excluded.
  note: Judgment call. Shielded 0zk transfers hide amount, token and parties, so the payments themselves are not observable; the spec measures pool exits (Unshield) on the listed proxy, a lower bound on payee settlement to public addresses. Data words verified on a live log at block 26148878 (word 2 = USDT, word 4 = amount). Not computed; the maintainer runs scripts/volumes.mjs.
  reason: "not computed on 2026-10-11: no RPC configured for chain 1 (set RPC_1)"
