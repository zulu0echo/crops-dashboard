  B12.1:
    status: evidenced
    value: Partly. Avici's AI assistant Avi and the CLI/MCP are read-only and cannot move money, so they are not in the payment path. Card compliance runs through Sumsub ongoing AML monitoring (Avici docs) and, at the issuer group, Rain's automated fraud, sanctions and transaction-monitoring systems; whether either uses machine learning is not stated.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.avici.money/getting-started/avici-cli-and-mcp.md
        detail: Avici docs, CLI & MCP.
        checked_at: 2026-10-09
