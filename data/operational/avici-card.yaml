        detail: Rain privacy policy, Automated Processing and Decision-Making.
        checked_at: 2026-10-09
        quote: We may use automated systems to support fraud detection, sanctions screening, transaction monitoring, identity verification, biometric matching, eligibility assessments, and risk management
        confirmed_at: 2026-10-26
    note: Avici's documents name only the issuer, Third National; Rain's privacy policy identifies Third National as Nimbus LLC, a Rain affiliate, and Rain's security page covers "every card program", so Rain's statements are recorded as the issuer group's position (inferred link; Avici does not name Rain).
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B12.2:
    status: evidenced
    value: For Avi, the privacy policy limits model providers to those that do not train on user content and keep data briefly or not at all. For compliance decisions only Rain's override path is documented (human review where law grants it). No monitoring, validation, decommissioning or bias documentation.
    evidence:
      - tier: documented
        kind: document
        url: https://avici.money/privacypolicy
        detail: Avici privacy policy, How we use AI.
        checked_at: 2026-10-09
        quote: We work only with providers whose terms do not allow your content to be used to train their models
        confirmed_at: 2026-10-26
      - tier: documented
        kind: document
        url: https://legal.raincards.xyz/legal/privacy-policy
        detail: "Rain privacy policy, Automated Processing and Decision-Making: available where applicable law grants the right."
        checked_at: 2026-10-09
        quote: request human review, express your point of view, and contest the decision
        confirmed_at: 2026-10-26
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
