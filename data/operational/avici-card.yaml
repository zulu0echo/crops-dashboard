    value: "Avici: administrative, technical and physical safeguards, limited access, connected-service tokens stored encrypted; no data classification or encryption-at-rest statement for other data. Issuer group (Rain): encryption in transit and at rest, PCI DSS for card data. Observed: avici.money refuses TLS 1.1 and accepts TLS 1.2."
