slug: nullmask
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: Protocol fee on deposits and on withdrawals, at most 1% each; current rates shown only in the app
      basis: Terms 7.1 and 7.6; set by the operator and changeable without notice within the 1% cap. The rates in force were not read (the app needs a wallet; the contract is unverified).
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Network and service fee set by the servers; sample 0.00197 ETH on a withdrawal whose gas cost 0.00130 ETH
      basis: Docs fee formula is (latest or default gas) x 1.25 x current gas price, deducted from the shielded balance and paid to the relayer; terms 7.3 say it may exceed actual gas and the difference is not refunded. Sample from tx 0x789715bd…fd02 (2026-06-23).
      evidence_index: 1
    - kind: provider
      paid_by: payer
      amount: ETH added to each deposit; the operator keeps the crediting gas and an amount towards screening, the rest is returned
      basis: Terms 5.1 and 7.4; amount not published.
      evidence_index: 0
    - kind: provider
      paid_by: payer
      amount: Screening fee of up to 1% on a returned deposit, if introduced, plus the network cost of the return
      basis: Terms 5.7; not stated to be in force.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Ethereum gas for deposits and key registration sent from the user's own wallet; Uniswap V2 fee on swaps
      basis: Terms 6.5 and 7.5; set by Ethereum and Uniswap.
      evidence_index: 0
    - kind: limit
      paid_by: none
      amount: Minimum deposit per asset, enforced by the Pool; maximums may be set at any time
      basis: Terms 5.9; values not published.
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://app.nullmask.io/terms
      archive: data/archive/nullmask-ops-terms.txt
      detail: Terms of Use (effective 2026-10-01) sections 5.7, 5.9, 6.5, 7.1, 7.3, 7.4 and 7.6.
      checked_at: 2026-10-09
      quote: We charge a protocol fee on deposits and on withdrawals. Each fee is at most 1% of the amount.
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://docs.nullmask.io/user-guide/fees.md
      detail: Docs fee page, how the relayer fee is estimated.
      checked_at: 2026-10-09
      quote: It applies a 1.25x buffer and multiplies the result by the current gas price
      drift: true
    - tier: verified
      kind: onchain
      url: https://eth.blockscout.com/tx/0x789715bdb90a5a938029ba63267bda6bd3a7cc1fda416b1a8b5a5a1c3f7ffd02
      address: "0x88888888Eb71E1D68aD0C471C6893EdEEa00B026"
      chain_id: 1
      block_number: 25380622
      detail: "ShieldedWithdrawal log (topic matches the docs' event signature) in block 25380622: amount 0.00128 ETH, fee 1973875227928586 wei in ETH; the relayer's transaction used 4,530,380 gas at 0.286 gwei (about 0.00130 ETH)."
      checked_at: 2026-10-09
      recheck: cast receipt 0x789715bdb90a5a938029ba63267bda6bd3a7cc1fda416b1a8b5a5a1c3f7ffd02 --rpc-url https://ethereum-rpc.publicnode.com
  note: The rail's only path runs through the operator's servers, so these fees apply to every payment. Only 30 ShieldedWithdrawal logs existed from the pool's deployment to 2026-10-09, all before the announced 2026-10-01 launch; the sample is from that period.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: provider_custodial
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
    - criterion: C2
      index: 0
  note: Judgment call. The terms say only the user's wallet can authorise spending and that assets are not held in an account with the operator, but the S1 finding (score 0) shows the pool is upgradeable through a controller whose admin is one EOA, and the operator says an upgrade can change who can move assets; C2 and S4 show every transfer and withdrawal needs its servers. The operator controls funds at rest, so provider_custodial rather than hybrid (as for Payy).
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
