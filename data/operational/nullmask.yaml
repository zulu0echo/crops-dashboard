      - tier: documented
        kind: document
        url: https://docs.nullmask.io/security/access-tokens.md
        detail: Access token derivation from the wallet signature and its delivery as cookie or query parameter.
        checked_at: 2026-10-09
        quote: Since wallets use deterministic signatures (RFC 6979), the same wallet always produces the same access token.
        drift: true
      - tier: documented
        kind: document
        url: https://app.nullmask.io/privacy
        archive: data/archive/nullmask-ops-privacy.txt
        detail: Privacy policy section 9 on the wallet network credential.
        checked_at: 2026-10-09
        quote: The credential gives read access to your balance and your own operations, and it does not expire.
