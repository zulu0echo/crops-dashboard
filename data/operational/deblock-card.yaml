    value: "Client may close at any time for free. Deblock may terminate without giving reasons on two months' email notice, or immediately on listed grounds (missing source-of-funds information, false documents, abnormal use, suspected fraud, reputational harm, legal order). Balance is sent to the client's bank account; at least 60 days to withdraw, then a minimum 1 EUR fee per transfer, and funds can be claimed for six years. On closure Deblock hands over its key shard so the client keeps the self-custodial crypto wallet."
