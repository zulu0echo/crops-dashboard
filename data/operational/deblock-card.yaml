fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: Standard plan free; Premium 10 EUR per month
      basis: Pricing plans page; fees may change under the Client Terms s1.4 with 60 days to decline.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: Virtual cards free; physical card delivery fee on Standard (shown in app); up to 3 physical cards free on Premium
      basis: Help articles 8911205 and 8911216; Standard delivery fee amount not published.
      evidence_index: 1
    - kind: fx
      paid_by: payer
      amount: First 500 EUR a month free of markup; then Standard 0.5% weekdays, 1% weekends; Premium 0%
      basis: Help article 8911354. The cards page says 0% FX on card payments abroad, which conflicts for Standard users beyond the allowance.
      evidence_index: 2
    - kind: cashout
      paid_by: payer
      amount: "ATM: 1% (min 1 EUR) beyond the plan allowance, plus any ATM operator surcharge"
      basis: Help article 11093412 (allowance Standard 1 withdrawal or 100 EUR a month, Premium 5 or 1,000 EUR; limits 15,000 EUR a month Standard, 30,000 EUR Premium, 1,000 EUR a day).
      evidence_index: 3
    - kind: cashout
      paid_by: none
      amount: SEPA and SEPA Instant transfers out free
      basis: Help article 8913029; Terms s6.1 allow cross-border or SWIFT fees for other currencies.
      evidence_index: 4
    - kind: cashout
      paid_by: payer
      amount: "Crypto sell (crypto to EUR): 1.99% Standard, 0.49% Premium"
      basis: Pricing plans page; applies to the self-custodial wallet off-ramp into the e-money account.
      evidence_index: 0
    - kind: limit
      paid_by: none
      amount: Each card payment capped at 10,000 EUR
      basis: Help article 8911134; Deblock says the cap may change.
      evidence_index: 5
  evidence:
    - tier: documented
      kind: document
      url: https://deblock.com/en/pricing-plans
      detail: Pricing plans page (Standard and Premium columns).
      checked_at: "2026-10-09"
      quote: Premium 10€ /mo
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://intercom.help/deblock/en/articles/8911216-are-there-any-fees-for-ordering-a-physical-card
      detail: Help article on physical card fees.
      checked_at: "2026-10-09"
      quote: Standard plan subscribers will be charged a delivery fee when ordering a physical card
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://intercom.help/deblock/en/articles/8911354-are-there-any-fees-for-making-card-payments
      detail: Help article on card payment and FX fees.
      checked_at: "2026-10-09"
      quote: "Standard: 0.5% on weekdays, 1% on weekends"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://intercom.help/deblock/en/articles/11093412-what-are-the-limits-and-fees-for-atm-withdrawals
      detail: Help article on ATM limits and fees.
      checked_at: "2026-10-09"
      quote: A 1% Deblock fee applies to the amount withdrawn, with a minimum of €1 per withdrawal
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://intercom.help/deblock/en/articles/8913029-are-there-any-fees-to-send-transfers
      detail: Help article on outgoing transfer fees.
      checked_at: "2026-10-09"
      quote: Sending transfers is completely free
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://intercom.help/deblock/en/articles/8911134-are-there-any-limits-to-how-much-money-i-can-spend-on-my-cards
      detail: Help article on card spending limits.
      checked_at: "2026-10-09"
      quote: each card payment you make is capped at €10,000
      confirmed_at: 2026-10-12
  note: Card top-ups into the account are free up to 2,000 EUR a month, then a fee shown in the app (help article 11087296); a funding fee, not recorded above. Insurance and cashback are plan benefits, not fees.
