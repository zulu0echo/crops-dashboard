  B6.1:
    status: evidenced
    value: "No data classification or encryption-at-rest statement found (the privacy policy was not readable without Deblock's API token). Observed: deblock.com refuses TLS 1.1 and accepts TLS 1.2."
    evidence:
      - tier: documented
        kind: trace
        url: https://deblock.com
        detail: "openssl s_client -tls1_1 to deblock.com:443 failed with alert protocol version; -tls1_2 negotiated ECDHE-RSA-CHACHA20-POLY1305. Run 2026-10-09 with LibreSSL 3.3.6."
        checked_at: "2026-10-09"
        recheck: "echo | openssl s_client -connect deblock.com:443 -servername deblock.com -tls1_1; echo | openssl s_client -connect deblock.com:443 -servername deblock.com -tls1_2"
