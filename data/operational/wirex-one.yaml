  B3.4:
    status: evidenced
    value: Public status page at status.wirexapp.com (Atlassian Statuspage) with incident histories, including WirexOne-labelled incidents. No post-mortem was found among the 50 most recent incidents (2024-04-17 to 2026-10-08) returned by its API.
    evidence:
      - tier: documented
        kind: document
        url: https://status.wirexapp.com/
        detail: Wirex status page, linked from wirexapp.com and the help centre.
        checked_at: 2026-10-09
        quote: Wirex Status
        confirmed_at: 2026-10-26
      - tier: documented
        kind: trace
        url: https://status.wirexapp.com/api/v2/incidents.json
        detail: The 50 incidents returned on 2026-10-09 contain no update or postmortem body mentioning a post-mortem.
        checked_at: 2026-10-09
        recheck: "curl -s https://status.wirexapp.com/api/v2/incidents.json | grep -ci postmortem"
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B5.1:
    status: evidenced
    value: Retail users authenticate through Privy (access and identity tokens exchanged for a Wirex user token); partner backends use OAuth2 client credentials. All tokens are HMAC-SHA256 signed JWTs.
    evidence:
      - tier: verified
        kind: repo
        url: https://github.com/wirexapp/wirex-baas-agent-skills/blob/7dff6eaaba9e06a30056f787ec54324d64a3e671/skills/wirex-baas-auth/SKILL.md#L14-L21
        commit: "7dff6eaaba9e06a30056f787ec54324d64a3e671"
        path: skills/wirex-baas-auth/SKILL.md
        detail: Three authentication methods (S2S OAuth2, user token issuance, Privy) and the JWT format.
        checked_at: 2026-10-09
        confirmed_at: 2026-10-26
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B5.2:
    status: evidenced
    value: Server-to-server calls use OAuth2 client credentials (client_id and client_secret issued by Wirex) with a single scope, partner:full; rotation is not documented. The Wirex One web bundle ships a literal SSO client secret (CROPS S5).
    evidence:
      - tier: verified
        kind: repo
        url: https://github.com/wirexapp/wirex-baas-agent-skills/blob/7dff6eaaba9e06a30056f787ec54324d64a3e671/skills/wirex-baas-auth/SKILL.md#L69-L76
        commit: "7dff6eaaba9e06a30056f787ec54324d64a3e671"
        path: skills/wirex-baas-auth/SKILL.md
        detail: "S2S token details: HS256, 48-hour validity, scope partner:full."
        checked_at: 2026-10-09
        confirmed_at: 2026-10-26
    refs:
      - criterion: S5
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B5.3:
    status: evidenced
    value: Access tokens (S2S and user) are valid for 48 hours, far above the partner's 120-minute cap.
    evidence:
      - tier: verified
        kind: repo
        url: https://github.com/wirexapp/wirex-baas-agent-skills/blob/7dff6eaaba9e06a30056f787ec54324d64a3e671/skills/wirex-baas-auth/SKILL.md#L69-L76
        commit: "7dff6eaaba9e06a30056f787ec54324d64a3e671"
        path: skills/wirex-baas-auth/SKILL.md
        detail: Token Details table, Validity 48 hours from issuance.
        checked_at: 2026-10-09
        confirmed_at: 2026-10-26
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.3:
    status: evidenced
    value: Customer account records are normally kept up to six years after the relationship ends; legacy Wirex App records may be kept separately; public blockchain records cannot be deleted (see CROPS P2 for what is collected).
    evidence:
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/privacy
        detail: Wirex One Privacy, Data Use and Retention Policy, section 13.
        checked_at: 2026-10-09
        quote: normally keep customer account records for up to six years after your relationship with Wirex ends
        confirmed_at: 2026-10-26
    refs:
      - criterion: P2
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.4:
    status: evidenced
    value: The controller is the Wirex group company that provides the service under the Terms; requests from EEA Wirex One users are routed to Wirex Europe sp. z o.o. as controller during the transition, and partners providing regulated services may be independent controllers. DPIA availability not found.
    evidence:
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/privacy
        detail: Wirex One Privacy Policy, controller section and data-subject requests.
        checked_at: 2026-10-09
        quote: is the Wirex company directly responsible for handling your personal data
        confirmed_at: 2026-10-26
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/privacy
        detail: Wirex One Privacy Policy, rights section on EEA routing during launch.
        checked_at: 2026-10-09
        quote: Wirex Europe sp. z o.o. as controller
        confirmed_at: 2026-10-26
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B10.1:
    status: evidenced
    value: Integration architecture is published for Wirex BaaS (REST API with OAuth2, contract registry, Account Abstraction wallets, card, KYC and banking modules); logical contract architecture is partly covered by ABI fragments; infrastructure architecture is not published.
    evidence:
      - tier: verified
        kind: repo
        url: https://github.com/wirexapp/wirex-baas-agent-skills/blob/7dff6eaaba9e06a30056f787ec54324d64a3e671/skills/wirex-baas-overview/SKILL.md#L13-L72
        commit: "7dff6eaaba9e06a30056f787ec54324d64a3e671"
        path: skills/wirex-baas-overview/SKILL.md
        detail: Platform overview and the five-step integration flow (partner credentials, OAuth2, contract registry, user wallet deployment).
        checked_at: 2026-10-09
        confirmed_at: 2026-10-26
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B11.1:
    status: evidenced
    value: Card-based services in the EEA, UK and rest of world are provided by Wirex Limited (England and Wales, 09334596); UAB Wirex (Lithuania, 305118023) runs EEA card programme management; Crossmint Europe, S.L. provides EEA and UK crypto-asset services; Novatti Group Limited provides the card in Australia and New Zealand.
    evidence:
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/terms
        detail: Wirex One Terms of Service clauses 1.8 to 1.11.
        checked_at: 2026-10-09
        quote: Card-based Regulated Services is provided by Wirex Limited
        confirmed_at: 2026-10-26
      - tier: documented
        kind: document
        url: https://find-and-update.company-information.service.gov.uk/company/09334596
        detail: Companies House, WIREX LIMITED, active private limited company, registered office 9th Floor 107 Cheapside, London EC2V 6DN.
        checked_at: 2026-10-09
        quote: Incorporated on 1 December 2014
        confirmed_at: 2026-10-26
    note: UAB Wirex, Crossmint Europe and Novatti were not checked in their company registers; UAB Wirex returns no entry in the Bank of Lithuania's register of financial market participants.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B11.3:
    status: evidenced
    value: The user may close the Wirex Profile at any time (closure can be delayed by investigations); Wirex may terminate with at least two months' notice, or suspend or terminate earlier for breach, suspected fraud or legal reasons. Closure ends regulated services only; the self-custodial wallet stays with the user.
    evidence:
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/terms
        detail: Wirex One Terms clause 10 (Profile Closure, Suspension and Termination).
        checked_at: 2026-10-09
        quote: Wirex may also terminate your Wirex Profile or access to Regulated Services at any time by providing you with at least two (2) months' notice
        confirmed_at: 2026-10-26
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/terms
        detail: Wirex One Terms clause 10.6.
        checked_at: 2026-10-09
        quote: does not affect your Self-Custodial Wallet, which remains under your sole control
        confirmed_at: 2026-10-26
    note: CROPS S1 and S4 found that Wirex's oracle can move wallet balances through the installed executor module, so the Terms' description of sole control does not match the deployed contracts.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B12.1:
    status: evidenced
    value: "Yes: application decisions may be made solely by automated checks, and accounts are profiled for a risk rating used in fraud and transaction monitoring; wallet-address screening and blockchain monitoring apply to Wirex One. Whether AI or machine learning is used is not stated."
    evidence:
      - tier: documented
        kind: document
        url: https://www.wirexapp.com/legal/one/privacy
        detail: Wirex One Privacy Policy section 12 (Fraud prevention).
        checked_at: 2026-10-09
        quote: Application decisions may be taken based solely on automated checks of information
        confirmed_at: 2026-10-26
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
