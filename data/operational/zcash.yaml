slug: zcash
fees:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value:
    - kind: network
      paid_by: payer
      amount: ZIP 317 conventional fee, 5000 zatoshis per logical action, minimum 2 actions (10000 zats = 0.0001 ZEC)
      basis: Wallet and mempool convention (ZIP 317, Active), not a consensus fee; logical actions count transparent inputs/outputs, Sapling spends/outputs, Orchard and (since NU6.3) Ironwood actions. Paid to the miner. Changes need a ZIP and node releases.
      evidence_index: 0
  evidence:
    - tier: verified
      kind: repo
      commit: 3af03aa3ad991874d86b8cf35919bc9b4671e8ba
      checked_at: 2026-10-09
      url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0317.rst#L126-L196
      path: zips/zip-0317.rst
      detail: conventional_fee = marginal_fee x max(grace_actions, logical_actions) with marginal_fee = 5000 zatoshis and grace_actions = 2 (L130-L146); Revision 1 adds nActionsIronwood to logical_actions from NU6.3 (L178-L196).
      confirmed_at: 2026-10-12
  note: There is no protocol or provider fee. Relayers do not exist; light-wallet servers are free public services. Swap and merchant integrations in third-party wallets are out of scope.
  checked_at: 2026-10-09
custody_model:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
  note: Agrees with the S1 finding (anchor 3 in substance, capped at 2 only for want of contract evidence). Value moves from notes the payer controls to notes the payee controls; nobody holds funds in flight.
  checked_at: 2026-10-09
licences:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: not_applicable
  reason: No operating entity runs the rail. Zcash is a proof-of-work chain run by independent miners and node operators; the Zcash Foundation and ZODL maintain software but do not transmit or hold users' funds.
  burden: institution
  checked_at: 2026-10-09
cashout:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: not_applicable
  reason: Native-asset rail. The payee receives ZEC at its own shielded address; converting ZEC to local currency is outside the protocol.
  burden: institution
  checked_at: 2026-10-09
maturity:
  first_deployment:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value:
      date: 2016-10-28
      block: 0
      what: Zcash mainnet genesis (Sprout shielded pool). The assessed Ironwood pool activated with NU6.3 at height 3,428,143 on 2026-07-28 (see changes).
    evidence:
      - tier: verified
        kind: repo
        commit: e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291
        checked_at: 2026-10-09
        url: https://github.com/ZcashFoundation/zebra/blob/e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291/zebra-chain/src/parameters/constants.rs#L75-L99
        path: zebra-chain/src/parameters/constants.rs
        detail: Mainnet activation heights compiled into Zebra v6.4.2, from Overwinter 347,500 to NU6.3 3,428,143; network_upgrade.rs L104-L120 maps Height(0) to Genesis.
      - tier: verified
        kind: onchain
        url: https://api.blockchair.com/zcash/raw/block/0
        block_number: 0
        detail: The raw genesis header's nTime field (bytes 100-103, little-endian) decodes to 2016-10-28T07:56:00Z. The NU6.3 activation block 3428143 decodes to 2026-07-28T14:07:23Z the same way. Read through a public explorer API; any Zcash node returns the same header.
        checked_at: 2026-10-09
        recheck: curl -s https://api.blockchair.com/zcash/raw/block/0 | jq -r '.data[0].raw_block[200:208]'  (reverse the 4 bytes, then date -u -r)
    note: Judgment call. Genesis is recorded as the first deployment of the rail; the Ironwood pool, which carries new shielded transfers today, is under three months old.
    checked_at: 2026-10-09
  entity:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value:
      legal_name: Zcash Foundation
      jurisdiction: US
    evidence:
      - tier: documented
        kind: document
        url: https://zfnd.org/
        detail: The Zcash Foundation maintains Zebra, the only maintained consensus node since zcashd reached end of life, and holds the Zcash trademark.
        quote: The Zcash Foundation is a 501(c)(3) public charity
        checked_at: 2026-10-09
        confirmed_at: 2026-10-12
      - tier: verified
        kind: repo
        commit: e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291
        checked_at: 2026-10-09
        url: https://github.com/ZcashFoundation/zebra/blob/e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291/SECURITY.md#L115-L125
        path: SECURITY.md
        detail: Zebra's security policy names Zcash Open Development Lab (ZODL) as maintainer of zcash/zcash, librustzcash and zallet.
        confirmed_at: 2026-10-12
    note: Judgment call. Maintenance is split between the Zcash Foundation (Zebra node) and ZODL (librustzcash, orchard, Zallet, Zodl wallet; Znewco, Inc. per the Zodl SDK CLA). The Foundation is recorded because the assessed unit is defined by Zebra. The IRS exempt-organisation entry was not looked up (no EIN on the site), so no register_url. Electric Coin Company still runs electriccoin.co but no longer appears as maintainer in the sources read.
    checked_at: 2026-10-09
  incidents:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value:
      - date: 2019-03-27
        summary: CVE-2019-7167 published. A flaw in the original Sprout zk-SNARK parameters allowed counterfeiting before the Sapling upgrade (2018-10-28), which removed it. Whether it was exploited cannot be seen in the shielded pool.
        funds_lost: unknown
        url: https://nvd.nist.gov/vuln/detail/CVE-2019-7167
      - date: 2026-06-02
        summary: Orchard circuit soundness flaw (reported 2026-05-29) allowed counterfeiting and spending others' notes within Orchard. Orchard disabled by emergency soft fork at height 3363426, fixed in NU6.2 (2026-06-03), sealed withdraw-only by NU6.3. Exploitation cannot be ruled out; the ZIP 209 turnstile protects the supply cap.
        funds_lost: unknown
        url: https://github.com/zcash/zcash/security/advisories/GHSA-ghc3-g8w4-whf9
    evidence:
      - tier: verified
        kind: repo
        commit: 3af03aa3ad991874d86b8cf35919bc9b4671e8ba
        checked_at: 2026-10-09
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0257.md#L33-L67
        path: zips/zip-0257.md
        detail: ZIP 257 records the 2026-05-29 report, the emergency disabling of Orchard from height 3363426 and the failed attempt at 3363366.
        confirmed_at: 2026-10-12
      - tier: verified
        kind: api
        url: https://api.github.com/repos/zcash/zcash/security-advisories
        detail: zcash/zcash publishes GHSA-ghc3-g8w4-whf9 (critical, 2026-07-19) plus node DoS and consensus-robustness advisories; ZcashFoundation/zebra publishes GHSA-ww9q-8r59-xv46 for the same flaw and further peer-handling advisories in 2026.
        checked_at: 2026-10-09
    note: Only fund-safety incidents are listed. 2026 node advisories in zcashd and Zebra (denial of service, block poisoning, peer bans) are not repeated here. ECC's 2019 post-mortem on electriccoin.co returned HTTP 403 and was not read; the CVE record is cited instead.
    checked_at: 2026-10-09
  changes:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value:
      - date: 2018-10-29
        summary: Sapling network upgrade (height 419200), new shielded pool and proving system.
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0205.rst
      - date: 2022-05-31
        summary: NU5 (height 1687104) introduces the Orchard pool and Halo 2 proofs without trusted setup.
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0252.rst
      - date: 2024-11-23
        summary: NU6 (height 2726400) replaces the dev fund with the deferred lockbox (12%) and Zcash Community Grants (8%) streams.
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0253.md
      - date: 2025-11-24
        summary: NU6.1 (height 3146400) extends the funding streams and disburses the lockbox (ZIP 271).
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0255.md
      - date: 2026-06-02
        summary: Emergency soft fork disables Orchard actions (height 3363426).
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0257.md
      - date: 2026-06-03
        summary: NU6.2 (height 3364600) re-enables Orchard with the corrected circuit and limits proof length.
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0257.md
      - date: 2026-07-18
        summary: zcashd reaches its end-of-support halt at height 3417100; Zebra and Zallet become the only maintained node and full-node wallet.
        url: https://github.com/zcash/zcash/security/advisories/GHSA-ghc3-g8w4-whf9
      - date: 2026-07-28
        summary: NU6.3 (height 3428143) activates the Ironwood pool and seals Orchard as withdraw-only behind a turnstile.
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0258.md
    evidence:
      - tier: verified
        kind: repo
        commit: e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291
        checked_at: 2026-10-09
        url: https://github.com/ZcashFoundation/zebra/blob/e3eef2f37c35127ad1769f19a1ebc7eaa5d5d291/zebra-chain/src/parameters/constants.rs#L75-L99
        path: zebra-chain/src/parameters/constants.rs
        detail: Mainnet activation heights for every upgrade listed; dates are the timestamps of the activation blocks (read from block headers via api.blockchair.com/zcash/raw/block/<height>).
      - tier: verified
        kind: repo
        commit: 3af03aa3ad991874d86b8cf35919bc9b4671e8ba
        checked_at: 2026-10-09
        url: https://github.com/zcash/zips/blob/3af03aa3ad991874d86b8cf35919bc9b4671e8ba/zips/zip-0258.md#L60-L72
        path: zips/zip-0258.md
        detail: ZIP 258 fixes the NU6.3 Mainnet activation height at 3428143 (status Draft at this commit although the upgrade has activated).
        confirmed_at: 2026-10-12
    note: Overwinter, Blossom, Heartwood and Canopy are omitted for brevity; their heights are in the same Zebra constants.
    checked_at: 2026-10-09
