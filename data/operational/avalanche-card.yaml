slug: avalanche-card
facts:
  B1.1:
    status: unknown
    note: No ISO 27001 statement found. Rain's security page lists SOC 2 Type II and PCI DSS only; avalanchecard.com has no security page. Rain Liquidity LLC, which offers the card and runs the app, is itself a Rain entity (Avalanche Card privacy policy), so Rain's security page is the operator's own position.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B1.2:
    status: unknown
    note: No ISO 27001 statement for the hosting or support organisation. Rain's status page attributes two outages (2025-06-12, 2025-10-20) to Google Cloud, which suggests but does not establish the host.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B1.3:
    status: attested
    value: Rain (Signify Holdings, Inc. and affiliates, including Rain Liquidity LLC) states it holds SOC 2 Type II and PCI DSS; the SOC 2 report is available to partners and prospective partners on request through its trust center. A cardholder cannot obtain it; not read.
    evidence:
      - tier: documented
        kind: document
        url: https://www.rain.xyz/security
        detail: Rain security page (Signify Holdings, Inc.), section "Security reports and policies"; the trust center at trust.rain.xyz is a client-rendered Vanta page and was not read.
        checked_at: 2026-10-09
        quote: Partners and prospective partners can request our SOC 2 report, PCI DSS attestation, penetration test summary, and security policies through our trust center
        confirmed_at: 2026-10-19
      - tier: documented
        kind: document
        url: https://legal.avalanchecard.com/legal/avalanche-app-privacy-policy-945fafe7
        detail: Rain privacy policy (last updated 16 July 2026), Security section.
        checked_at: 2026-10-09
        quote: Rain maintains SOC 2 Type II certification
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B1.4:
    status: attested
    value: Rain states its smart contracts are reviewed by independent auditors before launch and for each new chain; no report is linked, and the Avalanche Card collateral contract is not identified (CROPS S6 unknown). No statement covers the app or backend.
    evidence:
      - tier: documented
        kind: document
        url: https://www.rain.xyz/security
        detail: Rain security page, "Smart contract audits"; no report is linked from the page.
        checked_at: 2026-10-09
        quote: Our smart contracts are reviewed by independent auditors before launch and again for each new chain we support
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
