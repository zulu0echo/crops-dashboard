fees:
  status: evidenced
  value:
    - kind: card
      paid_by: none
      amount: "Monthly account fee, virtual card, physical card and shipping: $0"
      basis: Site FAQ; card agreements allow fees to change.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: 1% FX fee (site FAQ)
      basis: Site FAQ. The same FAQ also says no conversion fees are charged; contradiction recorded in note.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: "International card: FX fee up to 3% plus cross-border fee up to 3% (non-USD)"
      basis: International card agreement Important Disclosures, effective 12 February 2025.
      evidence_index: 1
    - kind: fx
      paid_by: payer
      amount: "US card: international transaction fee 2% of each transaction"
      basis: US card agreement account opening disclosures (last updated 5 February 2025).
      evidence_index: 2
    - kind: card
      paid_by: payer
      amount: "International: late payment up to $40, returned payment up to $29; US: late payment up to 2% of the outstanding balance"
      basis: Card agreements, penalty fees; balances are settled from collateral and can trigger liquidation.
      evidence_index: 1
    - kind: network
      paid_by: payer
      amount: Network gas may be paid by the user; Avalanche Card charges no gas fee itself
      basis: Site FAQ footnote.
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://www.avalanchecard.com/
      detail: Avalanche Card site FAQ "Are there any fees when using my card?"; the "What is the Avalanche Card" answer says no gas or conversion fees are charged by Avalanche Card.
      checked_at: 2026-10-09
      quote: "FX Fees: 1% Monthly Account Fee: $0 Virtual Card Issuance: $0 Physical Card: $0 Card Shipping: $0"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://legal.avalanchecard.com/legal/avalanche-card-international-card-agreement-94211945
      detail: International card agreement (Rain Liquidity / Third National), Important Disclosures; penalty fees late payment up to $40, returned payment up to $29.
      checked_at: 2026-10-09
      quote: "Foreign Exchange Fee (non USD): up to 3% - Cross Border Fee: up to 3%"
      archive: data/archive/avalanche-card-ops-international-card-agreement.txt
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://legal.avalanchecard.com/legal/avalanche-card-us-card-agreement-bcc089aa
      detail: "US card agreement account opening disclosures: no annual fee, cash advance none, international transaction 2%, late payment up to 2% of the outstanding balance."
      checked_at: 2026-10-09
      quote: International Transaction N/A None 2% of each transaction in U.S. dollars
      confirmed_at: 2026-10-19
  note: The site FAQ (1% FX) and the agreements (up to 3% + 3% international; 2% US) disagree; the agreements are maxima and binding, the FAQ states current charges. The FAQ's "no conversion fees" line contradicts its own 1% FX line. No ATM fee is listed because no ATM access is documented (see cashout).
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: unknown
  note: "CROPS S1 is unknown for this provider: no collateral contract can be tied to the card. The card agreement says Rain Liquidity and the issuer never hold custody of collateral, but they can liquidate it; the site says assets are owned and custodied by the user. These claims are unverified, so no custody model is recorded."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
licences:
  status: attested
  value:
    - entity: Nimbus LLC d/b/a Third National
      holder: partner
      country: US
      regulator: Not named in any document
      type: Licensed lender and money transmitter; Visa-authorized card issuer (as stated by Rain)
      activities: Card issuance, payment and settlement for the Avalanche Card (issuer named in both card agreements).
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://legal.avalanchecard.com/legal/avalanche-app-privacy-policy-945fafe7
      detail: Avalanche Card privacy policy (the consolidated Rain policy, last updated 16 July 2026), Entity Roles and Data Flows; the change log adds "licensed money transmission" to Third National's scope on 11 July 2026. No regulator, state or licence number is given.
      checked_at: 2026-10-09
      quote: is a licensed lender, money transmitter and Visa-authorized card issuer
      confirmed_at: 2026-10-19
    - tier: documented
      kind: trace
      url: https://api.fdic.gov/banks/institutions?search=NAME:%22Third%20National%22&fields=NAME,CERT,ACTIVE,CITY,STNAME&limit=20
      detail: 'FDIC BankFind institutions API, run 2026-10-09: the closest matches for "Third National" are other banks (Fifth Third Bank, N.A. and inactive banks); a search for NAME:Nimbus with ACTIVE:1 returns 0 institutions. NMLS Consumer Access returned HTTP 403 to a scripted request and was not bypassed; the Puerto Rico OCIF licence check (concesionarios.ocif.pr.gov) failed the TLS handshake.'
      checked_at: 2026-10-09
      recheck: curl -s 'https://api.fdic.gov/banks/institutions?search=NAME:Nimbus&filters=ACTIVE:1&fields=NAME,CERT' | grep -o '"total":[0-9]*'
  note: 'Attested only: Rain describes Third National as Nimbus LLC, a licensed lender and money transmitter, but no register entry was found. FDIC BankFind lists no institution named Third National or Nimbus, so it is not an FDIC-insured bank; the card agreements are governed by Puerto Rico law, but the OCIF licence check could not be reached; NMLS Consumer Access blocked scripted access. The site footer says only that the card is "issued by partners licensed in their respective jurisdictions". Rain Liquidity LLC states it is not a bank; no licence is claimed for it.'
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
