        kind: document
        url: https://legal.avalanchecard.com/legal/avalanche-app-terms-conditions-4b62a44e
        detail: Avalanche App Terms & Conditions (last updated 26 February 2025), opening paragraph; section 17 Governing Law (Montana).
        checked_at: 2026-10-09
        quote: We are Rain Liquidity LLC
        confirmed_at: 2026-10-19
      - tier: documented
        kind: document
        url: https://legal.avalanchecard.com/legal/avalanche-card-international-card-agreement-94211945
        detail: International card agreement, section 15 Governing Law.
        checked_at: 2026-10-09
        quote: These Card Terms will be interpreted in accordance with the laws of Puerto Rico
        archive: data/archive/avalanche-card-ops-international-card-agreement.txt
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
