  B6.1:
    status: evidenced
    value: 'Encryption of sensitive data in transit and at rest, access controls, MFA and tokenization of card data, with PCI DSS for card data (privacy policy, "may include"). Observed: avalanchecard.com refuses TLS 1.1 and accepts TLS 1.2. No data classification stated.'
    evidence:
      - tier: documented
        kind: document
        url: https://legal.avalanchecard.com/legal/avalanche-app-privacy-policy-945fafe7
        detail: "Rain privacy policy, Security section: encryption in transit and at rest, access controls, multifactor authentication, tokenization, PCI DSS for card data."
        checked_at: 2026-10-09
        quote: encryption of sensitive data in transit and at rest
        confirmed_at: 2026-10-19
      - tier: documented
        kind: trace
        url: https://www.avalanchecard.com
        detail: openssl s_client -tls1_1 to www.avalanchecard.com:443 failed with alert protocol version; -tls1_2 negotiated an ECDHE cipher. Run 2026-10-09.
        checked_at: 2026-10-09
        recheck: echo | openssl s_client -connect www.avalanchecard.com:443 -servername www.avalanchecard.com -tls1_1; echo | openssl s_client -connect www.avalanchecard.com:443 -servername www.avalanchecard.com -tls1_2
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.2:
    status: unknown
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.3:
    status: evidenced
    value: Kept as long as necessary; customer identification and transaction records five years or longer after account closure where law requires; biometric data destroyed within three years of last interaction where biometric law applies; blockchain data cannot be deleted. See CROPS P2 for what is collected.
    evidence:
      - tier: documented
        kind: document
        url: https://legal.avalanchecard.com/legal/avalanche-app-privacy-policy-945fafe7
        detail: Rain privacy policy, Retention section.
        checked_at: 2026-10-09
        quote: Customer identification records, transaction records, and related regulated financial services records may be retained for five years or longer following account closure
        confirmed_at: 2026-10-19
    refs:
      - criterion: P2
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
