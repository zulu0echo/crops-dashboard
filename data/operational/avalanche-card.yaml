  B11.3:
    status: evidenced
    value: Rain Liquidity and the issuer may suspend, revoke or cancel the card or deny any transaction at any time, with or without cause or notice; Rain Liquidity may terminate app access or delete the account without warning. The app terms say a suspended user can still export the wallet or withdraw via a block explorer; collateral can be liquidated for unpaid charges. Records are kept five years or longer after closure (B6.3).
    evidence:
      - tier: documented
        kind: document
        url: https://legal.avalanchecard.com/legal/avalanche-card-international-card-agreement-94211945
        detail: International card agreement, section 10 Termination.
        checked_at: 2026-10-09
        quote: in our sole discretion at any time, with or without cause and with or without giving you notice
