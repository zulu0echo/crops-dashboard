    status: evidenced
    value: Rain Liquidity LLC is controller for Avalanche Card services; Nimbus LLC (Third National) is controller for card issuance; Rain entities may act as independent or joint controllers or processors between themselves. No DPIA statement; an EU data protection contact is named.
    evidence:
