  B11.1:
    status: evidenced
    value: Rain Liquidity LLC (app and services; Montana governing law; mailing address in Billings, Montana) and, for the card, the issuer Third National (Nimbus LLC, a Rain affiliate) under Puerto Rico law. The card agreements are three-party between the cardholder, Rain Liquidity and the issuer.
