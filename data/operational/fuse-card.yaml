      evidence_index: 0
    - kind: fx
      paid_by: none
      amount: 0% on transactions with merchants outside the US
      basis: Cardholder agreement long-form disclosure (international transaction fee).
      evidence_index: 1
    - kind: provider
      paid_by: none
      amount: No top-up fee or card transaction fee
      basis: Fuse support page; top-up is a transfer from the Main Account to the Card Account on Solana (network fee paid via Fuse's paymaster, not quantified).
      evidence_index: 2
    - kind: cashout
      paid_by: payer
      amount: "Bank transfer: 1 USD ACH fee or 1 USD SEPA fee; no Fuse fee"
      basis: Fuse support page on bank transfers.
      evidence_index: 3
    - kind: limit
      paid_by: none
      amount: Daily card spending limit up to 2,000 USD by default (user-adjustable; may rise with usage)
      basis: Fuse support page; enforced onchain as the Bridge spending limit.
