  B4.1:
    status: evidenced
    value: Every Fuse wallet has a Device Key (Face ID) and a 2FA Key (iCloud, or a Ledger); the threshold is 1-of-2 until a Recovery Key is added, then 2-of-n, so a second factor is mandatory only after onboarding completes. Card controls (freeze, limit) sit in the same app.
