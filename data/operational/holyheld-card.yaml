fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: 1% off-ramp (stablecoin to fiat) and 1% on-ramp transfers
      basis: Individual pricing page; Terms clause 13 lets Holyheld change fees at any time with notice on the platform.
      evidence_index: 0
    - kind: cashout
      paid_by: payer
      amount: outgoing SEPA 1 EUR, same-day ACH 1 USD, wire 20 USD, FedNow and Faster Payments 0
      basis: Individual pricing page.
      evidence_index: 0
    - kind: provider
      paid_by: none
      amount: membership CHF 0 a year (individual)
      basis: Individual pricing page; membership is by invitation. No card issuance, card FX or ATM fees are published.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: gas and any swap costs on the top-up transaction
      basis: Terms clause 8.10 make the user responsible for fees to complete the transaction; the SDK's gasless options were not assessed.
      evidence_index: 1
  evidence:
    - tier: documented
      kind: document
      url: https://holyheld.com/pricing/individual
      detail: Holyheld individual pricing page (accounts, transfers and ramp fees).
      checked_at: 2026-10-09
      quote: 1% off-ramp transfers
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://holyheld.com/legal/terms-and-conditions
      detail: Terms and Conditions clause 8.10.
      checked_at: 2026-10-09
      quote: You are the sole responsible for executing the transaction correctly, which may include paying fees to complete the transaction
      confirmed_at: 2026-10-12
  note: "Card fees (issuance, FX on non-base-currency spend, ATM) are not published on holyheld.com or in the Terms. Business pricing differs: CHF 500 a year, 0.5% ramp fees, wire 10 USD, SEPA 0 EUR. Whether the top-up into the card balance (CROPS S1) carries the 1% off-ramp fee is not stated."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
