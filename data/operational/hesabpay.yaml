licences:
  status: evidenced
  value:
    - entity: Zinzir Ltd (HesabPay)
      holder: provider
      country: AF
      regulator: Da Afghanistan Bank
      type: Electronic money institution licence
      number: EMI101005
      activities: Electronic money institution; licence date 5 June 2023
      register_url: https://www.dab.gov.af/non-banking-financial-institutions
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://www.dab.gov.af/non-banking-financial-institutions
      quote: "Zinzir Ltd"
      detail: "Da Afghanistan Bank list of licensed electronic money institutions: HesabPay, Name of EMI: Zinzir Ltd, license No: EMI101005, License Date: 5 June 2023, website https://hesab.com/."
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
  note: The terms and privacy policy name HesabPay, Inc. (Delaware) as the contracting party. Neither document states how it relates to the licensee Zinzir Ltd. HesabPay's September 2026 security post says the official app is published under the Zinzir Ltd. brand. No US money-transmitter licence was looked for.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
cashout:
  status: evidenced
  value:
    - countries: [ AF ]
      method: cash_agent
      partner: HesabPay agents (1,200+, E-Hawala)
      evidence_index: 0
    - countries: [ AF ]
      method: bank_transfer
      partner: Linked bank accounts
      evidence_index: 1
    - countries: [ ALL ]
      method: atm
      partner: HesabPay Visa Card (partner-issued), any Visa-enabled ATM
      limits: 20,000 AFN per week, 80,000 AFN per month on the card
      evidence_index: 2
  evidence:
    - tier: documented
      kind: document
      url: https://hesab.com/terms
      quote: "Recipients receive an SMS notification and can collect cash from any of HesabPay"
      detail: Terms s2.4 E-Hawala (cash-out transfers), also usable by recipients without a HesabPay account.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://hesab.com/terms
      quote: "Sending and receiving money from linked bank accounts."
      detail: Terms s1.2 services.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://hesab.com/terms
      quote: "ATM cash withdrawals from any Visa-enabled ATM globally"
      detail: Terms s1.4 HesabPay Visa Card. HesabPay's July 2026 announcement describes the card as virtual, so ATM use may depend on a physical card or a wallet-enabled ATM; this was not checked.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
  note: No cash-out fees are published. ALL for ATM follows the terms' "globally"; the card itself is offered only to HesabPay account holders.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
