slug: hesabpay
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: monthly maintenance, 15 points (active accounts) or AFN 15 (inactive accounts)
      basis: Terms s4.1; HesabPay may adjust with reasonable notice.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: no issuance, periodic, 3DS or SMS fee on the Visa Card
      basis: HesabPay Visa Card FAQ.
      evidence_index: 1
    - kind: fx
      paid_by: payer
      amount: about 1% when converting AFN to USD for card use
      basis: HesabPay Visa Card FAQ; terms s1.4 says card currency exchange is at Da Afghanistan Bank rates.
      evidence_index: 1
    - kind: limit
      paid_by: none
      amount: Visa Card 20,000 AFN per week, 80,000 AFN per month
      basis: HesabPay Visa Card FAQ, which says these limits are set by the Central Bank.
      evidence_index: 1
  evidence:
    - tier: documented
      kind: document
      url: https://hesab.com/terms
      quote: "HesabPay reserves the right to adjust maintenance fees with reasonable notice."
      detail: Terms and Conditions (effective 2026-04-06) s4.1 Monthly Maintenance Charges; s2.2 says statements carry no fee.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://hesab.com/visa/FAQs
      quote: "An approximately 1% foreign-exchange fee may apply when converting funds from AFN to USD"
      detail: HesabPay Visa Card FAQ items 05 (fees) and 06 (limits).
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-12
  note: No published tariff for transfers, E-Hawala cash-out or agent cash-in was found on hesab.com (sitemap read 2026-10-09; /fees and /pricing return 404). Those components are unknown, not zero.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
