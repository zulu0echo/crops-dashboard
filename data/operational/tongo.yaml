      - tier: verified
        kind: onchain
        url: https://starknet-rpc.publicnode.com
        block_number: 11811046
        detail: Binary search with starknet_getClassHashAt finds the v2 USDC ledger first present at Starknet block 11,811,046 (class 0x072c…471e) and its Vault at 11,810,608 (class 0x044d…121f); starknet_getBlockWithTxHashes gives timestamps 1783970097 (2026-07-13T19:14:57Z) and 1783969165. The Relayer appears at 11,811,680. The earliest v1 instance appears at 3,587,879 (1763155393, 2025-11-14T21:23:13Z), class 0x0058…672a.
        checked_at: 2026-10-09
        recheck: for b in 11811045 11811046; do curl -s -X POST -H 'content-type:application/json' https://starknet-rpc.publicnode.com -d '{"jsonrpc":"2.0","id":1,"method":"starknet_getClassHashAt","params":{"block_id":{"block_number":'$b'},"contract_address":"0x00b32618c475b2fb50b0facd2c49136be6e77281834dc86bdae652680faad4d3"}}' | jq -c '.result // .error.message'; done
    note: Judgment call. The assessed unit is the v2 ledgers, so the v2 USDC ledger is recorded; v1 instances (separate contracts, still holding funds) are about eight months older. Voyager returned 403 and Starkscan renders client-side, so the timestamps come from a public Starknet JSON-RPC node rather than an explorer API.
