slug: tongo
fees:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value:
    - kind: network
      paid_by: payer
      amount: Starknet v3 fee in STRK; sample 1.456 STRK for a Tongo transfer (42.4M L2 gas, 1,696 L1 data gas)
      basis: Starknet fee formula over L2 gas, L1 gas and L1 data gas at the block's prices plus an optional tip, paid by the submitting Starknet account; all fees go to the sequencer (StarkWare). Set by Starknet, not by Tongo.
      evidence_index: 0
    - kind: provider
      paid_by: payer
      amount: Optional relayer fee (fee_to_sender), set per operation by the user; 0 when the user submits directly
      basis: Only on the gasless Relayer path. Tongo.cairo pays fee_to_sender from the sender's encrypted balance to the caller in ERC-20 at the Vault rate; the Relayer executes only when fees cover its gas plus a configurable margin.
      evidence_index: 1
  evidence:
    - tier: verified
      kind: onchain
      url: https://starknet-rpc.publicnode.com
      block_number: 12474497
      detail: starknet_getTransactionReceipt for 0x1c865f68…3949 (a TransferEvent on the v2 USDC ledger 0x00b3…d4d3, Starknet block 12,474,497, 2026-07-29 21:13:42 UTC) returns actual_fee 0x1433e87959c49180 FRI (1.456 STRK). Other transfers on that ledger paid 1.33 to 1.46 STRK, withdrawals 0.70 to 1.04 STRK. Read through a public Starknet JSON-RPC endpoint; any node returns the same receipt.
      checked_at: 2026-10-09
      recheck: curl -s -X POST -H 'content-type:application/json' https://starknet-rpc.publicnode.com -d '{"jsonrpc":"2.0","id":1,"method":"starknet_getTransactionReceipt","params":["0x1c865f68ecae417c817c0009a25a1f386266d21a7b0fce999630bfe64e13949"]}' | jq -c '.result | {actual_fee, execution_resources}'
    - tier: verified
      kind: repo
      commit: 7dac05e823f83620fe231605ba81642a178657ad
      checked_at: 2026-10-09
      url: https://github.com/fatlabsxyz/tongo/blob/7dac05e823f83620fe231605ba81642a178657ad/packages/contracts/src/tongo/Tongo.cairo#L236-L255
      path: packages/contracts/src/tongo/Tongo.cairo
      detail: With relayData set, withdraw moves fee_to_sender from the Vault to get_caller_address() and subtracts it from the sender's encrypted balance; transfer and ragequit do the same (L309-L314, L372-L377). There is no other fee in Tongo.cairo or Vault.cairo.
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://docs.starknet.io/learn/protocol/fees
      detail: Starknet fee units (L2 gas, L1 gas, L1 data gas), v3 STRK-denominated limits and tip, and the recipient of fees.
      quote: Starknet does not currently implement burning of fees, and all fees charged are received by the sequencer
      checked_at: 2026-10-09
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://docs.tongo.cash/protocol/relayer.html
      detail: Relayer architecture page; the Relayer uses the AVNU paymaster, pays gas and is reimbursed from the operation's fee.
      quote: carry a fee_to_sender amount that is paid to the Relayer
      checked_at: 2026-10-09
      confirmed_at: 2026-10-12
  note: No protocol fee and no fee to Fat Solutions on the direct path. Funding a Tongo account is an ordinary ERC-20 approve and call, paying the same Starknet fee. Fees are high relative to the amounts moved so far (the v2 USDC Vault held 7.78 USDC at the seed read).
  checked_at: 2026-10-09
custody_model:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
