      index: 0
  note: Agrees with the S1 finding (anchor 3 in substance, capped at 2 for want of schema-compatible onchain evidence). The ERC-20 reserve sits in an ownerless, non-upgradeable Vault released only against the key holder's proof; the ledger owner cannot move funds. Native USDC keeps Circle's freeze power over the Vault address.
  checked_at: 2026-10-09
