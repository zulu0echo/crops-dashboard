    status: evidenced
    value: Provable's privacy notice covers its websites, explorer, SDKs and tools. Personal data is kept no longer than reasonably necessary for the purpose, with retention criteria per legal basis and deletion or de-identification afterwards; no fixed periods. It states no automated decision-making or profiling. Record scanning requires registering a view key with Provable; the notice read does not name a retention period for view keys.
