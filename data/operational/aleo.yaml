    review:
      status: pending
    status: evidenced
    value:
      - date: 2024-12-09
        summary: Consensus V2 (height 2,800,000) updates the block reward and execution cost algorithms.
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L29-L30
      - date: 2025-07-22
        summary: Consensus V8 (height 9,430,000) updates inclusion and record commitment versions and introduces sender ciphertexts.
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L41-L42
      - date: 2025-08-18
