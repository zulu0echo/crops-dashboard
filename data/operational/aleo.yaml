  B5.2:
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
    status: evidenced
    value: Provable API (optional hosted service, default SDK and CLI endpoint). Registration at POST /consumers issues an API key; POST /jwts/:consumerId exchanges it for a signed JWT sent as a Bearer header. Public read endpoints are rate-limited (5 requests per second, 100,000 per day). Key scoping, rotation and JWT lifetime are not documented.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.explorer.provable.com/docs/api/services/get-auth-register
        detail: Auth Register endpoint of the Provable API.
        quote: Registers a new user and issues them an API key.
        checked_at: 2026-10-09
      - tier: documented
        kind: document
        url: https://docs.explorer.provable.com/docs/api/services/issue-jwt
        detail: Issue JWT endpoint; the response Authorization header carries the JWT with the Bearer prefix.
        quote: Issues a signed JWT for a registered consumer
        checked_at: 2026-10-09
      - tier: documented
        kind: document
        url: https://docs.explorer.provable.com/docs/api/v2/intro
        detail: API overview with rate limits and the service groups (SnarkOS mirror, public analytics, delegated proving, record scanning, auth).
        quote: Rate limiting is enforced across all endpoints
        checked_at: 2026-10-09
    note: Position of a hosted service Provable runs; the rail does not require it (any snarkOS client serves the same chain data, see C3). Cross-reference CROPS S5.
    checked_at: 2026-10-09
