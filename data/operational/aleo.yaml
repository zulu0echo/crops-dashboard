slug: aleo
fees:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value:
    - kind: network
      paid_by: payer
      amount: Base fee = size cost + finalize cost; sample 2,308 microcredits (0.002308 credits) for a transfer_private
      basis: Consensus cost in snarkVM, 1 microcredit per byte (quadratic above 5,000 bytes) plus finalize cost; paid via credits.aleo fee_private (hidden payer) or fee_public. Fees go to validators in the block reward. Changes need a consensus version.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Optional priority fee, any amount; 0 in the samples read
      basis: Second public input of fee_private and fee_public in credits.aleo; added to the base fee and orders the mempool.
      evidence_index: 1
  evidence:
    - tier: verified
      kind: repo
      commit: 29343ebbb7970e4240b4444346aeb26e31009bd7
      checked_at: 2026-10-09
      url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/synthesizer/process/src/cost.rs#L576-L583
      path: synthesizer/process/src/cost.rs
      detail: execution_storage_cost charges size_in_bytes microcredits, or size^2 / EXECUTION_STORAGE_FEE_SCALING_FACTOR (5000) above EXECUTION_STORAGE_PENALTY_THRESHOLD (5000 bytes, console/network/src/lib.rs L148-L151); execution_cost_v3 (L510-L528) adds the finalize cost.
      recheck: gh api "repos/ProvableHQ/snarkVM/contents/synthesizer/process/src/cost.rs?ref=29343ebbb7970e4240b4444346aeb26e31009bd7" --jq .content | base64 -d | sed -n 576,583p
    - tier: verified
      kind: repo
      commit: 29343ebbb7970e4240b4444346aeb26e31009bd7
      checked_at: 2026-10-09
      url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/synthesizer/program/src/resources/credits.aleo#L988-L1046
      path: synthesizer/program/src/resources/credits.aleo
      detail: fee_private consumes a private record and returns change to the same owner; fee_public debits the signer's public account mapping. Both take a base amount and a priority fee and add them.
    - tier: verified
      kind: repo
      commit: 29343ebbb7970e4240b4444346aeb26e31009bd7
      checked_at: 2026-10-09
      url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/ledger/block/src/helpers/target.rs#L54-L69
      path: ledger/block/src/helpers/target.rs
      detail: The staking block reward is 5% annual issuance per block plus one third of the coinbase reward plus transaction fees, so fees go to validators and their delegators; none goes to a foundation or developer.
    - tier: verified
      kind: onchain
      url: https://api.explorer.provable.com/v1/mainnet/transaction/at1k0dy4mpj3vercaeq2a0rmvhga5v0h0shw5e2d85g4sr80ufazvqs6vwxx9
      block_number: 22664958
      detail: A credits.aleo/transfer_private transaction in block 22,664,958 (2026-10-09 12:36:36 UTC) pays fee_public with base 2308u64 and priority 0u64. transfer_public transactions in nearby blocks paid 56,166 microcredits (finalize cost). Read through Provable's explorer API; any snarkOS client returns the same transaction.
      checked_at: 2026-10-09
      recheck: curl -s https://api.explorer.provable.com/v1/mainnet/transaction/at1k0dy4mpj3vercaeq2a0rmvhga5v0h0shw5e2d85g4sr80ufazvqs6vwxx9 | jq '.fee.transition.inputs[0:2]'
  note: No protocol or provider fee. The sampled private transfer paid its fee publicly, which reveals the payer; fee_private hides it. Provable's delegated proving and wallets may charge for optional services (the Shield terms mention a Feemaster API); those are outside the rail.
  checked_at: 2026-10-09
custody_model:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
  note: Agrees with the S1 finding (anchor 3 in substance, capped at 2 for want of schema-compatible onchain evidence). transfer_private consumes the payer's record and creates a record owned by the payee in one transition; nobody holds funds in flight. Delegated proving through Provable is optional and receives an authorization, not keys.
  checked_at: 2026-10-09
licences:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: not_applicable
  reason: No operating entity runs the rail. Aleo mainnet is run by a committee of bonded validators and credits.aleo has no admin; Provable and the Aleo Network Foundation maintain software, run optional hosted services and fund grants, but do not transmit or hold users' funds.
  burden: institution
  checked_at: 2026-10-09
cashout:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: not_applicable
  reason: Native-asset rail. The payee receives Aleo credits as a record it owns; converting credits (or stablecoins issued on Aleo, out of scope) to local currency is outside the protocol.
  burden: institution
  checked_at: 2026-10-09
