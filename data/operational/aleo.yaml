        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L43-L44
      - date: 2025-09-16
        summary: Consensus V10 (height 11,205,000) lowers fees and cuts the per-transaction compute spend limit from 100 to 4 credits.
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L45-L46
      - date: 2026-08-04
        summary: Consensus V18 (height 20,794,000) enables native credits record translation and block-wide deployment limits.
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L69-L71
      - date: 2026-10-01
        summary: Consensus V21 (height 22,437,000) activates Varuna V3, the current proof system version.
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L79-L80
    evidence:
      - tier: verified
        kind: repo
        commit: 29343ebbb7970e4240b4444346aeb26e31009bd7
        checked_at: 2026-10-09
        url: https://github.com/ProvableHQ/snarkVM/blob/29343ebbb7970e4240b4444346aeb26e31009bd7/console/network/src/consensus_heights.rs#L22-L81
        path: console/network/src/consensus_heights.rs
        detail: The ConsensusVersion enum documents what each version changes; mainnet heights are at L165-L188. Dates are the activation-block timestamps read from api.explorer.provable.com/v1/mainnet/block/<height>.
    note: 20 consensus upgrades in about 25 months; only the six that touch fees, records or proofs are listed. Each ships in a snarkVM/snarkOS release with a fixed activation height and takes effect when the 23 validators run it.
    checked_at: 2026-10-09
