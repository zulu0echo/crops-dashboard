fees:
  status: evidenced
  value:
    - kind: card
      paid_by: payer
      amount: 20 USD per year membership (virtual card); physical card free plus shipping 24.99 USD (US) or 59.99 USD (international)
      basis: Fee structure page and physical card page; the card is deactivated after 6 months of inactivity.
      evidence_index: 0
    - kind: provider
      paid_by: payer
      amount: Top-up 1% per top-up (fee page); the FAQ says 0.5% and the top-up guide 0.10 USD
      basis: Three Solayer docs pages disagree; the dedicated fee page is listed first.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: 0.15 USD per USD transaction
      basis: Fee structure page and FAQ.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: "Intl card: 0.10 USD + 1.5% per non-USD transaction, plus cross-border up to 3%; US card: 1%"
      basis: International Card Terms disclosures (effective 11 April 2025) and fee page; the FAQ says 0.10 USD + 1.75%; US Card Terms disclosures.
      evidence_index: 1
    - kind: cashout
      paid_by: payer
      amount: ATM withdrawals with the physical card; standard ATM and network fees may apply; no Solayer figure
      basis: Physical card page.
      evidence_index: 2
    - kind: limit
      paid_by: none
      amount: ATM 250 USD per withdrawal (including surcharges), three attempts per rolling 24 hours
      basis: Physical card page; spending limits are otherwise set dynamically by Solayer and the issuer (card terms).
      evidence_index: 2
    - kind: card
      paid_by: payer
      amount: "Penalties (international card): late payment up to 40 USD, returned payment up to 29 USD, liquidation up to 35 USD"
      basis: International Card Terms disclosures; fees may change on 30 days' notice.
      evidence_index: 1
  evidence:
    - tier: documented
      kind: document
      url: https://docs.solayer.org/solayer-pay/fee
      detail: Solayer Pay fee structure page (membership, top-up and transaction fees).
      checked_at: 2026-10-09
      quote: Top-Up Fee 1% per top-up transaction
    - tier: documented
      kind: document
      url: https://docs.solayer.org/resources/legal/intl-card-terms
      detail: International Card Terms, Important Disclosures (effective 11 April 2025).
      checked_at: 2026-10-09
      quote: "Cross Border Fee: up to 3%"
    - tier: documented
      kind: document
      url: https://docs.solayer.org/solayer-pay/card
      detail: Physical Card page, ATM withdrawals and shipping.
      checked_at: 2026-10-09
      quote: "Maximum withdrawal amount per transaction: $250"
    - tier: documented
      kind: document
      url: https://docs.solayer.org/solayer-pay/faq
      detail: FAQ Q11, conflicting top-up and international fees.
      checked_at: 2026-10-09
      quote: Top-Up Fee – 0.5% per top-up
    - tier: documented
      kind: document
      url: https://docs.solayer.org/resources/legal/us-card-terms
      detail: US Card Account Opening Disclosures.
      checked_at: 2026-10-09
      quote: "International Transaction: 1% of each transaction in U.S. dollars"
  note: Solayer's own pages disagree on the top-up fee (1%, 0.5%, 0.10 USD) and the international fee (1.5% or 1.75%); the US Card Terms list no annual fee while the docs charge 20 USD a year. Network fees for deposits are not stated.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
