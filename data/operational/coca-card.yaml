  B6.3:
    status: evidenced
    value: Customer account records normally kept up to six years after the relationship ends; data of never-activated accounts may be deleted after 6 months; with transaction activity, data is kept until the user requests deletion, subject to legal duties. Erasure can be requested. See CROPS P2 for what is collected.
    evidence:
      - tier: documented
        kind: document
        url: https://www.coca.xyz/privacy
        archive: data/archive/coca-card-ops-privacy.txt
        detail: Privacy, Data Use and Retention Notice (dated 4 November 2023), retention section.
        checked_at: 2026-10-09
        quote: We normally keep customer account records for up to six years after your relationship with Coca ends
        confirmed_at: 2026-10-19
    refs:
