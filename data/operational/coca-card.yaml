  B11.3:
    status: evidenced
    value: "COCA may terminate, suspend or limit any user's use at any time without liability; if it withdraws the wallet altogether it will endeavour to give two months' notice; no refund of fees. The user can close the account. COCA says funds stay in the user's self-custodial wallet and private keys can be exported (since August 2026), so balances do not depend on COCA on termination; this is a provider claim not verified in the CROPS file (S1 unknown)."
    evidence:
      - tier: documented
        kind: document
        url: https://www.coca.xyz/terms
        archive: data/archive/coca-card-ops-terms.txt
        detail: COCA Wallet Terms, clauses 6 and 7.
