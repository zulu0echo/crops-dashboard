slug: privacy-pools
fees:
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: Vetting fee 0.5% of each deposit (vettingFeeBPS = 50) on the ETH and USDC pools; 0 on the USDT pool
      basis: Entrypoint assetConfig per asset, set by OWNER_ROLE (0xbow Safe) with no timelock and no event-free path (PoolConfigurationUpdated). Terms state 0.5% and that it may change at 0xbow's discretion; fees accrue in the Entrypoint and only OWNER_ROLE can withdraw them.
      evidence_index: 0
    - kind: provider
      paid_by: payee
      amount: Relay fee set by the relayer, deducted from the withdrawal; onchain cap 10% (maxRelayFeeBPS 1000)
      basis: Optional; only on withdrawals relayed through the Entrypoint. Each relayer sets fee_bps in its config (example config 500-1000); the Entrypoint reverts above the per-asset cap.
      evidence_index: 1
    - kind: limit
      paid_by: none
      amount: Minimum deposit 0.01 ETH (ETH pool); 25 USDC; 25 USDT
      basis: assetConfig minimumDepositAmount, set by OWNER_ROLE.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Ethereum gas for deposit; gas for withdrawal paid by the payee or by the relayer (recovered through the relay fee)
      basis: Network fee, not set by the protocol.
      evidence_index: 1
  evidence:
    - tier: verified
      kind: onchain
      url: https://sourcify.dev/server/v2/contract/1/0x15e355024de1CDc74ADdea7EBDf98418Ba5B1a2c
