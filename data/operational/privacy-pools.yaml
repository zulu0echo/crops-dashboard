      recheck: cast call 0x6818809EefCe719E480a7526D76bD3e561526b46 "assetConfig(address)(address,uint256,uint256,uint256)" 0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE --rpc-url https://ethereum-rpc.publicnode.com
      check:
        call: "0xd6dbaf58000000000000000000000000eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
        expect: "0x000000000000000000000000f241d57c6debae225c0f2e6ea1529373c9a9c9fb"
      drift: true
    - tier: verified
      kind: repo
      commit: d494b63e79f33bb2b0c8ece6cdacdca465c3b884
      checked_at: 2026-10-09
      url: https://github.com/0xbow-io/privacy-pools-core/blob/d494b63e79f33bb2b0c8ece6cdacdca465c3b884/packages/contracts/src/contracts/Entrypoint.sol#L150-L175
      path: packages/contracts/src/contracts/Entrypoint.sol
      detail: relay() reverts if relayFeeBPS exceeds maxRelayFeeBPS, deducts the relay fee from the withdrawn amount and pays it to the feeRecipient chosen in the relay data; deposit (L320-L340) deducts vettingFeeBPS before the pool deposit; withdrawFees (L264-L272) is onlyRole(OWNER_ROLE).
      confirmed_at: 2026-10-12
    - tier: verified
      kind: repo
      commit: d494b63e79f33bb2b0c8ece6cdacdca465c3b884
      checked_at: 2026-10-09
      url: https://github.com/0xbow-io/privacy-pools-core/blob/d494b63e79f33bb2b0c8ece6cdacdca465c3b884/docs/docs/toc.md#L176-L192
      path: docs/docs/toc.md
      detail: Terms of Use section 5 sets a Vetting Fee of 0.5% of each deposit, changeable at 0xbow's discretion and non-refundable.
      confirmed_at: 2026-10-12
  note: The USDT pool's vetting fee reads 0 onchain although the terms state 0.5%; the contract value is what is charged. ETH vettingFeeBPS was briefly set to 500 (5%) on 2025-11-23 and back to 50 on 2025-11-27 (see changes).
