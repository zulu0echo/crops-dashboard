    status: evidenced
    value: "The privacy policy states encryption at rest and in transit with reasonable procedural, physical and electronic safeguards; no data classification is stated. Observed: www.tria.so refuses TLS 1.1 and accepts TLS 1.2."
    evidence:
      - tier: documented
        kind: document
        url: https://docs.tria.so/privacy-policy
        detail: Privacy Policy s11, How We Protect Your Information.
        checked_at: "2026-10-09"
        quote: including encryption at rest and during transit
        confirmed_at: 2026-10-19
      - tier: documented
        kind: trace
        url: https://www.tria.so
        detail: "openssl s_client -tls1_1 to www.tria.so:443 failed with alert protocol version; -tls1_2 negotiated ECDHE-ECDSA-CHACHA20-POLY1305. Run 2026-10-09 with LibreSSL 3.3.6."
        checked_at: "2026-10-09"
        recheck: "echo | openssl s_client -connect www.tria.so:443 -servername www.tria.so -tls1_1; echo | openssl s_client -connect www.tria.so:443 -servername www.tria.so -tls1_2"
