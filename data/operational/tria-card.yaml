fees:
  status: evidenced
  value:
    - kind: card
      paid_by: payer
      amount: "Card issue and annual fee: virtual 25 USD, plastic 109 USD, metal 250 USD"
      basis: International Card Terms and US Cardholder Agreement disclosures (fee disclosure date 31 October 2025); sold as Lite, Pro and Max memberships.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: FX up to 3% plus international transactions up to 1% (international terms); US card up to 3%
      basis: Card terms. The help centre says Lite and higher memberships pay no Tria FX fee, Visa FX still applies; the terms are the binding ceiling.
      evidence_index: 0
    - kind: cashout
      paid_by: payer
      amount: "ATM: up to 2 USD + 3% per withdrawal (terms); help centre states 1 USD + 1%; inquiry or decline up to 2 USD"
      basis: Card terms disclosures and help article 14780504 disagree; both recorded.
      evidence_index: 1
    - kind: provider
      paid_by: payer
      amount: Card top-up - no Tria service fee; provider fee for swaps and bridging shown in app
      basis: Help article 14854432; the international card terms also allow a USDC settlement or deposit fee of up to 1%.
      evidence_index: 2
    - kind: limit
      paid_by: none
      amount: ATM 750 USD per transaction, 3 per 24 hours; top-up minimum 10 USD (50 USD for BTC)
      basis: Help articles 14780504 and 14056654; spending limit equals posted collateral.
      evidence_index: 1
  evidence:
    - tier: documented
      kind: document
      url: https://docs.tria.so/card-terms-international
      detail: International Card Terms, Important Disclosures.
      checked_at: "2026-10-09"
      quote: "ATM Fee (Withdraw): Up to $2 + 3%"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://help.tria.so/en/articles/14780504-atm-withdrawals
      detail: Help article on ATM withdrawals (15 May 2026).
      checked_at: "2026-10-09"
      quote: "Per Transaction: Maximum of $750"
      confirmed_at: 2026-10-12
    - tier: documented
      kind: document
      url: https://help.tria.so/en/articles/14854432-what-are-provider-fees
      detail: Help article on provider fees (1 May 2026).
      checked_at: "2026-10-09"
      quote: we do not charge any direct service fees for card deposits at this time
      confirmed_at: 2026-10-12
  note: "Fees in the card terms are maxima (\"up to\"); interest is 0% and late, returned and over-limit fees are not charged. Gas for top-ups is sponsored on most chains (not Solana or Tron)."
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: hybrid
  refs:
    - criterion: S1
