slug: minipay
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: none
      amount: no MiniPay fee on wallet transfers
      basis: MiniPay FAQ; set by Blueboard and changeable.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: Celo network fee, stated as typically under $0.01
      basis: Celo gas, payable in stablecoins; set by the network, not MiniPay.
      evidence_index: 0
    - kind: provider
      paid_by: payee
      amount: $1 + 1% on deposits to a USD virtual account; EUR 1 + 1% on EUR
      basis: MiniPay FAQ (virtual accounts provided by NOAH).
      evidence_index: 1
    - kind: card
      paid_by: none
      amount: no issuance or monthly MiniPay Card fee
      basis: MiniPay FAQ; Visa exchange rates and fees may apply on non-USD purchases.
      evidence_index: 2
    - kind: cashout
      paid_by: payer
      amount: set by third-party ramp providers; FAQ says fee-free local-currency withdrawals are available through some
      basis: MiniPay FAQ; partner fees are not published by MiniPay.
      evidence_index: 1
  evidence:
    - tier: documented
      kind: document
      url: https://minipay.to/faq
      quote: "there are very low network fees (typically less than $0.01) charged on every transaction"
      detail: MiniPay FAQ, "Does MiniPay charge fees?".
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://minipay.to/faq
      quote: "there is a $1 + 1% fee charged on deposits to your USD account"
      detail: MiniPay FAQ, "Are there any fees for receiving payments?" (virtual accounts).
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://minipay.to/faq
      quote: "No, there are no monthly card fees or subscriptions for the MiniPay card."
      detail: MiniPay FAQ, card fees.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
  note: Judgment call. The provider file treats the FAQ as claimed (support content) for CROPS scores, but here it is cited as documented because it is the operator's only published pricing statement. Ramp-partner fees are unknown.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: self_custody
  refs:
    - criterion: S1
      index: 0
  note: Self-custody per the terms (key pair generated on device, recovery phrase backed up to the user's Google account, "not available to us"). The app is closed, so this rests on documents only (CROPS S1 holds at the documented cap). The MiniPay backend still holds account and transaction data, so operator controls apply.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
licences:
  status: unknown
  note: No licence held by Blueboard Limited was found in the terms, privacy statement, FAQ or minipay.to. The terms say Blueboard offers no exchange services and that buying and selling crypto assets is provided by third parties under their own terms, so any licences sit with the unnamed ramp and virtual-account partners (NOAH named for virtual accounts). No regulator register was searched for Blueboard.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
cashout:
  status: evidenced
  value:
    - countries: [ ALL ]
      method: exchange
      partner: Integrated third-party ramp partners (not named per country)
      fee: Partner-set; not published by MiniPay
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://minipay.to/faq
      quote: "You can withdraw funds from MiniPay to your local currency and preferred payment method"
      detail: MiniPay FAQ, "How can I withdraw my funds from MiniPay?"; top-ups and withdrawals are provided by third parties.
      checked_at: "2026-10-09"
      confirmed_at: 2026-10-19
  note: The payout method (bank, mobile money or other) depends on the ramp partner in each country, and MiniPay publishes no per-country partner list, so the method is recorded as exchange through a ramp. Because the wallet is self-custodial, a user can also move stablecoins to any exchange on Celo. The MiniPay Card is digital-only, and no ATM withdrawal is documented.
  checked_at: "2026-10-09"
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
