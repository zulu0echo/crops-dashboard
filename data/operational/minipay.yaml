volume:
  status: not_verifiable
  reason: MiniPay transfers are ordinary stablecoin transfers on Celo, but the provider file lists no settlement contracts. The only MiniPay-specific onchain marker is the SocialConnect issuer's attestations, which identify registered addresses, not MiniPay-originated transfers. A volume figure would need an attribution method that has not been reviewed. Reported figures are not recorded.
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
