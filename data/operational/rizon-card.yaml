fees:
  status: evidenced
  value:
    - kind: card
      paid_by: payer
      amount: Virtual card $10 (free on Gold and Emerald); physical card $49.99 Standard, $24.99 Gold, free Emerald
      basis: Help centre plan comparison; the Global card terms state $10 per virtual card; the site pricing page says "check app".
      evidence_index: 1
    - kind: provider
      paid_by: payer
      amount: "Optional plans: Gold $3.99/month, Emerald $6.99/month"
      basis: Help centre plan comparison; the site advertises Emerald "from just $5.59/month".
      evidence_index: 1
    - kind: fx
      paid_by: payer
      amount: Non-USD card spend 1.7% + $0.10 (Standard); 1.275% Gold; 1.02% Emerald
      basis: Site pricing page and help centre; set by Rizon and changeable.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: "Global card terms: FX fee 1.7% + $0.30, cross-border 0%; US card terms: 1.7% + $0.10"
      basis: Card terms Important Disclosures (Global effective 27 June 2026); conflicts with the $0.10 on the pricing page.
      evidence_index: 2
    - kind: card
      paid_by: payer
      amount: Small transaction fee $0.50 per charge under $1 after 5 free a month ($0.38 Gold, $0.25 Emerald)
      basis: Help centre plan comparison.
      evidence_index: 1
    - kind: cashout
      paid_by: payer
      amount: ATM $1 + 0.65% (Standard and Gold); $0.10 Emerald
      basis: Help centre plan comparison and physical card article.
      evidence_index: 1
    - kind: network
      paid_by: payer
      amount: "Onchain withdrawal or international send: network fee + 0.1%"
      basis: Site pricing page.
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://www.getrizon.com/fees-and-limits
      detail: 'Rizon site "Fees and limits": deposits free, USD card spend free, non-USD 1.7% + $0.1 (1.02% with Emerald), send and onchain withdrawal network fee + 0.1%, no limits; card issuance "check app".'
      checked_at: 2026-10-09
      quote: Card spend (non-USD transactions) 1.7% + $0.1 1.02 % 1.7% + $0.1
      archive: data/archive/rizon-card-ops-fees-and-limits.txt
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://intercom.help/rizon/en/articles/13441035-are-there-any-fees-for-using-rizon
      detail: Rizon help centre, "Are there any fees for using Rizon?", full plan comparison (FX, small-transaction, ATM, card prices).
      checked_at: 2026-10-09
      quote: Physical Visa Platinum Card $49.99 $24.99 (50% off) Free Virtual Visa Platinum Card $10 Free Free
      confirmed_at: 2026-10-19
      drift: true
    - tier: documented
      kind: document
      url: https://intercom.help/rizon/en/articles/11822548-rizon-global-inc-spend-card-terms
      detail: Rizon Global, Inc. Spend Card Terms, Important Disclosures effective 2026-06-27; virtual card issuance $10 per card.
      checked_at: 2026-10-09
      quote: "Foreign Exchange Fee (non USD): 1.7% + $0.3 - Cross Border Fee: 0%"
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
