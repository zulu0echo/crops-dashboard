  B6.1:
    status: evidenced
    value: 'Rizon: "advanced encryption" (no detail). Partner (Rain): encryption in transit and at rest, PCI DSS for card data. Observed: www.getrizon.com refuses TLS 1.1 and accepts TLS 1.2. No data classification.'
    evidence:
      - tier: documented
        kind: document
        url: https://intercom.help/rizon/en/articles/13441542-how-secure-is-rizon
        detail: Rizon help centre, "How secure is Rizon?".
        checked_at: 2026-10-09
        quote: We use advanced encryption
        confirmed_at: 2026-10-26
      - tier: documented
        kind: document
        url: https://legal.raincards.xyz/legal/privacy-policy
        detail: "Rain privacy policy, Security section: encryption in transit and at rest, access controls, multifactor authentication, tokenization, PCI DSS for card data."
        checked_at: 2026-10-09
        quote: encryption of sensitive data in transit and at rest
        confirmed_at: 2026-10-26
      - tier: documented
        kind: trace
        url: https://www.getrizon.com
        detail: openssl s_client -tls1_1 to www.getrizon.com:443 failed with alert protocol version; -tls1_2 negotiated an ECDHE cipher. Run 2026-10-09.
        checked_at: 2026-10-09
        recheck: echo | openssl s_client -connect www.getrizon.com:443 -servername www.getrizon.com -tls1_1; echo | openssl s_client -connect www.getrizon.com:443 -servername www.getrizon.com -tls1_2
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
