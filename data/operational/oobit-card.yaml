  B6.1:
    status: evidenced
    value: "The privacy notice promises reasonable technical, administrative and organisational measures without naming encryption or a data classification. Observed: www.oobit.com still accepts TLS 1.1 (and TLS 1.2), below the partner's TLS 1.2 floor."
    evidence:
      - tier: documented
        kind: document
        url: https://www.oobit.com/legal/privacy-notice
        detail: Privacy Notice (last updated 8 September 2025), section on protecting personal data.
        checked_at: "2026-10-09"
        quote: adopt all reasonable technical, administrative, and organizational measures
      - tier: documented
        kind: trace
        url: https://www.oobit.com
        detail: "openssl s_client -tls1_1 to www.oobit.com:443 negotiated ECDHE-RSA-AES128-SHA; -tls1_2 negotiated ECDHE-ECDSA-CHACHA20-POLY1305. Run 2026-10-09 with LibreSSL 3.3.6."
        checked_at: "2026-10-09"
        recheck: "echo | openssl s_client -connect www.oobit.com:443 -servername www.oobit.com -tls1_1"
    checked_at: "2026-10-09"
