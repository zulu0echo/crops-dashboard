cashout:
  status: not_applicable
  reason: The payee receives stablecoins to its own address; converting them to local currency is outside the product. Daimo's fiat rails are pay-in only, and its Withdrawals component sends stablecoins to a recipient address.
  burden: institution
  evidence:
    - tier: documented
      kind: document
      url: https://docs.daimo.com/guides/fiat
      detail: Fiat guide covers deposits from local bank and wallet rails only.
      checked_at: 2026-10-09
      quote: Users in a country with no enabled fiat rail see crypto, exchange, and wallet
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
