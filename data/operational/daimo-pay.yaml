slug: daimo-pay
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: no published fee; relayer keeps any surplus over the payee minimum (2026-10-07 sample, 30 USDC in and out)
      basis: The executor only checks that the payee receives minOutputAmount, computed from Daimo-signed prices and the session's slippage bps; any surplus goes to the relayer. Commercial pricing is set off-chain per organisation and not published.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: one ERC-20 transfer (or native send) to the session's deposit address, at the source chain's gas price
      basis: The SDK's crypto flow sends the exact amount to the deposit address; no approval is needed (CROPS S3).
      evidence_index: 1
    - kind: network
      paid_by: none
      amount: relayer-paid settlement gas, Base sample 2026-10-07, about 0.0000196 ETH (3,057,526 gas at 0.0064 gwei)
      basis: sameChainFinish submitted by the relayer EOA through the DaimoPayRelayer wrapper (tx 0x8d3d…bd00); the gas includes deploying the deposit address. Recovered by Daimo through pricing not visible here.
      evidence_index: 0
  evidence:
    - tier: verified
      kind: onchain
      url: https://basescan.org/tx/0x8d3d409f5ca6bef78bf3b88f48bc92cf085cc192ee04399b2b7323edf417bd00
      chain_id: 8453
      block_number: 52280330
      detail: "Receipt read 2026-10-09: from relayer 0xA9C3…4E2f to wrapper 0xc88f…eE04; SameChainFinish from the manager with paymentToken USDC, paymentAmount 30000000 and outputAmount 30000000; gasUsed 3057526, effectiveGasPrice 6411200 wei, l1Fee 34968834359 wei. Block time 2026-10-07 05:13 UTC."
      checked_at: 2026-10-09
      recheck: cast receipt 0x8d3d409f5ca6bef78bf3b88f48bc92cf085cc192ee04399b2b7323edf417bd00 --rpc-url https://mainnet.base.org
    - tier: verified
      kind: repo
      url: https://github.com/daimo-eth/sdk/blob/ac0a71453ac249aa991d71059c621e2424322d61/packages/sdk/src/web/hooks/useWalletFlow.ts#L648-L668
      commit: ac0a71453ac249aa991d71059c621e2424322d61
      path: packages/sdk/src/web/hooks/useWalletFlow.ts
      detail: The EVM payment is a single transfer(depositAddress, amount) or native send.
      checked_at: 2026-10-09
  refs:
    - criterion: S1
      index: 1
    - criterion: S1
      index: 2
  note: "Searched for a fee schedule: docs.daimo.com (all guides and the API reference, no fee or pricing page), daimo.com/pricing (404), the terms and privacy notice. Fiat rails and exchange deposits may carry partner fees that were not itemised. No FX margin or limits are published; the relayer surplus is bounded by maxSameChainFinishSlippageBps and related params per session."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: provider_custodial
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
    - criterion: S1
      index: 3
  note: Judgment call. The payer self-custodies until deposit, but funds in flight sit in a deposit address that only the Daimo-run manager and relayers can release, and the relayer runs arbitrary calls on them. Recorded as provider-custodial in flight rather than hybrid. Agrees with S1 (score 0). Daimo's privacy notice calls it noncustodial.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
