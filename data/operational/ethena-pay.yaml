volume:
  status: not_observable
  reason: A card spend emits AllowanceSpent from each user's wallet proxy (about 12,300 wallets, not listed) and a USDe Transfer from the USDe token into Rain collateral 0x6070848b...; the listed BatchExecutor's event carries only call counts, and the spec cannot filter token transfers by recipient. Card spends cannot be summed over listed contracts alone.
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
