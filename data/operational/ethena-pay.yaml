      detail: Pricing page s7, services not currently available.
      checked_at: 2026-10-09
      quote: Wire transfers (outbound)
      confirmed_at: 2026-10-26
    - tier: documented
      kind: document
      url: https://pay.ethena.fi/terms
      detail: Terms of Use, conventional payment infrastructure provided by MoonPay or other Third-Party Providers (Iron Customer Terms, Exhibit G).
      checked_at: 2026-10-09
