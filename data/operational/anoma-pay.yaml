custody_model:
  status: evidenced
  value: hybrid
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
  note: Judgment call. In normal operation only a proof built from the user's keys moves tokens out of the non-upgradeable forwarder, and the terms call AnomaPay non-custodial. The S1 finding (score 0) shows that after a permanent adapter stop the same 3-of-5 signers can appoint an emergency caller who can send the forwarder's tokens anywhere. That is provider control over funds at rest, but only behind a public, irreversible stop, so hybrid rather than provider_custodial; a reviewer may prefer provider_custodial (as for Payy).
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
