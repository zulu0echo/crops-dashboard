slug: plasma-one
facts:
  B1.1:
    status: unknown
    note: No ISO 27001, SOC 2, security page or trust centre found for Plasma One (www.plasma.org/security and /trust return 404; sitemap, terms, privacy policy and card terms read). Rain and Third National not checked.
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B4.1:
    status: evidenced
    value: Wallet access is through linked authentication methods (Apple or Google sign-in, email verification, passkeys, biometrics) and any multi-factor authentication the user enrols in; MFA is optional and users are told to enrol more than one method. Keys are held by a key-management provider (Privy per CROPS components).
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/terms-of-service
        detail: Terms of Service (last updated 15 June 2026) s2.2(a).
        checked_at: 2026-10-09
        quote: which may include Apple or Google sign-in, email verification, passkeys, biometric authentication, and any multi-factor authentication you enroll in
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.3:
    status: evidenced
    value: "KYC/AML data for the relationship plus 5 years (up to 10 where law requires); transaction and blockchain data 5 years; marketing data until opt-out or 24 months' inactivity; communications up to 3 years. Sumsub keeps face data under its own rules (3 years Illinois, 1 year after purpose Texas, otherwise AML period). Onchain data cannot be erased."
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/privacy-policy
        detail: Privacy Policy, Retention.
        checked_at: 2026-10-09
        quote: for the duration of our relationship with you and for five (5) years after that relationship ends
    refs:
      - criterion: P2
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.4:
    status: evidenced
    value: Plasma (Cayman Islands, CO-412800) and Plasma Labs UK Ltd. are joint controllers under Article 26 GDPR / UK GDPR; Sumsub processes biometric KYC data; EEA/UK transfers rely on SCCs and the UK IDTA. No DPIA statement found.
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/privacy-policy
        detail: Privacy Policy, Notice to European users, Controllers.
        checked_at: 2026-10-09
        quote: Plasma and Plasma Labs UK Ltd. are joint controllers of your personal information
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B11.1:
    status: evidenced
    value: Plasma, an exempted company incorporated in the Cayman Islands (CO-412800), with affiliates Plasma Labs UK Ltd. (Companies House 16405367, active, incorporated 24 April 2025) and Plasma US, Inc.; the card agreements are with the issuer, Third National; account services with Bridge Building Inc. (US), Bridge Building Sp. z o.o. (EEA) or Bridge Building Limited (others).
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/terms-of-service
        detail: Terms of Service preamble.
        checked_at: 2026-10-09
        quote: an exempted company with limited liability incorporated under the laws of the Cayman Islands
      - tier: documented
        kind: document
        url: https://find-and-update.company-information.service.gov.uk/company/16405367
        detail: Companies House entry for PLASMA LABS UK LTD (active; incorporated 24 April 2025; SIC 62011, 62012).
        checked_at: 2026-10-09
        quote: 24 April 2025
      - tier: documented
        kind: document
        url: https://www.plasma.org/plasma-one-international-card-terms
        detail: International Card Terms, defined terms.
        checked_at: 2026-10-09
        quote: The issuer for this card program is Third National.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B11.3:
    status: evidenced
    value: Plasma may terminate at any time for any or no reason, with or without notice, but for consumers only for a valid reason and with reasonable notice unless immediate action is needed; the issuer may cancel the card at any time with or without notice. Plasma says it does not custody user assets; funds already in Rain collateral need a Rain signature to leave (CROPS S4).
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/terms-of-service
        detail: Terms of Service s13.3.
        checked_at: 2026-10-09
        quote: Plasma reserves the right to terminate this Agreement and your access to the Services at any time, for any or for no reason, with or without notice to you
      - tier: documented
        kind: document
        url: https://www.plasma.org/plasma-one-international-card-terms
        detail: International Card Terms s10 Termination.
        checked_at: 2026-10-09
        quote: we may suspend, revoke or cancel your Account privileges
    refs:
      - criterion: S4
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B12.1:
    status: evidenced
    value: Automated processing (Sumsub's identity verification platform and internal compliance tooling) assesses KYC and AML and can restrict or close accounts. The policy does not say whether these are AI or machine-learning systems.
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/privacy-policy
        detail: Privacy Policy, Automated processing.
        checked_at: 2026-10-09
        quote: internal compliance tooling, to assess KYC and AML obligations
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B12.2:
    status: evidenced
    value: Only an override path is documented (the user can request human review and contest an automated decision that restricts or closes the account). No monitoring, validation, decommissioning or bias evaluation documentation found.
    evidence:
      - tier: documented
        kind: document
        url: https://www.plasma.org/privacy-policy
        detail: Privacy Policy, Automated processing.
        checked_at: 2026-10-09
        quote: you have the right to request human review, express your point of view, and contest the outcome
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
fees:
  status: evidenced
  value:
    - kind: fx
      paid_by: payer
      amount: "International card: FX up to 1% on non-USD spend; cross-border 0%; Platinum: Plasma covers the Visa FX fee"
      basis: International Card Terms Important Disclosures (effective 26 February 2026) and /personal FAQ.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: "US card: 1% international transaction fee; no annual fee; late payment 2% of balance"
      basis: U.S. Consumer Card Terms account-opening disclosures (agreement last updated 12 February 2026).
      evidence_index: 1
    - kind: card
      paid_by: payer
      amount: Core tier 199 USD per year or 20,000 XPL locked for 12 months; Lite tier free
      basis: Plasma One Core page (Core has reduced fees and up to 2 free virtual cards; Lite 1). Tier pricing and card fees otherwise live in the Help Center (not read).
      evidence_index: 2
    - kind: provider
      paid_by: payer
      amount: No Plasma fee; partner fees on FX and bank withdrawals are shown in the app before confirming
      basis: /personal FAQ "Are there fees?".
      evidence_index: 3
    - kind: card
      paid_by: payer
      amount: "International card penalty fees: late payment up to 40 USD, returned payment up to 29 USD"
      basis: International Card Terms Important Disclosures.
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://www.plasma.org/plasma-one-international-card-terms
      detail: International Card Terms, Important Disclosures.
      checked_at: 2026-10-09
      quote: "Foreign Exchange Fee (non USD): up to 1%"
    - tier: documented
      kind: document
      url: https://www.plasma.org/plasma-one-us-card-terms
      detail: U.S. Consumer Card Terms, account-opening disclosures.
      checked_at: 2026-10-09
      quote: "International Transaction: 1% of each transaction in U.S. dollars."
    - tier: documented
      kind: document
      url: https://www.plasma.org/personal/core
      detail: Plasma One Core tier page.
      checked_at: 2026-10-09
      quote: Core for $199 per year or lock 20,000 XPL
    - tier: documented
      kind: document
      url: https://www.plasma.org/personal
      detail: Plasma One personal page FAQ.
      checked_at: 2026-10-09
      quote: Plasma One does not charge any additional fees.
  note: The "Standard" versus "Reduced" fee levels per tier are not quantified on the public pages; the Rewards Addendum points to the Help Center for card fees and tier pricing. Platinum pricing is not shown. Bridge's off-ramp fees are not published.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: hybrid
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
  note: Balances rest in the user's own wallet, but the observed account grants its Rain collateral an unlimited USDT0 allowance that Rain's pull operator uses, and collateral is released only by Rain's Coordinator. Agrees with the S1 finding (score 0, Rain can redirect funds; the sample account is not confirmed as Plasma One's).
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
licences:
  status: unknown
  note: "No licence found in a register. The card terms (US and International) name Third National as issuer; no Plasma document gives its regulator or licence number, and FDIC BankFind lists no active institution of that name. The site footer instead says the card is issued by Rain, a Visa Principal Member, which is a network membership, not a licence. Bridge Building Inc. (US), Bridge Building Sp. z o.o. (EEA) and Bridge Building Limited provide account services; their registrations were not checked. Plasma states it is not a regulated financial institution."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
