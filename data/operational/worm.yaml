fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payee
      amount: 0.5% pool fee on every mint and spend, minted to the Staking reward pool
      basis: BETH constant POOL_SHARE_INV = 200, immutable (no owner, no proxy); deducted from the revealed amount, so the payee receives less.
      evidence_index: 0
    - kind: provider
      paid_by: payee
      amount: Prover fee and broadcaster fee chosen by the payer at burn time; 0 when the payee proves and submits itself
      basis: Bound into the burn-address commitment and paid from the revealed amount; the CLI defaults the prover fee to 0. Fees charged by the hosted prover-2.worm.cx are not published.
      evidence_index: 1
    - kind: network
      paid_by: both
      amount: "Ethereum gas: the burn is a plain ETH transfer; sample mintCoin 393,690 gas at 0.134 gwei (0.0000527 ETH)"
      basis: The payer pays the burn transfer; whoever submits mintCoin (payee or broadcaster) pays its gas. Sample tx 0x2d9afb3d…c433 (2026-10-08).
