volume:
  status: not_observable
  reason: The payer's leg is a plain ETH transfer to an unlinkable burn address (no log). The payee's leg, mintCoin, emits only ERC-20 Transfer logs from the zero address; the sender is an indexed topic, which the volume spec cannot filter, so mints cannot be separated from ordinary BETH transfers and AMM swaps.
  note: A from-topic filter in scripts/volumes.mjs would make mints countable (Transfer from 0x0 on BETH, amount in word 0, including the fee mints to prover, broadcaster and pool). 32 mint transactions in the last 200,000 blocks to 2026-10-09 (read for the gas sample).
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
