  B11.3:
    status: evidenced
    value: Fiat24 may close an account with two months' notice (immediately if the balance is zero) or without notice on breach, and may force a payout of the client's assets and close the account on sanctions, PEP, fraud or recall grounds. Deposits are not covered by the Swiss deposit protection scheme.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/terms-and-conditions-fiat24-users-and-clients
        detail: Fiat24 Terms of Use section 23 (When we can end these Terms of Use).
        checked_at: 2026-10-09
        quote: close your Fiat24 Account, or any Service associated with it by giving you two months prior notice
        confirmed_at: 2026-10-19
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/user/account-types/individual-account
        detail: Fiat24 user manual, Individual Account, Forced Exit.
        checked_at: 2026-10-09
        quote: reserve the right to enforce a mandatory payout
        confirmed_at: 2026-10-19
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/terms-and-conditions-fiat24-users-and-clients
        detail: Fiat24 Terms of Use section 7.
        checked_at: 2026-10-09
        quote: the Swiss Deposit Protection Scheme DOES NOT apply to client deposits with Fiat24
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
