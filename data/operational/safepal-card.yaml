fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: deposit and crypto top-up 0% (standard)
      basis: SafePal fee article (updated 25 July 2026); SafePal's card page still says top-up fees from 0.4% and fiat transfer and deposit fees from 0.6%.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: 1% on Mastercard transactions settled in non-USD currencies
      basis: SafePal fee article; the Fiat24 manual says a matching currency balance is charged first.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: refund processing 1 USD / 1 EUR / 1 CHF / 7 CNH per card refund; no account opening or management fee
      basis: SafePal fee article and Fiat24 MasterCard Debit manual.
      evidence_index: 0
    - kind: cashout
      paid_by: payer
      amount: payout to own bank free (min 100 EUR or CHF); 10 EUR or 10 CHF if the payout is returned
      basis: Fiat24 Cash Payout manual; SafePal says IBAN transfers to external banks are free.
      evidence_index: 1
    - kind: limit
      paid_by: none
      amount: card 1,600 EUR a day contactless, 5,000 EUR a day other; new individual accounts 30,000 USD a month
      basis: SafePal card page FAQ and Fiat24 Individual Account manual (from 5 June 2026).
      evidence_index: 2
    - kind: network
      paid_by: payer
      amount: Arbitrum gas on every transaction
      basis: SafePal fee article (all transactions are onchain).
      evidence_index: 0
  evidence:
    - tier: documented
      kind: document
      url: https://safepalsupport.zendesk.com/hc/en-us/articles/22647224575643-Fee-Rates-for-the-SafePal-Fiat-Gateway-and-Mastercard
      archive: data/archive/safepal-card-ops-fees.txt
      detail: SafePal help centre, Fee Rates for the SafePal Fiat Gateway and Mastercard (linked from the card page as the Pricing and Fee disclosures).
      checked_at: 2026-10-09
      quote: Mastercard transactions settled in non-USD currencies will incur a 1% currency exchange fee
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://docs.fiat24.com/user/payments/cash-payout
      detail: Fiat24 user manual, Cash Payout, Fee section.
      checked_at: 2026-10-09
      quote: Successful Payouts are free
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://www.safepal.com/en/bank
      detail: SafePal card page FAQ on limits and fees.
      checked_at: 2026-10-09
      quote: with fiat transfer and deposit fees being as low as 0.6%
      confirmed_at: 2026-10-19
  note: "Contradiction: SafePal's card page advertises top-up fees from 0.4% and fiat fees from 0.6%, while the fee article it links (updated 25 July 2026) sets the standard deposit and top-up fee at 0%. Recorded as the fee article states; the more recent and more specific source. Fiat24's Terms (section 11) also say crypto top-ups carry a percentage fee per its Pricing page."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: provider_custodial
  refs:
    - criterion: S1
