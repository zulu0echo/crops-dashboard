    - criterion: S1
      index: 1
  note: The card spends Fiat24 cash tokens, which are claims on client deposits at SR Saphirstein AG; they sit in the user's address but Fiat24 operators can move any balance (sendToSundry) and card pulls go to Fiat24-held accounts (S1 = 0).
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
