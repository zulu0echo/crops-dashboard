slug: safepal-card
facts:
  B1.4:
    status: unknown
    note: Fiat24's documents mention no audit or bug bounty (CROPS S6 unknown); SafePal's wallet app is closed and not reviewed here.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B4.1:
    status: evidenced
    value: Account access is by the cardholder's own Arbitrum wallet holding the Fiat24 account NFT (no separate login factor is documented); online card purchases are confirmed with a one-time password sent by email.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/user/payments/mastercard-debit
        detail: Fiat24 user manual, MasterCard Debit, one-time password section.
        checked_at: 2026-10-09
        quote: One-time Password (OTP) per Email
        confirmed_at: 2026-10-19
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/terms-and-conditions-fiat24-users-and-clients
        detail: Fiat24 Terms of Use, account token held in the user's wallet.
        checked_at: 2026-10-09
        quote: Without it, your wallet cannot connect to any Services
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.1:
    status: evidenced
    value: Fiat24 states only that it uses industry standard security measures; no data classification, encryption at rest or TLS commitment is published.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/privacy-policy
        detail: Fiat24 Privacy Policy (effective 14 February 2023) section 5.
        checked_at: 2026-10-09
        quote: We employ industry standard security measures designed to protect the security of all information submitted through the Services
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.3:
    status: evidenced
    value: Information is kept as long as necessary for the stated purposes and as required by law, then deleted or de-identified; no period is stated (see CROPS P2 for what is collected).
    evidence:
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/privacy-policy
        detail: Fiat24 Privacy Policy section 5.
        checked_at: 2026-10-09
        quote: We retain information we collect as long as it is necessary and relevant to fulfill the purposes outlined in this privacy policy
        confirmed_at: 2026-10-19
    refs:
      - criterion: P2
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.4:
    status: evidenced
    value: SR Saphirstein AG (Fiat24), Zurich, is the company responsible under its privacy policy; SafePal's own role as wallet front end is not described there. DPIA availability not found.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/privacy-policy
        detail: Fiat24 Privacy Policy opening paragraph.
        checked_at: 2026-10-09
        quote: entered in the Commercial Register of the Canton of Zurich under the number CHE-256.014.995
        confirmed_at: 2026-10-19
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B10.1:
    status: evidenced
    value: Fiat24's developer guide documents contract addresses, functions and the card authorisation flow (integration and part of the logical architecture); infrastructure architecture and SafePal's app are not documented.
    refs:
      - criterion: O4
        index: 0
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B11.1:
    status: evidenced
    value: SR Saphirstein AG (Fiat24), Zurich, Switzerland (CHE-256.014.995) provides the account and the card; SafePal says Fiat24 solely handles compliance and licensing.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.fiat24.com/legal/terms-and-conditions-fiat24-users-and-clients
        detail: Fiat24 Terms of Use, section 1.
        checked_at: 2026-10-09
        quote: has a license as a fintech company according to Article 1b of the Swiss Banking Act
        confirmed_at: 2026-10-19
      - tier: documented
        kind: document
        url: https://www.uid.admin.ch/Detail.aspx?uid_id=CHE256014995
