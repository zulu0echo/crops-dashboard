fees:
  status: evidenced
  value:
    - kind: fx
      paid_by: payer
      amount: 1% base plus up to 0.5% (Core) or up to 0.25% (Luxe); no added margin for Pinnacle and VIP
      basis: International cardholder agreement section 10 (fee schedule dated 5 Feb 2026) and help-centre limits page; ether.fi may change fees on 30 days' notice.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: 10 USD for the first virtual card in 14 listed countries; otherwise one free virtual card for Core
      basis: Help-centre regional pricing article; shown in the app before ordering.
      evidence_index: 2
    - kind: cashout
      paid_by: payer
      amount: "Bank withdrawal: USD ACH 0.50 USD + 0.20%, Fedwire 20 USD + 0.20%, SWIFT 20 USD + 0.12%, EUR SEPA 0.90 EUR + FX"
      basis: Help-centre bank transfer FAQ; other payout routes are quoted in the app before confirmation.
      evidence_index: 3
    - kind: limit
      paid_by: payer
      amount: ATM 1,000 USD per withdrawal, at most 5 per rolling 24 h; ATM fee not stated
      basis: Help-centre limits page. The membership page lists ATM withdrawals as free up to 10 per month for Pinnacle and VIP only.
      evidence_index: 1
  evidence:
    - tier: documented
      kind: document
      url: https://etherfi.gitbook.io/etherfi/legal/ether.fi-legal/ether.fi-cash-cardholder-agreement-inc.-international
      detail: Cardholder Agreement - Inc. (International), section 10 Foreign Currency Transactions.
      checked_at: 2026-10-09
