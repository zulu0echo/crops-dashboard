    - tier: documented
      kind: document
      url: https://help.ether.fi/en/articles/303623-what-are-the-transaction-limits-and-fees-for-personal-cash-credit-cards
      archive: data/archive/etherfi-cash-ops-limits-and-fees.txt
      detail: Help-centre article on limits and fees per membership level (ATM limits, added FX margin table).
      checked_at: 2026-10-09
      quote: Maximum of five(5) ATM withdrawals in any rolling 24 hour period
    - tier: documented
      kind: document
      url: https://help.ether.fi/en/articles/833743-why-is-there-a-10-fee-for-my-first-virtual-cash-card
      archive: data/archive/etherfi-cash-ops-first-card-fee.txt
      detail: Help-centre article listing the 14 countries where the first virtual card costs 10 USD.
      checked_at: 2026-10-09
      quote: regional pricing means the first virtual Cash card has a $10 fee instead
    - tier: documented
      kind: document
      url: https://help.ether.fi/en/articles/758758-bank-transfers-faqs
      archive: data/archive/etherfi-cash-ops-bank-transfer-faq.txt
      detail: Bank transfers FAQ, funding fee table and outgoing USD bank-transfer fee table.
      checked_at: 2026-10-09
      quote: Outgoing USD bank-transfer fees
