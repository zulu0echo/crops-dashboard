    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B3.3:
    status: evidenced
    value: Published incident response playbook (since Nov 2024, revised July 2026) with runbooks for contract exploit, key compromise, signer loss, oracle and bridge anomalies. It covers the contracts and frontends; no recovery plan for the card backend or card programme is published. For the non-custodial part see CROPS S4.
    evidence:
      - tier: documented
        kind: document
        url: https://etherfi.gitbook.io/etherfi/security/security-and-risks/incident-management/incident-response-playbook
        detail: Playbook purpose and scope paragraph and the runbooks section.
