    status: evidenced
    value: Public incident log with post-mortems (domain account takeover attempt, Kelp rsETH fallout Apr 2026, legacy AtomicQueue exploit Sep 2026); the playbook commits to a post-mortem for every SEV-1 and SEV-2. No public status page found.
