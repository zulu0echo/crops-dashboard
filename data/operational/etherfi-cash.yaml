  B3.1:
    status: evidenced
    value: Published playbook commits to an initial public acknowledgment within 4 hours of a confirmed SEV-1 (active or imminent loss of user funds) and status updates until resolution. No per-customer notification period for data incidents is stated in the Privacy Policy or cardholder agreements.
    evidence:
      - tier: documented
        kind: document
        url: https://etherfi.gitbook.io/etherfi/security/security-and-risks/incident-management/incident-response-playbook
        detail: Incident Response Playbook, Communications section; scope is protocol contracts, keys, oracles, bridges and user-facing infrastructure.
