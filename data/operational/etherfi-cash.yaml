  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
custody_model:
  status: evidenced
  value: hybrid
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
    - criterion: S1
      index: 2
  note: Funds rest in the user's beacon-proxy Safe (owner key in a Turnkey enclave); card spends move to an ether.fi-controlled, upgradeable settlement dispatcher that the 8 h timelock can redirect, and ether.fi plus a third party can recover a Safe after 3 days unless the owner cancels. Agrees with the S1 finding (score 1).
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
licences:
  status: unknown
  note: The cardholder agreements name Third National as issuer under a Visa licence and choose Puerto Rico law, but no first-party document states Third National's regulator, licence type or number. The FDIC BankFind API lists no active institution named Third National (only closed Tennessee banks), which suggests it is not a US insured bank; the Puerto Rico OCIF licence verification site (concesionarios.ocif.pr.gov) failed the TLS handshake from this environment, so the register could not be checked. The provider file context mentions BANEX Microfinance Bank (Nigeria) without a first-party source. ether.fi's risks page says ether.fi itself is not a regulated financial institution.
  checked_at: 2026-10-09
