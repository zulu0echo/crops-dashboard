slug: bitget-wallet-card
fees:
  status: evidenced
  value:
    - kind: provider
      paid_by: payer
      amount: Crypto top-up 1.0% (5 to 8 digit account NFT), 0.5% (4 digits), 0.25% (3 digits)
      basis: Fiat24 pricing for individuals (from 1 June 2024); the terms make the Pricing page part of the contract and say fees may change without notice.
      evidence_index: 0
    - kind: card
      paid_by: payer
      amount: Low-value transaction fee 0.15 USD, EUR or CHF per card payment below 10 (CNH 1.00 below CNH 70)
      basis: Fiat24 price adjust plan, in force from 15 June 2026.
      evidence_index: 1
    - kind: card
      paid_by: payer
      amount: Refund processing fee 1 USD, EUR or CHF (7 CNH) per card refund, capped at the refund amount
      basis: Fiat24 MasterCard Debit page, from 15 May 2026.
      evidence_index: 2
    - kind: card
      paid_by: payer
      amount: No annual or monthly card fee
      basis: Bitget card page, stated for all regional programmes; Fiat24's card page lists no issuance fee.
      evidence_index: 5
    - kind: fx
      paid_by: payer
      amount: Free between EUR24, USD24, CHF24 and CNH24 balances; card conversion rate not stated
      basis: Fiat24 Money Exchange page; the card debits the matching currency balance first ("Direct Pay"), else converts to the default card currency.
      evidence_index: 3
    - kind: cashout
      paid_by: payer
      amount: Bank payout free; 10 EUR or 10 CHF if the payout is returned; minimum payout 100 EUR or 100 CHF
      basis: Fiat24 Cash Payout page.
      evidence_index: 4
    - kind: limit
      paid_by: none
      amount: Card 10,000 EUR/day, 20,000 EUR/month (Standard); account 30,000 USD/30 days for new individuals
      basis: Fiat24 MasterCard Debit and Individual Account pages; higher card tiers for 3 and 4 digit NFTs.
      evidence_index: 2
    - kind: network
      paid_by: payer
      amount: Arbitrum gas for approvals and top-ups
      basis: Fiat24 terms, fee schedule clause d; varies with network conditions.
      evidence_index: 6
  evidence:
