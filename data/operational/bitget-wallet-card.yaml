custody_model:
  status: evidenced
  value: provider_custodial
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
    - criterion: S4
      index: 0
  note: "Agrees with S1 (score 0): the balance is a Fiat24 deposit claim represented by EUR24/USD24/CHF24/CNH24 tokens in the cardholder's address; Fiat24's operator EOA can move any balance with sendToSundry, transfers need a Fiat24-set Live status, and bank payouts need Fiat24's cash operator. Judgment call: recorded as provider_custodial rather than hybrid because the asset itself is a bank liability the issuer controls, not a token the user can exit with."
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
