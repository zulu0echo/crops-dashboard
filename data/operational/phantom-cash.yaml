custody_model:
  status: evidenced
  value: hybrid
  refs:
    - criterion: S1
      index: 0
    - criterion: S1
      index: 1
  note: The user holds the keys to the Cash account, but the CASH mint's permanent delegate (issuer side, Bridge) can move or burn CASH from any holder and a freeze authority can freeze accounts; at payment Bridge draws CASH into its debit-card contract. Agrees with the S1 finding (score 0), which contradicts the FAQ's "self-custodial" statement.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
