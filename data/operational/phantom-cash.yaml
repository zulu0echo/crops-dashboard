fees:
  status: evidenced
  value:
    - kind: card
      paid_by: none
      amount: Virtual card issuance free; domestic US purchases free; no fee for loading the card or replacing it
      basis: Cash fees help article and Lead Bank cardholder agreement; the bank may change fees on notice.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: International purchases "fees may apply", shown before confirming; no figure published
      basis: Cash fees help article.
      evidence_index: 0
    - kind: provider
      paid_by: payer
      amount: 0.85% on swaps out of Cash (except to USDC) and on non-stablecoin swaps into Cash; stablecoin swaps in free
      basis: Cash fees help article; Terms say fees may change without notice and are shown before confirming.
      evidence_index: 0
    - kind: provider
      paid_by: payer
      amount: "Funding: debit card 1.75%, credit card 3.50% (Stripe, US and EU); ACH deposit 0.30%; domestic wire 1.00%"
      basis: Cash fees help article; banks and card partners may add their own fees.
      evidence_index: 1
    - kind: cashout
      paid_by: payer
      amount: Standard ACH withdrawal free; fast ACH withdrawal 1.00 USD + 0.75% (min 1.50 USD)
      basis: Cash fees help article; US except New York.
      evidence_index: 2
    - kind: network
      paid_by: payer
      amount: One-time Solana account setup fee when sending CASH to a wallet that has never held it (varies with SOL price)
      basis: Cash fees help article, described as a network requirement, not a Phantom fee.
      evidence_index: 3
    - kind: limit
      paid_by: none
      amount: 2,000 USD per card transaction; 2,000 USD per day (up to 5,000 after 30 days); money-transfer merchants 500 USD per week
      basis: Lead Bank cardholder agreement (per-transaction limit) and the debit card help article (daily and weekly limits).
      evidence_index: 4
  evidence:
