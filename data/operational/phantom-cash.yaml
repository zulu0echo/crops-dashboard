      url: https://help.phantom.com/articles/cash-fees-44800531617939
      detail: Cash fees help article, onramps and offramps table.
      checked_at: 2026-10-09
      quote: Add cash by debit card, incl. Apple Pay (Stripe, US + EU) 1.75%
    - tier: documented
      kind: document
      url: https://help.phantom.com/articles/cash-fees-44800531617939
      detail: Cash fees help article, onramps and offramps table.
      checked_at: 2026-10-09
