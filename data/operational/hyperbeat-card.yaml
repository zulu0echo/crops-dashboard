  B6.1:
    status: evidenced
    value: "Hyperbeat's privacy policy states no encryption or classification and warns that data in transit may not be secure. For KYC data only, the help centre states Sumsub encrypts data in transit (TLS 1.2+) and at rest in German data centres. Observed: hyperbeat.org refuses TLS 1.1 and accepts TLS 1.2."
    evidence:
      - tier: documented
        kind: document
        url: https://help.hyperbeat.org/en/articles/14196937-how-is-my-kyc-data-handled-and-protected
        detail: Help article on KYC data handling (21 July 2026).
        checked_at: "2026-10-09"
        quote: All personal data is encrypted at rest on servers located in Tier III data centres in Germany (EU)
        confirmed_at: 2026-10-12
      - tier: documented
        kind: trace
        url: https://hyperbeat.org
        detail: "openssl s_client -tls1_1 to hyperbeat.org:443 failed with alert protocol version; -tls1_2 negotiated ECDHE-RSA-CHACHA20-POLY1305. Run 2026-10-09 with LibreSSL 3.3.6."
        checked_at: "2026-10-09"
        recheck: "echo | openssl s_client -connect hyperbeat.org:443 -servername hyperbeat.org -tls1_1; echo | openssl s_client -connect hyperbeat.org:443 -servername hyperbeat.org -tls1_2"
    checked_at: "2026-10-09"
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.2:
    status: unknown
    checked_at: "2026-10-09"
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.3:
    status: evidenced
    value: The privacy policy keeps data "only for so long as necessary" with no periods; Hyperbeat may keep Pay account registration information after termination (Terms). KYC data held by Sumsub is kept 5 years after the relationship ends, with deletion requests processed within 30 days except legally retained records. Account deletion is self-service in settings. See CROPS P2 for what is collected.
    evidence:
      - tier: documented
        kind: document
        url: https://hyperbeat.org/privacy
        detail: Privacy Policy (last updated 21 August 2025), Retention.
        checked_at: "2026-10-09"
        quote: We will retain your personal data only for so long as necessary to fulfill the purposes for which it was collected
        confirmed_at: 2026-10-12
      - tier: documented
        kind: document
        url: https://help.hyperbeat.org/en/articles/14196937-how-is-my-kyc-data-handled-and-protected
        detail: Help article on KYC data retention.
        checked_at: "2026-10-09"
        quote: for AML-regulated services, applicable law requires personal data to be retained for 5 years
        confirmed_at: 2026-10-12
    refs:
