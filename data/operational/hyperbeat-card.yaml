    value: "Hyperbeat documents a provider-exit path: users recover their Turnkey-secured wallet by email one-time code and export the recovery phrase or private key to another wallet without Hyperbeat. This contradicts the architecture docs used for CROPS S1 and S4, under which settlement-token and collateral withdrawals need Operator approval; no recovery plan for Hyperbeat's own service was found."
