      detail: "Rain privacy policy, Entity Roles and Data Flows: describes Nimbus LLC, doing business as Third National, without naming a regulator, state or licence number."
      checked_at: 2026-10-09
      quote: is a licensed lender, money transmitter and Visa-authorized card issuer
    - tier: documented
      kind: trace
      url: https://api.fdic.gov/banks/institutions?search=NAME:%22Third%20National%22&fields=NAME,CERT,ACTIVE,CITY,STNAME&limit=20
      detail: 'FDIC BankFind institutions API, run 2026-10-09: the closest matches for "Third National" are other banks (Fifth Third Bank, N.A. and inactive banks); a search for NAME:Nimbus with ACTIVE:1 returns 0 institutions. NMLS Consumer Access returned HTTP 403 to a scripted request and was not bypassed; the Puerto Rico OCIF licence check (concesionarios.ocif.pr.gov) failed the TLS handshake.'
      checked_at: 2026-10-09
      recheck: curl -s 'https://api.fdic.gov/banks/institutions?search=NAME:Nimbus&filters=ACTIVE:1&fields=NAME,CERT' | grep -o '"total":[0-9]*'
  note: Attested only. Jupiter names "Rain" and "DCS" without entities or licences; DCS and Noah were not identified in any register. FDIC BankFind lists no institution named Third National or Nimbus; NMLS blocked scripted access; the Puerto Rico OCIF check could not be reached.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
