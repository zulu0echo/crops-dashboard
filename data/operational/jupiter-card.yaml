  B11.2:
    status: evidenced
    value: Only fee revenue is documented (FX, ATM, physical card, deposit processing, payout fees). No funding statement or financial statements for Spend.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.jup.ag/user-docs/global/spend/fees-and-limits.md
