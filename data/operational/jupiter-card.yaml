  B11.1:
    status: evidenced
    value: No Jupiter Spend terms are public. The interface Terms of Use name "Jupiter" with a registered address in Grand Cayman under Panama law; the privacy policy names Block Raccoon S.A. (Panama) as controller; neither mentions Spend. Card terms with Rain or DCS are not published.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.jup.ag/user-docs/legal/terms-of-use.md
        detail: Jupiter Terms of Use (interface).
        checked_at: 2026-10-09
