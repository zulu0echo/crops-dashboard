  B1.3:
    status: attested
    value: "Jupiter states nothing for Spend. Partner (Rain, for Rain-issued cards): SOC 2 Type II and PCI DSS, reports available to partners on request; not read."
    evidence:
      - tier: documented
        kind: document
        url: https://www.rain.xyz/security
        detail: Rain security page (Signify Holdings, Inc.), section "Security reports and policies"; the trust center at trust.rain.xyz is a client-rendered Vanta page and was not read.
        checked_at: 2026-10-09
        quote: Partners and prospective partners can request our SOC 2 report, PCI DSS attestation, penetration test summary, and security policies through our trust center
      - tier: documented
        kind: document
        url: https://legal.raincards.xyz/legal/privacy-policy
        detail: Rain privacy policy (last updated 16 July 2026), Security section.
        checked_at: 2026-10-09
        quote: Rain maintains SOC 2 Type II certification
    note: Jupiter's docs name Rain as issuer outside the nine DCS countries, so Rain's statements cover Rain-issued cards only; nothing was found for DCS or Noah.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B1.4:
    status: attested
    value: Jupiter says Rain-card deposits stay onchain as collateral; Rain says its contracts are independently audited before launch and per chain. No report linked and no collateral program identified (CROPS S6 unknown). Jupiter's published audits cover its own onchain programs, not Spend.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.jup.ag/user-docs/global/spend/index.md
        detail: Jupiter Spend overview, deposits.
        checked_at: 2026-10-09
        quote: With a Rain-issued card, they stay on-chain as collateral for the card
      - tier: documented
        kind: document
        url: https://www.rain.xyz/security
        detail: Rain security page, "Smart contract audits"; no report is linked from the page.
        checked_at: 2026-10-09
        quote: Our smart contracts are reviewed by independent auditors before launch and again for each new chain we support
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
