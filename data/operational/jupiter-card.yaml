  B11.3:
    status: evidenced
    value: Jupiter may disable interface access at any time; Spend users are bound by partner terms. Card balances can leave only through the Send routes (Solana wallet or Noah bank transfer, not for every card); DCS-card balances cannot be withdrawn; Rain-card refunds cannot be withdrawn. A Global ID cannot be deleted.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.jup.ag/user-docs/global/spend/risks-and-security.md
        detail: Jupiter Spend, Risks & Security.
        checked_at: 2026-10-09
        quote: Users are subject to the terms, conditions, and operational stability of these partners
