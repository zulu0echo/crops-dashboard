facts:
  B1.1:
    status: unknown
    note: No ISO 27001 statement for Jupiter Spend. Jupiter's security page lists audits of its onchain programs only; Rain lists SOC 2 Type II and PCI DSS; nothing found for DCS or Noah.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B1.2:
    status: unknown
    assessed_by: AI research agent (operational), 2026-10-09
