        url: https://status.rain.xyz/
        detail: Rain Platform Status (cState), with components for onboarding, API, card issuing, authorizations, disputes and collateral, and a paged incident history back to 2025.
        checked_at: 2026-10-09
        quote: We continuously monitor the performance and availability of our services
      - tier: documented
        kind: trace
        url: https://status.rain.xyz/issues/2026-09-28-api-issues-unexpected-declines/
        detail: Read the incident pages listed on status.rain.xyz pages 1 to 3 (2025-06-12 to 2026-09-28) on 2026-10-09. Updates give a one-line cause at most (partner OS patching, payment processor, expired certificate, processor rules engine); the 2026-09-28 incident says the root cause is still being investigated, and no post-mortem is linked from any incident.
        checked_at: 2026-10-09
        recheck: curl -s https://status.rain.xyz/issues/2026-09-28-api-issues-unexpected-declines/ | grep -i "root cause"
