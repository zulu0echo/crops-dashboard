  B6.1:
    status: evidenced
    value: "Jupiter interface privacy policy: encryption in transit and at rest, access controls and NDAs. Partner (Rain): encryption in transit and at rest, PCI DSS. Observed: jup.ag refuses TLS 1.1 and accepts TLS 1.2. No data classification; no Spend-specific policy."
    evidence:
      - tier: documented
        kind: document
        url: https://docs.jup.ag/user-docs/legal/privacy-policy.md
        detail: Jupiter privacy policy, section 9 Data Integrity & Security of Processing.
        checked_at: 2026-10-09
        quote: both during transmission and once it is at rest
      - tier: documented
        kind: document
        url: https://legal.raincards.xyz/legal/privacy-policy
        detail: "Rain privacy policy, Security section: encryption in transit and at rest, access controls, multifactor authentication, tokenization, PCI DSS for card data."
        checked_at: 2026-10-09
        quote: encryption of sensitive data in transit and at rest
      - tier: documented
        kind: trace
        url: https://jup.ag
        detail: openssl s_client -tls1_1 to jup.ag:443 failed with alert protocol version; -tls1_2 negotiated an ECDHE cipher. Run 2026-10-09.
        checked_at: 2026-10-09
        recheck: echo | openssl s_client -connect jup.ag:443 -servername jup.ag -tls1_1; echo | openssl s_client -connect jup.ag:443 -servername jup.ag -tls1_2
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.2:
    status: unknown
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.3:
    status: evidenced
    value: A Global ID cannot be deleted once verified; identity documents are held by SumSub, not Jupiter. The interface privacy policy keeps data as long as needed for its purposes; Rain keeps card records five years or longer after closure. No Spend-specific retention schedule.
    evidence:
      - tier: documented
        kind: document
        url: https://docs.jup.ag/user-docs/global/spend/index.md
        detail: Jupiter Spend overview, Data Handling & Privacy.
        checked_at: 2026-10-09
        quote: Global ID cannot be deleted once created
      - tier: documented
        kind: document
        url: https://legal.raincards.xyz/legal/privacy-policy
        detail: Rain privacy policy, Retention section.
        checked_at: 2026-10-09
        quote: Customer identification records, transaction records, and related regulated financial services records may be retained for five years or longer following account closure
    refs:
