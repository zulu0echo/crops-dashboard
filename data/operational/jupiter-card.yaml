fees:
  status: evidenced
  value:
    - kind: card
      paid_by: payer
      amount: No annual fee; physical card $13.13 plus shipping; Claynosaurz virtual card $25
      basis: Fees & Limits; card orders non-refundable.
      evidence_index: 0
    - kind: network
      paid_by: payer
      amount: "Deposit: none on Solana; Ethereum, Base, Arbitrum, Sui: higher of $0.30 or 0.02% plus gas"
      basis: Fees & Limits; minimum deposit $3 ($10 on Ethereum).
      evidence_index: 1
    - kind: fx
      paid_by: payer
      amount: 1% on non-USD (Rain cards); 1.8% (DCS cards)
      basis: Fees & Limits; set by the issuer.
      evidence_index: 2
    - kind: cashout
      paid_by: payer
      amount: "ATM (Rain only): $1 + 0.65%, plus $0.30 + 1% if non-USD; $0.60 balance inquiry or decline"
      basis: Fees & Limits; DCS cards have no ATM access.
      evidence_index: 3
    - kind: cashout
      paid_by: payer
      amount: "Bank payout via Noah: fixed + variable per corridor, e.g. ACH $2 + 0.05%, SEPA $1 + 0.10%, SWIFT $30 + 0.05%"
      basis: Fees & Limits, Payout Fees; may change.
      evidence_index: 4
    - kind: limit
      paid_by: none
      amount: "DCS: $50,000/day, $990,000/year; Rain: no limit"
      basis: Fees & Limits, Spending Limits.
      evidence_index: 2
  evidence:
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/fees-and-limits.md
      detail: Jupiter Spend Fees & Limits, physical card.
      checked_at: 2026-10-09
      quote: plus shipping, charged to your Spend balance
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/fees-and-limits.md
      detail: Fees & Limits, deposit note.
      checked_at: 2026-10-09
      quote: Direct deposits on Solana have no processing fee
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/fees-and-limits.md
      detail: Fees & Limits, card fees and regional differences.
      checked_at: 2026-10-09
      quote: FX conversion (DCS) | 1.8% on non-USD payments
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/fees-and-limits.md
      detail: Fees & Limits, ATM withdrawal (Rain).
      checked_at: 2026-10-09
      quote: a withdrawal in a currency other than USD adds an FX fee of
    - tier: documented
      kind: document
      url: https://docs.jup.ag/user-docs/global/spend/fees-and-limits.md
      detail: Fees & Limits, Payout Fees table.
      checked_at: 2026-10-09
      quote: Each payout (outgoing transfer) incurs a fixed fee plus a variable fee on the transfer amount
  note: No USD payment fee. Remittance deposits by bank transfer also carry fees (e.g. ACH $2 + 0.05%). The standard virtual card price is not listed.
  checked_at: 2026-10-09
  assessed_by: AI research agent (operational), 2026-10-09
  review:
    status: pending
