      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://about.tuyo.com/Tuyo-Cardholder-Agreement-International-1a2bde1470928005b618dc59f919cac2
      archive: data/archive/tuyo-card-ops-cardholder-international.txt
      detail: International cardholder agreement, Important Disclosures.
      checked_at: 2026-10-09
      quote: "Foreign Exchange Fee (non-USD): up to 3%"
    - tier: documented
      kind: document
      url: https://help.tuyo.com/guides/faq.html
      detail: Tuyo FAQ, fees.
      checked_at: 2026-10-09
      quote: Tuyo charges a volume fee of 25 basis points (0.25%)
      confirmed_at: 2026-10-19
    - tier: documented
      kind: document
      url: https://help.tuyo.com/guides/atm-withdrawals.html
      detail: ATM withdrawals guide, fees and FX.
      checked_at: 2026-10-09
      quote: ATM withdrawal fees and FX markups depend entirely on the ATM operator
      confirmed_at: 2026-10-19
