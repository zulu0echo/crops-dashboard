fees:
  status: evidenced
  value:
    - kind: card
      paid_by: none
      amount: No issuance, monthly or yearly fee
      basis: help.tuyo.com Tuyo Card guide; US cardholder agreement lists 0 USD annual fee.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: 1% FX fee on non-USD spend plus 1% abroad fee (card provider) outside the US; up to 2% per purchase
      basis: Card guide and FAQ. The international cardholder agreement allows up to 3% FX plus up to 3% cross-border; the US agreement states 1% on international transactions. Fees may change on 30 days' notice.
      evidence_index: 0
    - kind: fx
      paid_by: payer
      amount: "Ceiling in the international agreement: FX up to 3% and cross-border up to 3%"
      basis: Tuyo Cardholder Agreement (International), Important Disclosures effective 7 March 2025.
      evidence_index: 1
    - kind: provider
      paid_by: payer
      amount: 0.25% volume fee on trades; bridging and stablecoin-to-stablecoin trades exempt
      basis: Tuyo FAQ.
      evidence_index: 2
    - kind: cashout
      paid_by: payer
      amount: "ATM: no Tuyo fee stated; ATM operator fees and FX apply and count toward the 250 USD cap"
      basis: ATM withdrawals guide.
      evidence_index: 3
    - kind: limit
      paid_by: none
      amount: Daily card limit up to 50,000 USD for new cards, rising to 100,000 and 200,000 USD with cumulative spend
      basis: Card guide and card limits guide.
      evidence_index: 0
