  B6.3:
    status: evidenced
    value: Deleting the account in the app cancels the Tuyo Card and the virtual bank account numbers at Tuyo's providers; KYC data may be kept by Tuyo and its providers for up to 5 years. The privacy policy (2024) says technical logs are kept "for a limited period" without a figure.
    evidence:
      - tier: documented
        kind: document
        url: https://about.tuyo.com/Delete-your-Tuyo-account-272bde147092806ea058e39f02b4aae4
        archive: data/archive/tuyo-card-ops-delete-account.txt
        detail: Tuyo account deletion page.
        checked_at: 2026-10-09
        quote: all your provided KYC information might be kept by Tuyo and/or our providers for up to 5 years for regulatory reasons
      - tier: documented
        kind: document
        url: https://about.tuyo.com/Privacy-Policy-ab80528d2dfa4860854dee593fbad459
        archive: data/archive/tuyo-card-privacy.txt
        detail: Privacy Policy (17 July 2024), technical information.
        checked_at: 2026-10-09
        quote: These logs are retained for a limited period for diagnostic and security purposes.
    checked_at: 2026-10-09
    assessed_by: AI research agent (operational), 2026-10-09
    review:
      status: pending
  B6.4:
    status: evidenced
    value: The Tuyo privacy policy (17 July 2024) names Tuyo and shares ramp data with Bridge under Bridge's own policy; it predates the card and uses no controller/processor terms. The issuer's notice (Third National) covers card data; BANEX handles Nigerian users' data under the Nigeria Data Protection Act. No DPIA statement found.
    evidence:
      - tier: documented
        kind: document
        url: https://about.tuyo.com/Privacy-Policy-ab80528d2dfa4860854dee593fbad459
        archive: data/archive/tuyo-card-privacy.txt
        detail: Privacy Policy, section 4 Sharing Your Information.
        checked_at: 2026-10-09
        quote: We share your personal information with our partner Bridge which provides you with on and offramp services.
      - tier: documented
        kind: document
        url: https://about.tuyo.com/Account-Opening-Disclosure-1a2bde147092806b8713e3fe2ce0bd76
        archive: data/archive/tuyo-card-ops-account-opening.txt
        detail: Issuer privacy notice published as the Account Opening Disclosure.
        checked_at: 2026-10-09
        quote: WHAT DOES THIRD NATIONAL ("Issuer") DO WITH YOUR PERSONAL INFORMATION?
