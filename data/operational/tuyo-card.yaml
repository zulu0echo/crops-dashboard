    value: "Tuyo, Inc. under the Terms of Service (Delaware law); the card agreements are three-way between the user, Tuyo Inc. and the issuer, Third National; for Nigerian users the card is marketed by BANEX Microfinance Bank Limited. No company-register entry was found."
