    status: evidenced
    value: "Logical view only: Tuyo's help guides describe the signer (BIP-39 key on the device), the ZeroDev Kernel 3.2 smart account on Base, and the separate collateral account with its two release routes (counterparty-signed release, or depositor ejection after a cooldown). No infrastructure or integration architecture is published."
