  B11.3:
    status: evidenced
    value: Tuyo may suspend or terminate an account at its sole discretion without prior notice and may delete account data; the issuer may cancel the card with or without notice. Because the wallet is self-custodial, the Terms say a suspended user can still export the wallet or withdraw via a block explorer; funds already in the card collateral account follow its release rules (counterparty signature or ejection cooldown).
    evidence:
      - tier: documented
        kind: document
        url: https://about.tuyo.com/Terms-of-Service-1f5bde14709281b2a8fff4a20910b4ed
