name: weekly-refresh
# Re-reads every cited source once a week (Mondays 03:17 UTC) and keeps the published data fresh.
# Never changes a score: unchanged sources get confirmed_at, changed ones get drift (cell counts as unknown until a human re-checks).
on:
  schedule: [{ cron: "17 3 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency: { group: weekly-refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RPC_1: ${{ vars.RPC_1 }}
      RPC_10: ${{ vars.RPC_10 }}
      RPC_100: ${{ vars.RPC_100 }}
      RPC_8453: ${{ vars.RPC_8453 }}
      RPC_42161: ${{ vars.RPC_42161 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - run: npm ci
      # Public RPCs and public pages by default. No secrets.
      - name: Re-read every cited source
        run: npm run recheck
      - name: Refresh repository facts
        run: npm run repo-facts || echo "::warning::repo-facts had errors; see log"
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Recompute verified volumes
        run: npm run volumes || echo "::warning::volumes had errors; see log"
      - name: Data still valid
        run: npm run validate:offline && npm run build && npm run check-links
      - name: Commit refreshed data and redeploy
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git diff --quiet data/ && { echo "No changes."; exit 0; }
          git config user.name "crops-refresh-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Weekly refresh $(date -u +%F): confirmed sources, drift flags, repository facts, volumes"
          git pull --rebase origin main && git push origin HEAD:main
          # Pushes made with the workflow token do not trigger other workflows, so start the deploy explicitly.
          gh workflow run ci.yml --ref main
      - name: One issue per drifted provider
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for slug in $(jq -r 'keys[]' drift-report.json); do
            title="Drift: $slug"
            body=$(jq -r --arg s "$slug" '"The weekly refresh found these evidence items changed since they were recorded. Scores have not been changed; the affected cells count as unknown until a human re-checks and updates them.\n\n" + (.[$s] | map("- " + .) | join("\n"))' drift-report.json)
            n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
            if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          done
      - name: Weekly summary issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          title="Weekly refresh summary"
          body=$(jq -r '
            def section(t; m): if (m | length) == 0 then "" else "\n## " + t + "\n\n" + (m | to_entries | map("**" + .key + "**\n" + (.value | map("- " + .) | join("\n"))) | join("\n\n")) + "\n" end;
            "Run " + .date + ". Totals: " + (.totals | to_entries | map("\(.value) \(.key)") | join(", ")) + ".\n\n" +
            "`confirmed`: source unchanged, freshness renewed. `drift`: see the Drift issues. `upstream`: cited code changed on the default branch (the pinned commit still holds; worth a look). `unreadable`: page blocked, client-rendered or down; neither confirmed nor drift. `skip`: not machine re-readable (traces, non-EVM state, historical)." +
            section("Changed upstream"; .upstream) + section("Could not read"; .unreadable) + section("Errors"; .failed)' refresh-report.json | head -c 60000)
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
